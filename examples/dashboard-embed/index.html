<!doctype html>
<!--
  The embedded-dashboard example: a static host page outside this app.

  A host changes exactly FOUR values:
    1. the Datapipelines origin — the stylesheet and the script below are written
       against the placeholder https://dp.example.co; replace it with your
       deployment's origin (the README says it once)
    2. data-dp-proxy-base   — YOUR relay's base (here the placeholder https://app.example.co/dp)
    3. data-dp-dashboard-id — the dashboard's UUID (here the all-zero placeholder)
    4. the theme            — datapipelines.css carries the light theme; for another,
       link /vendor/design-system/themes/<name>.css AFTER it and set
       data-theme="<name>" on <html>

  The dashboard key never appears in this file: the relay attaches it server-side
  (examples/dashboard-proxy/). Run the relay behind your own authentication.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Embedded dashboard</title>

    <!-- The client library's ONE stylesheet: the design tokens, the light theme, the
         base layers and the dashboard styles, with the fonts it names served from the
         same origin. Every Datapipelines asset carries the placeholder origin: on a
         separate host origin a root-relative URL would resolve to the host and never load. -->
    <link rel="stylesheet" href="https://dp.example.co/css/datapipelines.css" />
  </head>

  <body>
    <!-- The board container carries the two values a host configures. The sibling
         div is the parameters pane (used when the dashboard has a parameter set). -->
    <div
      id="dashboard"
      data-dp-embed
      data-dp-proxy-base="https://app.example.co/dp"
      data-dp-dashboard-id="00000000-0000-0000-0000-000000000000"
      data-dp-parameters="parameters"
    ></div>
    <div id="parameters"></div>

    <!-- The client library's ONE script: the chart engine, the runtime, the charts'
         interaction layer and the chart, table and KPI adapters, which register their
         kinds at load. A new chart type arrives inside it: this page does not change.
         Then the host's own boot glue. -->
    <script src="https://dp.example.co/js/datapipelines.js"></script>
    <script src="embed.js"></script>
  </body>
</html>
