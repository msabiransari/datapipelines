# Demo sample-data datasources, registered create-if-absent at startup
# (datasources.md §8A; sample-data design §6). Mounted into the app container by
# the compose `demo` profile and named by
# DATAPIPELINES_BOOTSTRAP_DATASOURCES_FILE.
#
# NO SECRETS HERE. Every credential is a ${VAR} placeholder resolved against the
# app process's environment by the app's OWN substitution (§8A.2) — not Spring's:
# this file is runtime data read after the context is built. Supply the values in
# deploy/secrets.env (see deploy/secrets.env.example); deploy/sample-data/load.sh creates the
# very same login on each engine before the app starts.
#
# ONLY the bare ${VAR} form is supported. `${VAR:-default}` is NOT a placeholder
# to this resolver — the regex is `\$\{[A-Za-z_][A-Za-z0-9_]*}`, so a shell-style
# default would register the literal string as the password and fail at first
# query with an authentication error against a database nobody suspects.
#
# `global: true` is REQUIRED and must be true: registration runs before any
# workspace exists (§8A.1). `readonly: true` writes datasources.is_readonly, so
# every §5.7 enforcement layer applies — that is layer 2 of the three-layer demo
# posture (design §7); layer 3 is the SELECT-only database login the loader
# creates, and layer 1 is workspace scoping.

datasources:
  - name: sample-trips
    display_name: "NYC Taxi Trips (sample)"
    description: >-
      NYC TLC yellow-taxi trips, 2023-01 through 2024-12. trips is a deterministic
      1-IN-16 HASH SAMPLE of all yellow trips (~4.9M rows): multiply a count by 16
      to estimate the population, and never compare it as a share against a
      full-count feed. pickup_ts/dropoff_ts are NAIVE LOCAL New York time (no
      offset); pickup_date is the local date, indexed. Money columns are USD.
      trips_daily (one row per day) and trips_monthly (one row per month x pickup
      zone) are rollups of the SAME sample. Tables: trips, trips_daily,
      trips_monthly; _sample_meta records the artifact version.
    dialect: POSTGRES
    jdbc_url: jdbc:postgresql://postgres:5432/dp_sample_trips
    credential:
      kind: password
      username: ${SAMPLE_DB_USER}
      secret: ${SAMPLE_PG_PASSWORD}
    readonly: true
    global: true

  - name: sample-weather
    display_name: "NYC Weather (sample)"
    description: >-
      NOAA GHCN-Daily observations for five NYC-area stations, 2023-01 through
      2024-12, one row per (station_id, obs_date, element). value is ALREADY in the
      standard unit named by the unit column (TMAX/TMIN in degrees C, PRCP in mm,
      AWND in m/s) — not GHCN's native tenths. obs_date is the local calendar day.
      Tables: stations (id, name, coordinates), observations.
    dialect: MYSQL
    jdbc_url: jdbc:mysql://mysql:3306/dp_sample_weather
    credential:
      kind: password
      username: ${SAMPLE_DB_USER}
      secret: ${SAMPLE_MYSQL_PASSWORD}
    readonly: true
    global: true

  - name: sample-reference
    display_name: "NYC Reference Data (sample)"
    description: >-
      TLC taxi zones and boroughs (location_id is the join key the trip tables'
      pu/do_location_id carry; the table includes non-borough rows such as EWR,
      Unknown and N/A), rate-code and payment-type lookups, and a calendar with one
      row per day of 2023-01..2024-12 carrying day_of_week, is_weekend, is_holiday
      (US federal, OBSERVED dates) and holiday_name ('' on a non-holiday, never
      NULL). SQLite has no DATE type: cal_date is ISO-8601 TEXT — CAST it before
      joining a DATE column. Tables: zones, rate_codes, payment_types, calendar.
    dialect: SQLITE
    # SQLite is a FILE. There is no server, no login, and the xerial driver
    # ignores a username and password entirely.
    #
    # Until 087 this entry carried
    #     username: "sqlite"
    #     password: "sqlite-file-datasource-has-no-authentication"
    # not because anything used them but because the contract had no way to say
    # "there is no credential": `datasource.validation.password_missing` rejected
    # a null-or-EMPTY password on create, and bootstrap registration goes through
    # that same save path with no startup-only shortcut (§8A.3). `credential.kind:
    # none` (datasources.md §3.4) is that way, and V13 stores it as a NULL
    # `credential_encrypted` — the row now says what is true.
    jdbc_url: jdbc:sqlite:/srv/sample/nyc_reference.db
    credential:
      kind: none
    properties:
      jdbc:
        # 1 = SQLiteOpenMode.READONLY on the pinned org.xerial:sqlite-jdbc
        # driver (datasources.md §8A.4 — a PROBED fact, re-verify on any driver
        # upgrade). The similarly named `explicit_readonly` does NOT make the
        # driver refuse writes. This is the driver-level half; `readonly: true`
        # below is the datapipelines-level half, and both are set deliberately.
        open_mode: "1"
    readonly: true
    global: true
