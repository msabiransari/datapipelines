apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "datapipelines.fullname" . }}
  labels:
    {{- include "datapipelines.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "datapipelines.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "datapipelines.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        # The image runs as the non-root `datapipelines` user (deployment.md §3.1).
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: {{ include "datapipelines.name" . }}
          image: {{ include "datapipelines.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # §8.3.2: endpoint removal and SIGTERM are concurrent — the sleep gives the
          # endpoints controller time to stop routing BEFORE the readiness flip and drain.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: {{ required "existingSecret is required — see values.yaml (deployment.md §5.1)" .Values.existingSecret }}
          {{- if hasKey .Values.extraEnv "DATAPIPELINES_DUCKDB_EXTENSION_DIRECTORY" }}{{ fail "set duckdb.extensionDirectory, not extraEnv.DATAPIPELINES_DUCKDB_EXTENSION_DIRECTORY" }}{{- end }}
          {{- if hasKey .Values.extraEnv "DATAPIPELINES_DUCKDB_MEMORY_LIMIT" }}{{ fail "set duckdb.memoryLimit, not extraEnv.DATAPIPELINES_DUCKDB_MEMORY_LIMIT" }}{{- end }}
          {{- range $name := keys .Values.extraEnv }}{{ if eq (upper (replace "." "_" $name)) "LOADER_PATH" }}{{ fail "LOADER_PATH comes from the image, never from extraEnv.LOADER_PATH (deployment.md §9)" }}{{ end }}{{- end }}
          {{- if or .Values.extraEnv .Values.duckdb.extensionDirectory .Values.duckdb.memoryLimit }}
          env:
            {{- if .Values.duckdb.extensionDirectory }}
            - name: DATAPIPELINES_DUCKDB_EXTENSION_DIRECTORY
              value: {{ .Values.duckdb.extensionDirectory | quote }}
            {{- end }}
            {{- if .Values.duckdb.memoryLimit }}
            - name: DATAPIPELINES_DUCKDB_MEMORY_LIMIT
              value: {{ .Values.duckdb.memoryLimit | quote }}
            {{- end }}
            {{- range $name, $value := .Values.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          # /health and /ready are root-level app-port endpoints (rest-api.md §11.1).
          # Liveness is /health only: a draining instance must NOT be killed for
          # being unready (deployment.md §8.3.1).
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: temporary-storage
              mountPath: /tmp
            {{- if .Values.libVolume.enabled }}
            - name: driver-library
              mountPath: /app/lib
              readOnly: true
            {{- end }}
      volumes:
        - name: temporary-storage
          # Disk-backed: DuckDB spills must not consume the pod's memory budget.
          emptyDir:
            {{- if .Values.temporaryStorage.sizeLimit }}
            sizeLimit: {{ .Values.temporaryStorage.sizeLimit | quote }}
            {{- else }}
            {}
            {{- end }}
        {{- if .Values.libVolume.enabled }}
        {{- if ne (len .Values.libVolume.source) 1 }}{{ fail "libVolume.source must contain exactly one trusted volume source (deployment.md §9)" }}{{- end }}
        {{- if hasKey .Values.libVolume.source "persistentVolumeClaim" }}
        {{- if ne (toJson (dig "persistentVolumeClaim" "readOnly" false .Values.libVolume.source)) "true" }}{{ fail "libVolume.source.persistentVolumeClaim.readOnly must be true (deployment.md §9)" }}{{- end }}
        {{- end }}
        - name: driver-library
          {{- toYaml .Values.libVolume.source | nindent 10 }}
        {{- end }}
