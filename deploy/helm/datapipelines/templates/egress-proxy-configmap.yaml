{{- if .Values.lake.egressProxy.enabled }}
{{- $maxAge := include "datapipelines.egressProxy.maxAgeSeconds" . }}
{{/* The egress proxy's Envoy config (#845) — the SAME text as deploy/compose.yml's
     `configs.egress-proxy-envoy` (scripts/helm-check.sh parses both and holds them
     equal), rendered from lake.egressProxy.maxAgeSeconds, the value the app's
     DATAPIPELINES_LAKE_READS_EGRESS_MAX_AGE_SECONDS entry also carries. What each
     part does is documented beside the compose config: max_stream_duration is the
     cut (an active CONNECT tunnel or absolute-form transfer is reset at the age),
     max_connection_duration retires keep-alive connections, timeout: 0s disables
     the 15 s route timeout, /dp-egress is the header-gated self-declaration the
     app's boot check reads. No admin listener, no access log, no credentials. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "datapipelines.egressProxy.fullname" . }}
  labels:
    {{- include "datapipelines.egressProxy.labels" . | nindent 4 }}
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: egress
          address:
            socket_address: { address: 0.0.0.0, port_value: {{ include "datapipelines.egressProxy.port" . }} }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: egress
                    common_http_protocol_options:
                      max_connection_duration: {{ $maxAge }}s
                      max_stream_duration: {{ $maxAge }}s
                    upgrade_configs:
                      - upgrade_type: CONNECT
                    route_config:
                      name: egress
                      virtual_hosts:
                        - name: all
                          domains: ["*"]
                          routes:
                            - match: { path: /dp-egress, headers: [{ name: x-dp-egress-check, present_match: true }] }
                              direct_response: { status: 200, body: { inline_string: "max-age={{ $maxAge }}" } }
                            - match: { connect_matcher: {} }
                              route:
                                cluster: dynamic_forward_proxy
                                timeout: 0s
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match: { prefix: / }
                              route:
                                cluster: dynamic_forward_proxy
                                timeout: 0s
                    http_filters:
                      - name: envoy.filters.http.dynamic_forward_proxy
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
                          dns_cache_config: { name: egress_dns, dns_lookup_family: V4_PREFERRED }
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: dynamic_forward_proxy
          lb_policy: CLUSTER_PROVIDED
          cluster_type:
            name: envoy.clusters.dynamic_forward_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
              dns_cache_config: { name: egress_dns, dns_lookup_family: V4_PREFERRED }
{{- end }}
