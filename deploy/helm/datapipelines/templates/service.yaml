apiVersion: v1
kind: Service
metadata:
  name: {{ include "datapipelines.fullname" . }}
  labels:
    {{- include "datapipelines.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  # No sticky sessions (deployment.md §6.2) — the default round-robin is correct.
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "datapipelines.selectorLabels" . | nindent 4 }}
