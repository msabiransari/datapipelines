# Production deployment — deployment.md Appendix A, docs/environments.md.
#
#   docker compose -f deploy/compose.yml \
#     --env-file deploy/env/defaults.env --env-file deploy/secrets.env up -d
#
# COMPOSE IS ONE LOADER, NOT THE CONTRACT (environments.md). Everything this file
# needs is an ordinary environment variable that also works under `java -jar`,
# systemd, Kubernetes, ECS and Nomad. There are exactly TWO env files, in this order:
# deploy/env/defaults.env (tracked, every non-secret default) then deploy/secrets.env
# (git-ignored, the secrets and this deployment's own overrides). Nothing the product
# needs lives only here. `./app.sh --start` is the same thing
# with the env-file list assembled for you.
#
# Secrets are EXTERNAL — never committed; deploy/secrets.env is git-ignored and
# app.sh scaffolds it. Generate them by hand with:
#   openssl rand -base64 32  # DATAPIPELINES_JWT_SECRET, DATAPIPELINES_DB_ENCRYPTION_KEY
#   openssl rand -base64 24  # SPRING_DATASOURCE_PASSWORD, DATAPIPELINES_REDIS_PASSWORD
#
# The app image is built via `./gradlew bootJar` and containerised via
# the Dockerfile at the repo root (deployment.md §6.1).
#
# OIDC providers: the stock `google` entry ships in the image's application.yml and
# binds GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET. At least one authentication method
# is required — a fully-configured OIDC provider or local accounts (auth.md §5A) —
# or startup fails (ConfigValidator §7). More providers than the stock one need a
# yml: mount it and set SPRING_CONFIG_ADDITIONAL_LOCATION (environments.md).

# Pinned to an explicit project name so every container this stack creates
# carries the dp- prefix (dp-postgres-1, dp-datapipelines-1, …) — the
# datapipelines instances are distinguishable at a glance from the other
# projects on a shared Docker host. The pin also exists because Compose
# derives the project name from the DIRECTORY: without explicit names, this
# file and compose.laptop-infra.yml form the SAME project and their same-named
# services replace each other (bit us live, 2026-08-28).
# The volumes derive their names from COMPOSE_PROJECT_NAME below — which `-p`
# sets — so a second isolated copy gets its own data with the flag alone (T116).
# The default `dp` keeps the historical names byte-for-byte.
name: dp

services:
  datapipelines:
    image: ghcr.io/datapipelines/datapipelines:1.0.0
    ports:
      # APP_HOST_PORT is the LANE knob, not app config (hence no DATAPIPELINES_
      # prefix — compose-env-audit.sh scopes that namespace to keys the app binds).
      # A second isolated project (`-p <lane>`) needs its own host port or it collides
      # with the first on 8080; deployment.md §6.3A promotion rehearsal is the case
      # that needs it. Unlike the volume names below, this cannot be derived from the
      # project name — a port is a number — so app.sh refuses a non-default project
      # with no APP_HOST_PORT rather than letting it bind the live stack's port.
      # The container port never moves.
      - "${APP_HOST_PORT:-8080}:8080"
    environment:
      # The metadata DB lives on this compose network; only the PASSWORD comes from
      # deploy/secrets.env, under the SAME name the app binds — a bare `java -jar`
      # reads that file and the variable means the same thing there (environments.md).
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/datapipelines
      SPRING_DATASOURCE_USERNAME: datapipelines
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      # Redis on the compose network: the host is the SERVICE name, deliberately not
      # the application.yml default (loopback) — see the compose-env-audit allowlist.
      DATAPIPELINES_REDIS_HOST: redis
      # Redis on the compose network is the SERVICE, so BOTH halves of its address are
      # this file's, not the env file's: deploy/env/defaults.env carries the LAPTOP's
      # published port (6381), and passing that through would point the container at a
      # port nothing listens on inside the network. Same reason as the host line above,
      # and declared beside it in the compose-env-audit allowlist.
      DATAPIPELINES_REDIS_PORT: 6379
      DATAPIPELINES_REDIS_PASSWORD: ${DATAPIPELINES_REDIS_PASSWORD:-}

      # REQUIRED, no fallback. Exactly 32 bytes base64.
      DATAPIPELINES_JWT_SECRET: ${DATAPIPELINES_JWT_SECRET}
      # REQUIRED, exactly 32 bytes base64. Losing this makes every stored
      # datasource credential unrecoverable.
      DATAPIPELINES_DB_ENCRYPTION_KEY: ${DATAPIPELINES_DB_ENCRYPTION_KEY}

      # REQUIRED when OIDC providers are configured (auth.md §5.2). Compose renders the
      # empty default explicitly so an unset variable yields no interpolation warning.
      DATAPIPELINES_AUTH_BASE_URL: ${DATAPIPELINES_AUTH_BASE_URL:-}

      # OIDC (application.yml below): empty = the stock google entry is ignored
      # with a WARN — at least one auth method (OIDC provider or local accounts)
      # must remain, or startup fails (ConfigValidator §7).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Microsoft — only with the single-tenant provider block uncommented in
      # application.yml (auth.md §11.1; multi-tenant /common is unsupported in v1):
      # MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      # MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}

      # Optional local password accounts (auth.md §5A) — empty/false = off, and the
      # deployment behaves exactly as OIDC-only. The seed configures the FIRST
      # ADMIN's one-time credential only (the bootstrap-admin-email account below)
      # and forces a first-login change. Compose defaults MUST mirror
      # application.yml's defaults (empty string overrides nothing here — these
      # keys default to empty in the mounted yml too).
      DATAPIPELINES_AUTH_LOCAL_ENABLED: ${DATAPIPELINES_AUTH_LOCAL_ENABLED:-false}
      DATAPIPELINES_AUTH_LOCAL_BOOTSTRAP_PASSWORD_HASH: ${DATAPIPELINES_AUTH_LOCAL_BOOTSTRAP_PASSWORD_HASH:-}
      DATAPIPELINES_AUTH_LOCAL_BOOTSTRAP_PASSWORD: ${DATAPIPELINES_AUTH_LOCAL_BOOTSTRAP_PASSWORD:-}

      # Optional (empty = off). Bootstrap admin: this email's user row is created
      # with is_admin at FIRST login (auth.md §4.4 — a fresh deployment otherwise
      # has no admin path). Allowlist: restrict login to these email domains
      # (auth.md §4.3 — set it on any internal deployment).
      DATAPIPELINES_AUTH_BOOTSTRAP_ADMIN_EMAIL: ${DATAPIPELINES_AUTH_BOOTSTRAP_ADMIN_EMAIL:-}
      DATAPIPELINES_AUTH_ALLOWLIST_DOMAINS: ${DATAPIPELINES_AUTH_ALLOWLIST_DOMAINS:-}

      # Workspace provisioning (configuration.md §3.17). Compose defaults MUST
      # mirror application.yml's defaults — an empty string here would override
      # the app default and break enum/boolean binding.
      # PROVISIONING_MODE and OPEN_JOIN were REMOVED in RBAC round 1 (D-R11) and are
      # refused BY NAME at startup — an env var here would refuse this stack's own boot,
      # because Spring's relaxed binding reads DATAPIPELINES_WORKSPACES_* as the key.
      # Workspaces are created by super admins; `demo` ships and every user with no
      # membership joins it as a viewer on first login.
      DATAPIPELINES_WORKSPACES_MEMBER_DATASOURCES_ENABLED: ${DATAPIPELINES_WORKSPACES_MEMBER_DATASOURCES_ENABLED:-true}

      # Config-declared startup content (configuration.md §3.18). BOTH ARE PATHS,
      # and EMPTY MEANS OFF — the same shape as the two keys above, and the reason
      # these lines can sit unconditionally in the production file: without the
      # `demo` profile nothing sets them, so the features stay off and the app's
      # effective configuration is byte-for-byte what it was. The demo profile
      # supplies them from the --demo markers, pointing at the read-only sample volume
      # the one-shot loaders populate.
      DATAPIPELINES_BOOTSTRAP_DATASOURCES_FILE: "${SAMPLE_NYC_ON:+/srv/sample/bootstrap-datasources-nyc.yml}${SAMPLE_TRADE_ON:+,/srv/sample/bootstrap-datasources-census.yml}${SAMPLE_LAKE_ON:+,/srv/sample/bootstrap-datasources-lake.yml}"
      DATAPIPELINES_BOOTSTRAP_EXAMPLES_FILE: "${SAMPLE_NYC_ON:+/srv/sample/examples-nyc.json}${SAMPLE_TRADE_ON:+,/srv/sample/examples-trade.json}${SAMPLE_LAKE_ON:+,/srv/sample/examples-lake.json}"

      # The full DATAPIPELINES_* pass-through contract (T32). Every such variable the
      # app binds from its environment is passed here with the SAME default
      # application.yml ships, so a key that works in dev (host env) cannot be silently
      # absent under compose: setting the variable in deploy/secrets.env (or the shell) reaches
      # the container, and leaving it unset yields the shipped default — the effective
      # configuration is byte-for-byte what application.yml alone would produce.
      # scripts/compose-env-audit.sh diffs this block against application.yml's
      # placeholders and fails the audit on any missing line or diverged default.
      DATAPIPELINES_AUTH_TRUSTED_PROXIES: ${DATAPIPELINES_AUTH_TRUSTED_PROXIES:-}
      DATAPIPELINES_AUTH_JWT_TTL_HOURS: ${DATAPIPELINES_AUTH_JWT_TTL_HOURS:-8}
      DATAPIPELINES_AUTH_API_KEYS_CACHE_TTL_SECONDS: ${DATAPIPELINES_AUTH_API_KEYS_CACHE_TTL_SECONDS:-60}
      DATAPIPELINES_AUTH_API_KEYS_DEFAULT_SCOPES: ${DATAPIPELINES_AUTH_API_KEYS_DEFAULT_SCOPES:-read}
      DATAPIPELINES_AUTH_RATE_LIMIT_LOGIN_PER_MINUTE: ${DATAPIPELINES_AUTH_RATE_LIMIT_LOGIN_PER_MINUTE:-10}
      DATAPIPELINES_AUTH_LOCAL_LOCKOUT_MAX_FAILURES: ${DATAPIPELINES_AUTH_LOCAL_LOCKOUT_MAX_FAILURES:-5}
      DATAPIPELINES_AUTH_LOCAL_LOCKOUT_DURATION_MINUTES: ${DATAPIPELINES_AUTH_LOCAL_LOCKOUT_DURATION_MINUTES:-15}
      DATAPIPELINES_RATE_LIMIT_REQUESTS_PER_SECOND: ${DATAPIPELINES_RATE_LIMIT_REQUESTS_PER_SECOND:-100}
      DATAPIPELINES_RATE_LIMIT_REQUESTS_PER_MINUTE: ${DATAPIPELINES_RATE_LIMIT_REQUESTS_PER_MINUTE:-1000}
      DATAPIPELINES_SSE_HEARTBEAT_INTERVAL_SECONDS: ${DATAPIPELINES_SSE_HEARTBEAT_INTERVAL_SECONDS:-15}
      DATAPIPELINES_SSE_DISCONNECT_GRACE_SECONDS: ${DATAPIPELINES_SSE_DISCONNECT_GRACE_SECONDS:-30}
      DATAPIPELINES_SSE_MAX_STREAMS_PER_USER: ${DATAPIPELINES_SSE_MAX_STREAMS_PER_USER:-50}
      DATAPIPELINES_RESULT_TTL_DEFAULT_SECONDS: ${DATAPIPELINES_RESULT_TTL_DEFAULT_SECONDS:-300}
      DATAPIPELINES_RESULT_TTL_MIN_SECONDS: ${DATAPIPELINES_RESULT_TTL_MIN_SECONDS:-60}
      DATAPIPELINES_RESULT_TTL_MAX_SECONDS: ${DATAPIPELINES_RESULT_TTL_MAX_SECONDS:-3600}
      DATAPIPELINES_RESULT_MAX_SIZE_BYTES: ${DATAPIPELINES_RESULT_MAX_SIZE_BYTES:-104857600}
      DATAPIPELINES_RESULT_PAGE_SIZE_ROWS: ${DATAPIPELINES_RESULT_PAGE_SIZE_ROWS:-1000}
      DATAPIPELINES_RESULT_PAGE_MAX_ROWS: ${DATAPIPELINES_RESULT_PAGE_MAX_ROWS:-100000}
      DATAPIPELINES_IDEMPOTENCY_TTL_SECONDS: ${DATAPIPELINES_IDEMPOTENCY_TTL_SECONDS:-86400}
      DATAPIPELINES_EXECUTOR_MAX_PARALLEL_NODES: ${DATAPIPELINES_EXECUTOR_MAX_PARALLEL_NODES:-4}
      DATAPIPELINES_EXECUTOR_MAX_CONCURRENT_EXECUTIONS_PER_USER: ${DATAPIPELINES_EXECUTOR_MAX_CONCURRENT_EXECUTIONS_PER_USER:-10}
      DATAPIPELINES_EXECUTOR_MAX_CONCURRENT_EXECUTIONS_PER_INSTANCE: ${DATAPIPELINES_EXECUTOR_MAX_CONCURRENT_EXECUTIONS_PER_INSTANCE:-100}
      DATAPIPELINES_EXECUTOR_NODE_QUERY_TIMEOUT_SECONDS: ${DATAPIPELINES_EXECUTOR_NODE_QUERY_TIMEOUT_SECONDS:-60}
      DATAPIPELINES_EXECUTOR_EXECUTION_TIMEOUT_SECONDS: ${DATAPIPELINES_EXECUTOR_EXECUTION_TIMEOUT_SECONDS:-600}
      DATAPIPELINES_EXECUTOR_NODE_TIMEOUT_SECONDS: ${DATAPIPELINES_EXECUTOR_NODE_TIMEOUT_SECONDS:-300}
      DATAPIPELINES_EXECUTOR_NODE_TIMEOUT_MAX_SECONDS: ${DATAPIPELINES_EXECUTOR_NODE_TIMEOUT_MAX_SECONDS:-900}
      DATAPIPELINES_EXECUTOR_CANCEL_GRACE_SECONDS: ${DATAPIPELINES_EXECUTOR_CANCEL_GRACE_SECONDS:-5}
      DATAPIPELINES_EXECUTOR_SOURCE_FETCH_SIZE: ${DATAPIPELINES_EXECUTOR_SOURCE_FETCH_SIZE:-1000}
      DATAPIPELINES_EXECUTOR_PROGRESS_WRITE_INTERVAL_SECONDS: ${DATAPIPELINES_EXECUTOR_PROGRESS_WRITE_INTERVAL_SECONDS:-5}
      DATAPIPELINES_EXECUTOR_HEARTBEAT_SECONDS: ${DATAPIPELINES_EXECUTOR_HEARTBEAT_SECONDS:-15}
      # 094 — empty = derived from NODE_QUERY_TIMEOUT_SECONDS + 30 (datasources §5.2).
      DATAPIPELINES_DATASOURCES_RETIRE_CEILING_SECONDS: ${DATAPIPELINES_DATASOURCES_RETIRE_CEILING_SECONDS:-}
      DATAPIPELINES_PIPELINES_MAX_COMPOSITION_DEPTH: ${DATAPIPELINES_PIPELINES_MAX_COMPOSITION_DEPTH:-5}
      DATAPIPELINES_STAGING_H2_MODE: ${DATAPIPELINES_STAGING_H2_MODE:-PostgreSQL}
      DATAPIPELINES_STAGING_H2_MAX_MEMORY_MB: ${DATAPIPELINES_STAGING_H2_MAX_MEMORY_MB:-1024}
      DATAPIPELINES_STAGING_H2_QUERY_TIMEOUT_SECONDS: ${DATAPIPELINES_STAGING_H2_QUERY_TIMEOUT_SECONDS:-60}
      DATAPIPELINES_STAGING_H2_RESULT_BATCH_SIZE: ${DATAPIPELINES_STAGING_H2_RESULT_BATCH_SIZE:-10000}
      DATAPIPELINES_STAGING_H2_INSERT_BATCH_SIZE: ${DATAPIPELINES_STAGING_H2_INSERT_BATCH_SIZE:-1000}
      DATAPIPELINES_TEMPLATES_CACHE_SIZE: ${DATAPIPELINES_TEMPLATES_CACHE_SIZE:-500}
      DATAPIPELINES_TEMPLATES_RENDER_TIMEOUT_MS: ${DATAPIPELINES_TEMPLATES_RENDER_TIMEOUT_MS:-5000}
      DATAPIPELINES_TEMPLATES_MAX_BODY_CHARS: ${DATAPIPELINES_TEMPLATES_MAX_BODY_CHARS:-262144}
      DATAPIPELINES_AUDIT_RETENTION_DAYS: ${DATAPIPELINES_AUDIT_RETENTION_DAYS:-365}
      DATAPIPELINES_EXECUTIONS_EVENT_RETENTION_DAYS: ${DATAPIPELINES_EXECUTIONS_EVENT_RETENTION_DAYS:-7}
      DATAPIPELINES_EXECUTIONS_STALE_TIMEOUT_MINUTES: ${DATAPIPELINES_EXECUTIONS_STALE_TIMEOUT_MINUTES:-60}
      DATAPIPELINES_EXECUTIONS_ERROR_DETAIL: ${DATAPIPELINES_EXECUTIONS_ERROR_DETAIL:-full}
      DATAPIPELINES_OBSERVABILITY_LOGGING_FORMAT: ${DATAPIPELINES_OBSERVABILITY_LOGGING_FORMAT:-json}
      # 074 — the published-endpoint timeout bounds. These three were added to
      # application.yml without their compose pass-throughs; the audit that finds that
      # class of gap only ran by hand, so nothing said so until 075 wired it into the
      # build (T119). min <= default <= max, min >= 1, refused at boot otherwise.
      DATAPIPELINES_ENDPOINTS_TIMEOUT_DEFAULT_SECONDS: ${DATAPIPELINES_ENDPOINTS_TIMEOUT_DEFAULT_SECONDS:-30}
      DATAPIPELINES_ENDPOINTS_TIMEOUT_MIN_SECONDS: ${DATAPIPELINES_ENDPOINTS_TIMEOUT_MIN_SECONDS:-1}
      DATAPIPELINES_ENDPOINTS_TIMEOUT_MAX_SECONDS: ${DATAPIPELINES_ENDPOINTS_TIMEOUT_MAX_SECONDS:-300}

      # 072 — the organisation facts (configuration.md §3.21). Every one of these lands in
      # EVERY execution's Context as an `org_*` key, so a deployment that cannot set them
      # runs every pipeline against the shipped defaults with nothing to say so. The
      # currency symbol's default is written `$$`: a lone `$` is Compose's interpolation
      # sigil, and `$$` is its escape for a literal one (the container receives `$`).
      # 068's key-provider selector; without this line a deployment that sets aws-kms in its env file
      # would silently run on the env provider (compose-env-audit finding, fixed at the 072 merge).
      DATAPIPELINES_DB_KEY_PROVIDER: ${DATAPIPELINES_DB_KEY_PROVIDER:-env}
      DATAPIPELINES_ORG_CURRENCY_NAME: ${DATAPIPELINES_ORG_CURRENCY_NAME:-Dollar}
      DATAPIPELINES_ORG_CURRENCY_SYMBOL: ${DATAPIPELINES_ORG_CURRENCY_SYMBOL:-$$}
      DATAPIPELINES_ORG_FISCAL_START_DATE: ${DATAPIPELINES_ORG_FISCAL_START_DATE:-01-01}
      DATAPIPELINES_ORG_WEEK_START: ${DATAPIPELINES_ORG_WEEK_START:-monday}
      DATAPIPELINES_ORG_TIMEZONE: ${DATAPIPELINES_ORG_TIMEZONE:-UTC}
      DATAPIPELINES_OBSERVABILITY_TRACING_ENABLED: ${DATAPIPELINES_OBSERVABILITY_TRACING_ENABLED:-false}
      DATAPIPELINES_UI_THEME: ${DATAPIPELINES_UI_THEME:-dark}
      # 075 — the two variables an org sets (configuration.md §3.23, environments.md).
      # `DATAPIPELINES_ENV` is the ORG's label for this deployment; `DATAPIPELINES_POSTURE`
      # is the PRODUCT's stance and also selects the Spring profile that carries the
      # posture's defaults (the app derives it — SPRING_PROFILES_ACTIVE is deliberately
      # NOT passed here: an empty pass-through would deactivate the profile the posture
      # just selected, and the validator refuses a value that disagrees anyway).
      # `DATAPIPELINES_DEMO` is a FLAG: the sample-data families to load. Empty = off,
      # and `hardened` refuses a non-empty value at boot.
      DATAPIPELINES_ENV: ${DATAPIPELINES_ENV:-local}
      DATAPIPELINES_POSTURE: ${DATAPIPELINES_POSTURE:-}
      DATAPIPELINES_DEMO: ${DATAPIPELINES_DEMO:-}
      # 089 §D — the bundled DuckDB extension directory (configuration.md §3.25). The ONE
      # default in this block that mirrors the IMAGE, not application.yml: a bare `java -jar`
      # has nothing bundled (empty = the adapter's INSTALL+LOAD, with egress), while this
      # image pre-populates /opt/duckdb/extensions and never INSTALLs. Declared in
      # compose-env-audit.sh's IMAGE_DEFAULT_VARS; set the variable in deploy/secrets.env
      # to point at a self-populated directory instead.
      DATAPIPELINES_DUCKDB_EXTENSION_DIRECTORY: ${DATAPIPELINES_DUCKDB_EXTENSION_DIRECTORY:-/opt/duckdb/extensions}
      #
      # THE TWO POSTURE-DEPENDENT KEYS, and the one place in this file that is NOT a
      # `${VAR:-default}` pass-through (081 §B). Their default IS the posture, and it is
      # carried by the profile above; an env-file default here would outrank the profile
      # and every posture would ship the same stance (075 booted a `hardened` stack with
      # `authoring=on` for exactly that reason, and papered over it by repeating the
      # posture defaults in the env files — the files 081 deleted).
      #
      # A VALUELESS mapping entry is the only form Compose has that passes a variable
      # ONLY WHEN IT IS SET. Measured on this Compose, three forms, one container each:
      #   `${VAR:-}`         unset -> ""      the variable IS set, to empty: profile lost
      #   `${VAR:+${VAR}}`   unset -> ""      same; `:+` yields an empty string, not nothing
      #   `VAR:`             unset -> absent  the profile's default applies
      # and `VAR:` still resolves from an --env-file, so deploy/secrets.env can override
      # either of them explicitly. compose-env-audit.sh knows this form by name and
      # requires it for exactly these two keys; PostureDefaultsSpecDriftTest pins the
      # other half (defaults.env names neither; both profile ymls carry both).
      DATAPIPELINES_AUTH_COOKIE_SECURE:
      DATAPIPELINES_DEPLOYMENT_AUTHORING_ENABLED:
      DATAPIPELINES_AUTH_ALLOW_LOCAL_ONLY: ${DATAPIPELINES_AUTH_ALLOW_LOCAL_ONLY:-false}
      # versioning §10.6 — the promotion peer credential. Both are BEARER SECRETS: keep
      # them in deploy/secrets.env like every other secret, never inline here. Empty server-key
      # means this deployment refuses promotion (fail closed).
      DATAPIPELINES_DEPLOYMENT_PROMOTION_SERVER_KEY: ${DATAPIPELINES_DEPLOYMENT_PROMOTION_SERVER_KEY:-}
      DATAPIPELINES_DEPLOYMENT_PROMOTION_TARGET_URL: ${DATAPIPELINES_DEPLOYMENT_PROMOTION_TARGET_URL:-}
      DATAPIPELINES_DEPLOYMENT_PROMOTION_TARGET_KEY: ${DATAPIPELINES_DEPLOYMENT_PROMOTION_TARGET_KEY:-}

      # The credentials the bootstrap datasources file names as ${...} placeholders.
      # They belong HERE, on the app, not only on the loader: that file is runtime
      # DATA and its placeholders are resolved by the app's own substitution against
      # the APP PROCESS's environment (datasources.md §8A.2) — which is what keeps
      # the shareable datasource manifest free of secrets. Giving them to the loader
      # alone starts the app and fail-fasts it at bootstrap with "references
      # environment variable 'SAMPLE_DB_USER', which is not set in this process's
      # environment" (observed — this is why the demo E2E is a real boot, not a
      # compose-config inspection). Empty without the demo profile, and unread:
      # the bootstrap keys above are empty, so the file is never opened.
      # The USER defaults to dp_demo_ro, matching the loaders' default below — a
      # set-but-EMPTY var passes the app's null-only placeholder check and registered
      # the datasources with username "" on the raw-compose path (023 review F3).
      SAMPLE_DB_USER: ${SAMPLE_DB_USER:-dp_demo_ro}
      SAMPLE_PG_PASSWORD: ${SAMPLE_PG_PASSWORD:-}
      SAMPLE_MYSQL_PASSWORD: ${SAMPLE_MYSQL_PASSWORD:-}
      # The lake family's ${...} placeholders (089 §E — same §8A.2 mechanism as the
      # credentials above). The manifest URL is DERIVED from the tracked pins, not
      # pinned itself; SAMPLE_LAKE_CATALOG_REF stays EMPTY in production (the allowed
      # root is then plain AWS S3) and the mirror deployment sets
      # file:///srv/lake-mirror — see deploy/sample-data/bootstrap-datasources-lake.yml's
      # header, which is the contract for both. Also empty and unread without the
      # demo-lake profile, exactly like the lines above.
      SAMPLE_LAKE_MANIFEST_URL: ${SAMPLE_LAKE_BASE_URL}/${SAMPLE_LAKE_VERSION}/manifest.json
      SAMPLE_LAKE_CATALOG_REF: ${SAMPLE_LAKE_CATALOG_REF:-}
    volumes:
      # 075: deploy/application.yml is GONE. Every line it carried was already in the
      # image's own application.yml behind the same placeholders, so the mount was a
      # second copy of the defaults that could — and did — drift. An org that wants a
      # yml anyway (extra OIDC providers, a house config-management format) mounts one
      # and points SPRING_CONFIG_ADDITIONAL_LOCATION at it; Spring supports that
      # already and environments.md documents it.
      # The sample volume: nyc_reference.db (the SQLITE datasource's file),
      # examples.json, and the bootstrap datasources file. READ-ONLY into the app
      # — the app never writes sample data, and the SQLITE datasource additionally
      # opens the file with the driver's read-only mode (datasources.md §8A.4).
      # Outside the demo profile nothing populates it and nothing points at it,
      # so it is an empty, unread mount.
      - sample-data:/srv/sample:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # `required: false` is load-bearing: without it, `up` WITHOUT the demo
      # profile fails outright with "service datapipelines depends on undefined
      # service sample-data" (verified against this Compose, not assumed). With
      # it, the non-demo path ignores these entries entirely, and the demo path
      # gates the app on both loaders having exited 0 — which is what makes the
      # one-command claim true: by the time the app boots, the databases are
      # loaded and the files it bootstraps from are on the volume.
      sample-data:
        condition: service_completed_successfully
        required: false
      sample-data-mysql:
        condition: service_completed_successfully
        required: false
      sample-data-trade:
        condition: service_completed_successfully
        required: false
      sample-data-trade-mysql:
        condition: service_completed_successfully
        required: false
      sample-data-lake:
        condition: service_completed_successfully
        required: false
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    # Demo sizing, not production advice (deployment.md Appendix B): the demo profile
    # restores an ~804 MB sample `trips` table into this same container, so the compiled
    # defaults (shared_buffers=128MB) leave every demo aggregate reading from the OS cache.
    # Sized for the data, on SSD (random_page_cost=1.1). The memory reservation matches
    # shared_buffers plus headroom so the container runtime knows this service is not small.
    command: postgres -c shared_buffers=512MB -c effective_cache_size=1536MB -c work_mem=32MB -c random_page_cost=1.1
    deploy:
      resources:
        reservations:
          memory: 1G
    environment:
      POSTGRES_DB: datapipelines
      POSTGRES_USER: datapipelines
      # ONE name for the metadata DB password: the app's own SPRING_DATASOURCE_PASSWORD.
      # Compose starts this database, so it is the same secret on both sides — a second
      # spelling (the old METADATA_DB_PASSWORD) meant deploy/secrets.env could not be
      # sourced verbatim by a bare jar, which is the whole point of the env-file contract.
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapipelines -d datapipelines"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${DATAPIPELINES_REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${DATAPIPELINES_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------- demo profile
  #
  # Everything below runs ONLY under a `demo-*` profile (sample-data design
  # §5/§7). Three independent sample-data families, each with its own profile —
  # demo-nyc (mobility), demo-trade (trade/v4) and demo-lake (lake/v1, which
  # has NO loader — nothing downloads; the app reads the published objects in
  # place, so the stage below is a two-file copy, 089 §E) — so an engineer pays
  # for exactly the sample data they asked for. Any combination is fine: the
  # app's bootstrap keys are comma-separated lists built by compose from the
  # SAMPLE_NYC_ON / SAMPLE_TRADE_ON / SAMPLE_LAKE_ON env markers, which app.sh
  # exports from --demo nyc,trade,lake (the sample-data VERSIONS are pinned in
  # deploy/env/defaults.env).
  #
  # WHAT THE NON-DEMO PATH INHERITS, precisely — Compose has no per-profile env,
  # volume or dependency, so the additions to `datapipelines` above are
  # unconditional and each is inert without a profile:
  #   * the two DATAPIPELINES_BOOTSTRAP_* env keys, built from the ON markers
  #     (both empty — feature off — while no marker is set), and the
  #     SAMPLE_* placeholder keys the bootstrap files name, also empty;
  #   * an empty read-only `sample-data` volume mount nothing points at;
  #   * the five `depends_on` entries marked `required: false`, which Compose
  #     ignores when the target service is not enabled;
  #   * the `mysql-data` / `sample-data` volume declarations (Compose drops
  #     `mysql-data` from the rendered config entirely without the profiles,
  #     since no enabled service references it).
  #
  #   docker compose -f deploy/compose.yml -f deploy/compose.local-build.yml \
  #     --profile demo-nyc --profile demo-trade --profile demo-lake up -d --wait
  #
  # Requires the SAMPLE_* keys (deploy/env/defaults.env + deploy/secrets.env) and, for the MySQL
  # sample, an image built with -Pmysql — Connector/J is not in the default build
  # (datasources.md §10.2). deployment.md Appendix B is the quickstart.

  mysql:
    profiles: [demo-nyc, demo-trade]
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    environment:
      MYSQL_ROOT_PASSWORD: ${SAMPLE_MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # MYSQL_PWD, not -p on the command line: an argv password is readable in
      # `ps` by every process in the container.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Stage 1 of the load: downloads and checksum-verifies EVERY artifact, then
  # restores Postgres and places the SQLite database, examples.json and the
  # bootstrap datasources file on the shared volume.
  #
  # It runs on the pinned POSTGRES image because that image has psql and
  # pg_restore of the matching major. Stage 2 runs on the pinned MYSQL image for
  # the same reason. Two services rather than one because no pinned image carries
  # both clients, and installing one at container start would be an unpinned
  # package fetch in the one place that has to be reproducible.
  sample-data:
    profiles: [demo-nyc]
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    entrypoint: ["/bin/sh", "/opt/sample-data/load.sh"]
    command: ["${SAMPLE_BASE_URL:-}", "${SAMPLE_VERSION:-v6}", "--engines", "postgres,sqlite", "--family", "nyc"]
    environment:
      # The metadata-DB superuser: the loader creates the dp_sample_trips
      # database and the SELECT-only demo role, so it needs more than the demo
      # login has. PGDATABASE is the database it connects to in order to do that.
      PGHOST: postgres
      PGUSER: datapipelines
      PGPASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      PGDATABASE: datapipelines
      SAMPLE_DB_USER: ${SAMPLE_DB_USER:-dp_demo_ro}
      SAMPLE_PG_PASSWORD: ${SAMPLE_PG_PASSWORD}
      SAMPLE_DIR: /srv/sample
    volumes:
      - ./sample-data:/opt/sample-data:ro
      - sample-data:/srv/sample
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Stage 2: the MySQL half. Re-verifies the artifacts it uses off the shared
  # volume before restoring — the checksums are cheap and the alternative is
  # trusting that nothing touched the volume between the two services.
  sample-data-mysql:
    profiles: [demo-nyc]
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    entrypoint: ["/bin/sh", "/opt/sample-data/load.sh"]
    command: ["${SAMPLE_BASE_URL:-}", "${SAMPLE_VERSION:-v6}", "--engines", "mysql", "--family", "nyc"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${SAMPLE_MYSQL_ROOT_PASSWORD}
      SAMPLE_DB_USER: ${SAMPLE_DB_USER:-dp_demo_ro}
      SAMPLE_MYSQL_PASSWORD: ${SAMPLE_MYSQL_PASSWORD}
      SAMPLE_DIR: /srv/sample
    volumes:
      - ./sample-data:/opt/sample-data:ro
      - sample-data:/srv/sample
    depends_on:
      mysql:
        condition: service_healthy
      sample-data:
        condition: service_completed_successfully
    restart: "no"


  # The trade family (trade/v4): two one-shot services mirroring the nyc pair.
  # No Postgres artifact exists in this family, so the file stage needs no
  # engine client at all — it downloads, verifies and places us_trade.duckdb,
  # fx_rates.db and the family examples + bootstrap files. It still runs
  # on the pinned postgres image for the same reproducibility reason as stage 1
  # above (that image carries wget + sha256sum; the image must be PINNED, not
  # picked for its tools).
  sample-data-trade:
    profiles: [demo-trade]
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    entrypoint: ["/bin/sh", "/opt/sample-data/load.sh"]
    command: ["${SAMPLE_TRADE_BASE_URL:-}", "${SAMPLE_TRADE_VERSION:-v4}", "--engines", "sqlite", "--family", "trade"]
    environment:
      SAMPLE_DIR: /srv/sample
    volumes:
      - ./sample-data:/opt/sample-data:ro
      - sample-data:/srv/sample
    restart: "no"

  # The trade MySQL half: restores dp_sample_trade beside dp_sample_weather on
  # the same server and grants the demo login SELECT on it.
  sample-data-trade-mysql:
    profiles: [demo-trade]
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    entrypoint: ["/bin/sh", "/opt/sample-data/load.sh"]
    command: ["${SAMPLE_TRADE_BASE_URL:-}", "${SAMPLE_TRADE_VERSION:-v4}", "--engines", "mysql", "--family", "trade"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${SAMPLE_MYSQL_ROOT_PASSWORD}
      SAMPLE_DB_USER: ${SAMPLE_DB_USER:-dp_demo_ro}
      SAMPLE_MYSQL_PASSWORD: ${SAMPLE_MYSQL_PASSWORD}
      SAMPLE_DIR: /srv/sample
    volumes:
      - ./sample-data:/opt/sample-data:ro
      - sample-data:/srv/sample
    depends_on:
      mysql:
        condition: service_healthy
      sample-data-trade:
        condition: service_completed_successfully
    restart: "no"

  # The lake family (lake/v1, 089 §E): NO LOADER — nothing is downloaded or
  # restored; the app reads the published objects in place over HTTPS at query
  # time. This one-shot only places the family's two REPO files onto the shared
  # volume: the bootstrap datasources file from this directory, and
  # examples-lake.json from scripts/sample-data/content — the second mount,
  # which no other stage needs because the other families' examples arrive as
  # published artifacts. It runs on the same pinned image as the trade file
  # stage (the image must be PINNED, not picked for its tools), and the app
  # gates on it like any other stage, so the bootstrap files exist before boot.
  sample-data-lake:
    profiles: [demo-lake]
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    entrypoint: ["/bin/sh", "/opt/sample-data/place-lake.sh"]
    environment:
      SAMPLE_DIR: /srv/sample
    volumes:
      - ./sample-data:/opt/sample-data:ro
      - ../scripts/sample-data/content:/opt/lake-content:ro
      - sample-data:/srv/sample
    restart: "no"

# 071 §I / T116: volume names follow the compose PROJECT, and the project name is
# read from COMPOSE_PROJECT_NAME — the variable `-p` itself sets (verified against
# this Compose: `-p lane7` renders `lane7-postgres-data`). Before 075 the names
# interpolated a custom `APP_COMPOSE_PROJECT`, so `docker compose -p lane …` scoped
# the containers but every volume still resolved to the LIVE stack's data — the
# 2026-09-04 near-miss. The default project `dp` keeps the historical names
# (dp-postgres-data, …) byte-for-byte, so the live deployment is untouched.
#
# The host PORT cannot be derived this way — a port is a number, not a name — so it
# stays the explicit APP_HOST_PORT knob above, and `app.sh` refuses to start a
# non-default project without one.
volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME:-dp}-postgres-data
  # Demo-profile data. Declared unconditionally because a Compose volume cannot
  # carry a profile; unused and empty without it.
  mysql-data:
    name: ${COMPOSE_PROJECT_NAME:-dp}-mysql-data
  sample-data:
    name: ${COMPOSE_PROJECT_NAME:-dp}-sample-data
