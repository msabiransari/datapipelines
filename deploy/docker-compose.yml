# Production deployment — deployment.md Appendix A.
#
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml ps
#
# Secrets are EXTERNAL — never committed. Generate before first boot:
#   openssl rand -base64 32  # JWT_SECRET + DB_ENCRYPTION_KEY
#   echo "REDIS_PASSWORD=$(openssl rand -base64 24)"
#   echo "METADATA_DB_PASSWORD=$(openssl rand -base64 24)"
#
# The app image is built via `./gradlew bootJar` and containerised via
# the Dockerfile at the repo root (deployment.md §6.1).
#
# OIDC providers are supplied via the mounted application.yml (see Appendix A);
# at least one authentication method is required — a fully-configured OIDC
# provider or local accounts (auth.md §5A) — or startup fails (ConfigValidator §7).

# Pinned to the directory-derived default so existing deployments keep their
# container and volume names (deploy_postgres-data holds the metadata DB —
# changing the project name would ORPHAN it). The pin exists because Compose
# derives the project name from the DIRECTORY: without explicit names, this
# file and docker-compose.dev.yml form the SAME project and their same-named
# services replace each other (bit us live, 2026-08-28).
name: deploy

services:
  datapipelines:
    image: ghcr.io/datapipelines/datapipelines:1.0.0
    ports:
      # APP_HOST_PORT is the LANE knob, not app config (hence no DATAPIPELINES_
      # prefix — compose-env-audit.sh scopes that namespace to keys the app binds).
      # A second isolated project (APP_COMPOSE_PROJECT) needs its own host port or
      # it collides with the first on 8080; deployment.md §6.3A promotion rehearsal
      # is the case that needs it. The container port never moves.
      - "${APP_HOST_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/datapipelines
      SPRING_DATASOURCE_USERNAME: datapipelines
      SPRING_DATASOURCE_PASSWORD: ${METADATA_DB_PASSWORD}

      # Redis on the compose network: the host is the SERVICE name, deliberately not
      # the application.yml default (loopback) — see the compose-env-audit allowlist.
      DATAPIPELINES_REDIS_HOST: redis
      DATAPIPELINES_REDIS_PORT: ${DATAPIPELINES_REDIS_PORT:-6379}
      DATAPIPELINES_REDIS_PASSWORD: ${REDIS_PASSWORD}

      # REQUIRED, no fallback. Exactly 32 bytes base64.
      DATAPIPELINES_JWT_SECRET: ${JWT_SECRET}
      # REQUIRED, exactly 32 bytes base64. Losing this makes every stored
      # datasource credential unrecoverable.
      DATAPIPELINES_DB_ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # REQUIRED when OIDC providers are configured (auth.md §5.2). Compose renders the
      # empty default explicitly so an unset variable yields no interpolation warning.
      DATAPIPELINES_AUTH_BASE_URL: ${DATAPIPELINES_AUTH_BASE_URL:-}

      # OIDC (application.yml below): empty = the stock google entry is ignored
      # with a WARN — at least one auth method (OIDC provider or local accounts)
      # must remain, or startup fails (ConfigValidator §7).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Microsoft — only with the single-tenant provider block uncommented in
      # application.yml (auth.md §11.1; multi-tenant /common is unsupported in v1):
      # MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      # MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}

      # Optional local password accounts (auth.md §5A) — empty/false = off, and the
      # deployment behaves exactly as OIDC-only. The seed configures the FIRST
      # ADMIN's one-time credential only (the bootstrap-admin-email account below)
      # and forces a first-login change. Compose defaults MUST mirror
      # application.yml's defaults (empty string overrides nothing here — these
      # keys default to empty in the mounted yml too).
      DATAPIPELINES_AUTH_LOCAL_ENABLED: ${DATAPIPELINES_AUTH_LOCAL_ENABLED:-false}
      DATAPIPELINES_AUTH_LOCAL_BOOTSTRAP_PASSWORD_HASH: ${DATAPIPELINES_AUTH_LOCAL_BOOTSTRAP_PASSWORD_HASH:-}
      DATAPIPELINES_AUTH_LOCAL_BOOTSTRAP_PASSWORD: ${DATAPIPELINES_AUTH_LOCAL_BOOTSTRAP_PASSWORD:-}

      # Optional (empty = off). Bootstrap admin: this email's user row is created
      # with is_admin at FIRST login (auth.md §4.4 — a fresh deployment otherwise
      # has no admin path). Allowlist: restrict login to these email domains
      # (auth.md §4.3 — set it on any internal deployment).
      DATAPIPELINES_AUTH_BOOTSTRAP_ADMIN_EMAIL: ${DATAPIPELINES_AUTH_BOOTSTRAP_ADMIN_EMAIL:-}
      DATAPIPELINES_AUTH_ALLOWLIST_DOMAINS: ${DATAPIPELINES_AUTH_ALLOWLIST_DOMAINS:-}

      # Workspace provisioning (configuration.md §3.17). Compose defaults MUST
      # mirror application.yml's defaults — an empty string here would override
      # the app default and break enum/boolean binding.
      # auto-per-user = demo shape: first login provisions a personal workspace.
      # NOTE (022 owns the workspace-creation surface): under self-serve there is
      # no UI/API to create a workspace yet, so a fresh deployment that wants
      # usable workspaces before 022 lands should set auto-per-user.
      DATAPIPELINES_WORKSPACES_PROVISIONING_MODE: ${DATAPIPELINES_WORKSPACES_PROVISIONING_MODE:-self-serve}
      DATAPIPELINES_WORKSPACES_OPEN_JOIN: ${DATAPIPELINES_WORKSPACES_OPEN_JOIN:-false}
      DATAPIPELINES_WORKSPACES_MEMBER_DATASOURCES_ENABLED: ${DATAPIPELINES_WORKSPACES_MEMBER_DATASOURCES_ENABLED:-true}

      # Config-declared startup content (configuration.md §3.18). BOTH ARE PATHS,
      # and EMPTY MEANS OFF — the same shape as the two keys above, and the reason
      # these lines can sit unconditionally in the production file: without the
      # `demo` profile nothing sets them, so the features stay off and the app's
      # effective configuration is byte-for-byte what it was. The demo profile
      # supplies them from deploy/.env, pointing at the read-only sample volume
      # the one-shot loaders populate.
      DATAPIPELINES_BOOTSTRAP_DATASOURCES_FILE: ${DATAPIPELINES_BOOTSTRAP_DATASOURCES_FILE:-}
      DATAPIPELINES_BOOTSTRAP_EXAMPLES_FILE: ${DATAPIPELINES_BOOTSTRAP_EXAMPLES_FILE:-}

      # The full DATAPIPELINES_* pass-through contract (T32). Every such variable the
      # app binds from its environment is passed here with the SAME default
      # application.yml ships, so a key that works in dev (host env) cannot be silently
      # absent under compose: setting the variable in deploy/.env (or the shell) reaches
      # the container, and leaving it unset yields the shipped default — the effective
      # configuration is byte-for-byte what application.yml alone would produce.
      # scripts/compose-env-audit.sh diffs this block against application.yml's
      # placeholders and fails the audit on any missing line or diverged default.
      DATAPIPELINES_AUTH_TRUSTED_PROXIES: ${DATAPIPELINES_AUTH_TRUSTED_PROXIES:-}
      DATAPIPELINES_AUTH_JWT_TTL_HOURS: ${DATAPIPELINES_AUTH_JWT_TTL_HOURS:-8}
      DATAPIPELINES_AUTH_API_KEYS_CACHE_TTL_SECONDS: ${DATAPIPELINES_AUTH_API_KEYS_CACHE_TTL_SECONDS:-60}
      DATAPIPELINES_AUTH_API_KEYS_DEFAULT_SCOPES: ${DATAPIPELINES_AUTH_API_KEYS_DEFAULT_SCOPES:-read}
      DATAPIPELINES_AUTH_RATE_LIMIT_LOGIN_PER_MINUTE: ${DATAPIPELINES_AUTH_RATE_LIMIT_LOGIN_PER_MINUTE:-10}
      DATAPIPELINES_AUTH_LOCAL_LOCKOUT_MAX_FAILURES: ${DATAPIPELINES_AUTH_LOCAL_LOCKOUT_MAX_FAILURES:-5}
      DATAPIPELINES_AUTH_LOCAL_LOCKOUT_DURATION_MINUTES: ${DATAPIPELINES_AUTH_LOCAL_LOCKOUT_DURATION_MINUTES:-15}
      DATAPIPELINES_RATE_LIMIT_REQUESTS_PER_SECOND: ${DATAPIPELINES_RATE_LIMIT_REQUESTS_PER_SECOND:-100}
      DATAPIPELINES_RATE_LIMIT_REQUESTS_PER_MINUTE: ${DATAPIPELINES_RATE_LIMIT_REQUESTS_PER_MINUTE:-1000}
      DATAPIPELINES_SSE_HEARTBEAT_INTERVAL_SECONDS: ${DATAPIPELINES_SSE_HEARTBEAT_INTERVAL_SECONDS:-15}
      DATAPIPELINES_SSE_DISCONNECT_GRACE_SECONDS: ${DATAPIPELINES_SSE_DISCONNECT_GRACE_SECONDS:-30}
      DATAPIPELINES_SSE_MAX_STREAMS_PER_USER: ${DATAPIPELINES_SSE_MAX_STREAMS_PER_USER:-50}
      DATAPIPELINES_RESULT_TTL_DEFAULT_SECONDS: ${DATAPIPELINES_RESULT_TTL_DEFAULT_SECONDS:-300}
      DATAPIPELINES_RESULT_TTL_MIN_SECONDS: ${DATAPIPELINES_RESULT_TTL_MIN_SECONDS:-60}
      DATAPIPELINES_RESULT_TTL_MAX_SECONDS: ${DATAPIPELINES_RESULT_TTL_MAX_SECONDS:-3600}
      DATAPIPELINES_RESULT_MAX_SIZE_BYTES: ${DATAPIPELINES_RESULT_MAX_SIZE_BYTES:-104857600}
      DATAPIPELINES_RESULT_PAGE_SIZE_ROWS: ${DATAPIPELINES_RESULT_PAGE_SIZE_ROWS:-1000}
      DATAPIPELINES_RESULT_PAGE_MAX_ROWS: ${DATAPIPELINES_RESULT_PAGE_MAX_ROWS:-100000}
      DATAPIPELINES_IDEMPOTENCY_TTL_SECONDS: ${DATAPIPELINES_IDEMPOTENCY_TTL_SECONDS:-86400}
      DATAPIPELINES_EXECUTOR_MAX_PARALLEL_NODES: ${DATAPIPELINES_EXECUTOR_MAX_PARALLEL_NODES:-4}
      DATAPIPELINES_EXECUTOR_MAX_CONCURRENT_EXECUTIONS_PER_USER: ${DATAPIPELINES_EXECUTOR_MAX_CONCURRENT_EXECUTIONS_PER_USER:-10}
      DATAPIPELINES_EXECUTOR_MAX_CONCURRENT_EXECUTIONS_PER_INSTANCE: ${DATAPIPELINES_EXECUTOR_MAX_CONCURRENT_EXECUTIONS_PER_INSTANCE:-100}
      DATAPIPELINES_EXECUTOR_NODE_QUERY_TIMEOUT_SECONDS: ${DATAPIPELINES_EXECUTOR_NODE_QUERY_TIMEOUT_SECONDS:-60}
      DATAPIPELINES_EXECUTOR_EXECUTION_TIMEOUT_SECONDS: ${DATAPIPELINES_EXECUTOR_EXECUTION_TIMEOUT_SECONDS:-600}
      DATAPIPELINES_PIPELINES_MAX_COMPOSITION_DEPTH: ${DATAPIPELINES_PIPELINES_MAX_COMPOSITION_DEPTH:-5}
      DATAPIPELINES_STAGING_H2_MODE: ${DATAPIPELINES_STAGING_H2_MODE:-PostgreSQL}
      DATAPIPELINES_STAGING_H2_MAX_MEMORY_MB: ${DATAPIPELINES_STAGING_H2_MAX_MEMORY_MB:-1024}
      DATAPIPELINES_STAGING_H2_QUERY_TIMEOUT_SECONDS: ${DATAPIPELINES_STAGING_H2_QUERY_TIMEOUT_SECONDS:-60}
      DATAPIPELINES_STAGING_H2_RESULT_BATCH_SIZE: ${DATAPIPELINES_STAGING_H2_RESULT_BATCH_SIZE:-10000}
      DATAPIPELINES_STAGING_H2_INSERT_BATCH_SIZE: ${DATAPIPELINES_STAGING_H2_INSERT_BATCH_SIZE:-1000}
      DATAPIPELINES_TEMPLATES_CACHE_SIZE: ${DATAPIPELINES_TEMPLATES_CACHE_SIZE:-500}
      DATAPIPELINES_TEMPLATES_RENDER_TIMEOUT_MS: ${DATAPIPELINES_TEMPLATES_RENDER_TIMEOUT_MS:-5000}
      DATAPIPELINES_TEMPLATES_MAX_BODY_CHARS: ${DATAPIPELINES_TEMPLATES_MAX_BODY_CHARS:-262144}
      DATAPIPELINES_AUDIT_RETENTION_DAYS: ${DATAPIPELINES_AUDIT_RETENTION_DAYS:-365}
      DATAPIPELINES_EXECUTIONS_EVENT_RETENTION_DAYS: ${DATAPIPELINES_EXECUTIONS_EVENT_RETENTION_DAYS:-7}
      DATAPIPELINES_EXECUTIONS_STALE_TIMEOUT_MINUTES: ${DATAPIPELINES_EXECUTIONS_STALE_TIMEOUT_MINUTES:-60}
      DATAPIPELINES_OBSERVABILITY_LOGGING_FORMAT: ${DATAPIPELINES_OBSERVABILITY_LOGGING_FORMAT:-json}
      DATAPIPELINES_OBSERVABILITY_TRACING_ENABLED: ${DATAPIPELINES_OBSERVABILITY_TRACING_ENABLED:-false}
      DATAPIPELINES_UI_THEME: ${DATAPIPELINES_UI_THEME:-saas}
      DATAPIPELINES_DEPLOYMENT_NAME: ${DATAPIPELINES_DEPLOYMENT_NAME:-}
      DATAPIPELINES_DEPLOYMENT_AUTHORING_ENABLED: ${DATAPIPELINES_DEPLOYMENT_AUTHORING_ENABLED:-true}
      # versioning §10.6 — the promotion peer credential. Both are BEARER SECRETS: keep
      # them in deploy/.env like every other secret, never inline here. Empty server-key
      # means this deployment refuses promotion (fail closed).
      DATAPIPELINES_DEPLOYMENT_PROMOTION_SERVER_KEY: ${DATAPIPELINES_DEPLOYMENT_PROMOTION_SERVER_KEY:-}
      DATAPIPELINES_DEPLOYMENT_PROMOTION_TARGET_URL: ${DATAPIPELINES_DEPLOYMENT_PROMOTION_TARGET_URL:-}
      DATAPIPELINES_DEPLOYMENT_PROMOTION_TARGET_KEY: ${DATAPIPELINES_DEPLOYMENT_PROMOTION_TARGET_KEY:-}

      # The credentials the bootstrap datasources file names as ${...} placeholders.
      # They belong HERE, on the app, not only on the loader: that file is runtime
      # DATA and its placeholders are resolved by the app's own substitution against
      # the APP PROCESS's environment (datasources.md §8A.2) — which is what keeps
      # the shareable datasource manifest free of secrets. Giving them to the loader
      # alone starts the app and fail-fasts it at bootstrap with "references
      # environment variable 'SAMPLE_DB_USER', which is not set in this process's
      # environment" (observed — this is why the demo E2E is a real boot, not a
      # compose-config inspection). Empty without the demo profile, and unread:
      # the bootstrap keys above are empty, so the file is never opened.
      # The USER defaults to dp_demo_ro, matching the loaders' default below — a
      # set-but-EMPTY var passes the app's null-only placeholder check and registered
      # the datasources with username "" on the raw-compose path (023 review F3).
      SAMPLE_DB_USER: ${SAMPLE_DB_USER:-dp_demo_ro}
      SAMPLE_PG_PASSWORD: ${SAMPLE_PG_PASSWORD:-}
      SAMPLE_MYSQL_PASSWORD: ${SAMPLE_MYSQL_PASSWORD:-}
    volumes:
      - ./application.yml:/application.yml:ro
      # The sample volume: nyc_reference.db (the SQLITE datasource's file),
      # examples.json, and the bootstrap datasources file. READ-ONLY into the app
      # — the app never writes sample data, and the SQLITE datasource additionally
      # opens the file with the driver's read-only mode (datasources.md §8A.4).
      # Outside the demo profile nothing populates it and nothing points at it,
      # so it is an empty, unread mount.
      - sample-data:/srv/sample:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # `required: false` is load-bearing: without it, `up` WITHOUT the demo
      # profile fails outright with "service datapipelines depends on undefined
      # service sample-data" (verified against this Compose, not assumed). With
      # it, the non-demo path ignores these entries entirely, and the demo path
      # gates the app on both loaders having exited 0 — which is what makes the
      # one-command claim true: by the time the app boots, the databases are
      # loaded and the files it bootstraps from are on the volume.
      sample-data:
        condition: service_completed_successfully
        required: false
      sample-data-mysql:
        condition: service_completed_successfully
        required: false
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: datapipelines
      POSTGRES_USER: datapipelines
      POSTGRES_PASSWORD: ${METADATA_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapipelines -d datapipelines"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------- demo profile
  #
  # Everything below runs ONLY under `--profile demo` (sample-data design §5/§7).
  #
  # WHAT THE NON-DEMO PATH INHERITS, precisely — Compose has no per-profile env,
  # volume or dependency, so the four additions to `datapipelines` above are
  # unconditional and each is inert without the profile:
  #   * two DATAPIPELINES_BOOTSTRAP_* env keys, empty (empty = feature off), and
  #     the three SAMPLE_* credential keys the bootstrap file names, also empty
  #     (nothing reads them while the bootstrap keys are empty);
  #   * an empty read-only `sample-data` volume mount nothing points at;
  #   * two `depends_on` entries marked `required: false`, which Compose ignores
  #     when the target service is not enabled;
  #   * the `mysql-data` / `sample-data` volume declarations (Compose drops
  #     `mysql-data` from the rendered config entirely without the profile,
  #     since no enabled service references it).
  # `docker compose config` without `--profile demo` differs from the pre-change
  # file by exactly those lines and nothing else.
  #
  #   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml \
  #     --profile demo up -d --wait
  #
  # Requires SAMPLE_* in deploy/.env (deploy/.env.example) and, for the MySQL
  # sample, an image built with -Pmysql — Connector/J is not in the default build
  # (datasources.md §10.2). deployment.md Appendix B is the quickstart.

  mysql:
    profiles: [demo]
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    environment:
      MYSQL_ROOT_PASSWORD: ${SAMPLE_MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # MYSQL_PWD, not -p on the command line: an argv password is readable in
      # `ps` by every process in the container.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Stage 1 of the load: downloads and checksum-verifies EVERY artifact, then
  # restores Postgres and places the SQLite database, examples.json and the
  # bootstrap datasources file on the shared volume.
  #
  # It runs on the pinned POSTGRES image because that image has psql and
  # pg_restore of the matching major. Stage 2 runs on the pinned MYSQL image for
  # the same reason. Two services rather than one because no pinned image carries
  # both clients, and installing one at container start would be an unpinned
  # package fetch in the one place that has to be reproducible.
  sample-data:
    profiles: [demo]
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    entrypoint: ["/bin/sh", "/opt/sample-data/load.sh"]
    command: ["${SAMPLE_BASE_URL:-}", "${SAMPLE_VERSION:-v1}", "--engines", "postgres,sqlite"]
    environment:
      # The metadata-DB superuser: the loader creates the dp_sample_trips
      # database and the SELECT-only demo role, so it needs more than the demo
      # login has. PGDATABASE is the database it connects to in order to do that.
      PGHOST: postgres
      PGUSER: datapipelines
      PGPASSWORD: ${METADATA_DB_PASSWORD}
      PGDATABASE: datapipelines
      SAMPLE_DB_USER: ${SAMPLE_DB_USER:-dp_demo_ro}
      SAMPLE_PG_PASSWORD: ${SAMPLE_PG_PASSWORD}
      SAMPLE_DIR: /srv/sample
    volumes:
      - ./sample-data:/opt/sample-data:ro
      - sample-data:/srv/sample
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Stage 2: the MySQL half. Re-verifies the artifacts it uses off the shared
  # volume before restoring — the checksums are cheap and the alternative is
  # trusting that nothing touched the volume between the two services.
  sample-data-mysql:
    profiles: [demo]
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    entrypoint: ["/bin/sh", "/opt/sample-data/load.sh"]
    command: ["${SAMPLE_BASE_URL:-}", "${SAMPLE_VERSION:-v1}", "--engines", "mysql"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${SAMPLE_MYSQL_ROOT_PASSWORD}
      SAMPLE_DB_USER: ${SAMPLE_DB_USER:-dp_demo_ro}
      SAMPLE_MYSQL_PASSWORD: ${SAMPLE_MYSQL_PASSWORD}
      SAMPLE_DIR: /srv/sample
    volumes:
      - ./sample-data:/opt/sample-data:ro
      - sample-data:/srv/sample
    depends_on:
      mysql:
        condition: service_healthy
      sample-data:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres-data:
  # Demo-profile data. Declared unconditionally because a Compose volume cannot
  # carry a profile; unused and empty without it.
  mysql-data:
  sample-data:
