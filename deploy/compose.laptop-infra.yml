# Local development infrastructure — DEVELOPMENT.md §2.
#
#   docker compose -f deploy/docker-compose.dev.yml up -d
#   docker compose -f deploy/docker-compose.dev.yml ps
#   docker compose -f deploy/docker-compose.dev.yml down -v    # reset a dirty Flyway state
#
# Dev only: credentials are fixed and public, no passwords on Redis, no TLS.
# The production shape is deployment.md Appendix A — do not copy this file there.
# The app itself is NOT in this file; it runs from Gradle (DEVELOPMENT.md §6).
#
# Explicit project name: Compose derives project names from the DIRECTORY, so
# without this the dev stack and deploy/docker-compose.yml would be one project
# ("deploy") whose same-named postgres/redis services replace each other —
# starting the dev stack tore down a running production-shape stack (2026-08-28).
# The dp- prefix keeps every datapipelines container recognisable on a shared
# host (2026-09-04 rename).
name: dp-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: dp-dev-postgres
    environment:
      POSTGRES_DB: datapipelines
      POSTGRES_USER: datapipelines
      POSTGRES_PASSWORD: datapipelines
    ports:
      # Loopback-only bind (2026-08-07 security review MEDIUM-4). A bare
      # "5434:5432" publishes the container on 0.0.0.0 — on any laptop sharing a
      # coffee-shop or conference LAN that is a fixed-credential Postgres open to
      # the network. Dev infra must never be reachable off-host.
      # Host port 5434, NOT 5432: 5432/5433 collide with other local stacks
      # (Postgres.app defaults to 5432; algo-school holds 5433). 5434 is this
      # project's dev port — keep it in sync with application-dev.yml,
      # DEVELOPMENT.md §2/§4 and configuration.md §6.
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapipelines -d datapipelines"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dp-dev-redis
    # noeviction is REQUIRED (deployment.md §4.2.1): eviction silently destroys
    # results, idempotency keys and cancellation flags. Same policy as production;
    # only the password and the memory ceiling differ.
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy noeviction
    ports:
      # Loopback-only bind (2026-08-07 security review MEDIUM-4). Dev Redis has no
      # password at all, so an 0.0.0.0 bind is an unauthenticated open Redis.
      # Host port 6381, NOT 6379: 6379 is the universal default and algo-school
      # holds 6380. Keep in sync with application-dev.yml, DEVELOPMENT.md §2/§4
      # and configuration.md §6.
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  # Volume name pinned: the dev database predates the 2026-09-04 dp- rename
  # and was migrated from deploy_postgres-dev-data.
  postgres-dev-data:
    name: dp-postgres-dev-data
