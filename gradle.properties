# Build-wide Gradle settings. Absent until 2026-09-02, which left org.gradle.parallel at its
# default (false): the nine modules' test tasks ran strictly one after another, so a gate's
# wall time was the SUM of every module. Parallel project execution overlaps them; the wall
# time trends toward the longest module (tests/integration-tests) instead of the total.
#
# workers.max is capped below the CPU count on purpose. Each integration module starts its
# own Testcontainers (Postgres/Redis/MySQL) per suite, and this box is shared by several
# lanes' gates at once; an uncapped fan-out trades wall time for the Kotlin-daemon OOMs the
# lanes have already hit — a first run at 4 while three lanes gated concurrently saw Docker
# refuse to START three containers (load average 40–50). 2 while the box is shared; 060
# measures the right number on a quiet machine; raise it on a dedicated CI runner.
org.gradle.parallel=true
org.gradle.workers.max=2
