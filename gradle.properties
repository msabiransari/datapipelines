# Build-wide Gradle settings. Absent until 2026-09-02, which left org.gradle.parallel at its
# default (false): the nine modules' test tasks ran strictly one after another, so a gate's
# wall time was the SUM of every module. Parallel project execution overlaps them; the wall
# time trends toward the longest module (modules/datasources) instead of the total.
#
# workers.max = 4, raised from 2 in round 062. Measured on this box, same tree, same command
# (clean build ktlintCheck detekt editorJsTest --rerun-tasks):
#
#   workers 2, box quiet (load ~5)  ->  356 s, green
#   workers 4, box quiet (load ~4)  ->  308 s, green      <- why 4
#   workers 4, box BUSY  (load 10+) -> 6381 s, RED        <- why this comment exists
#
# The red run is the thing to understand before touching this number. Each integration module
# starts its own Testcontainers (Postgres/Redis/MySQL/Keycloak) in its own JVM, so at 4 the
# build asks Docker for roughly twice the containers at once. On a quiet machine that fits and
# the modules overlap; on a loaded one the Docker VM saturates and the build does not merely
# get slower, it goes RED on the load-sensitive tests — a rate-limit window, an account-lockout
# window, and a packaged jar that failed to become healthy inside its 120 s budget. Nothing
# there is a real defect; all three are wall-clock assertions losing a race with the box.
#
# "At most two full gates at once" is NOT sufficient protection: the red run above had no
# other Gradle gate on the machine at all. What loaded it was ambient work — the deployment
# stacks in Docker plus another agent — which no gate-count rule can see.
#
# Lower it to 2 whenever the box is not yours alone (another lane building, a demo stack under
# load, a laptop on battery). Raise it past 4 only on a dedicated runner, and measure rather
# than assume: past 4 this build stops being CPU-bound and becomes Docker-bound.
org.gradle.parallel=true
org.gradle.workers.max=4
