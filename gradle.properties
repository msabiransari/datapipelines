# Build-wide Gradle settings. Absent until 2026-09-02, which left org.gradle.parallel at its
# default (false): the nine modules' test tasks ran strictly one after another, so a gate's
# wall time was the SUM of every module. Parallel project execution overlaps them; the wall
# time trends toward the longest module (modules/datasources) instead of the total.
#
# workers.max is the number of TASKS one build runs at once (compile, test, lint — across
# modules). The number below is sized for the documented budget in DEVELOPMENT.md §9.5 —
# TWO full gates at once on a 96-thread / 64 GB box — and is the knob to change first when
# your machine differs. Its history, because the failure modes are the useful part:
#
#   2026-09-02, shared MacBook:  workers 2 quiet -> 356 s; workers 4 quiet -> 308 s;
#                                workers 4 BUSY (load 10+) -> 6381 s and RED. Each integration
#                                module starts its own Testcontainers in its own JVM, so on a
#                                Docker VM the build stopped being CPU-bound past 4 and went
#                                red on wall-clock assertions (rate-limit / lockout windows, a
#                                jar's 120 s health budget) — none of them real defects.
#   2026-09-12, Linux 96 CPU / 64 GB, native Docker: at workers 4 (and a protocol habit of
#                                --max-workers=3) a gate ran 14m35s with the CPU 85 % idle and
#                                the browser suite a serial 680 s tail. Raised to 6 with test
#                                forks (dp.test.forks, below) as the paired change; measured
#                                in DEVELOPMENT.md §9.5.
#
# Lower it (or pass --max-workers=N) whenever the box is not yours alone; raise it only after
# reading §9.5's budget: past the point where Docker or RAM saturates, the build does not get
# slower, it goes RED on load-sensitive tests.
org.gradle.parallel=true
org.gradle.workers.max=6

# Test-JVM parallelism (read by buildSrc CommonConventionsPlugin; DEVELOPMENT.md §9.5).
#   dp.test.forks      — forked test JVMs per ORDINARY module (classes are split across them).
#   dp.test.forks.e2e  — the same for the two Testcontainers suites (tests/integration-tests,
#                        tests/browser-tests): every fork boots its own containers, app
#                        context and browser, so this one costs RAM, not just CPU.
#   dp.test.heap       — -Xmx of every ordinary test JVM (tests/integration-tests keeps its
#                        own 6g: one JVM holds fifteen-odd Spring contexts).
# Override per run with -Pdp.test.forks=1 (a laptop on battery) or in ~/.gradle/gradle.properties.
dp.test.forks=3
dp.test.forks.e2e=2
dp.test.heap=1g

# Compiler and build-daemon heap, explicit. Unset, Gradle's daemon runs at its 512 MB default
# and the Kotlin compile daemon inherits a small heap; on a 2-vCPU/7 GB CI runner with four
# parallel workers that died in `compileTestKotlin` with "GC overhead limit exceeded"
# (2026-09-11), and a loaded laptop saw the same at --max-workers=3. 2 GB each is the
# documented comfortable floor for a multi-module Kotlin build; it is a ceiling, not a
# reservation, so an idle daemon costs nothing extra.
# Raised 2026-09-12 (3 GB / 4 GB) with the parallelism above: one Kotlin daemon compiles for
# every concurrent build on the box, and a build daemon at 2 GB spent its time in GC once six
# workers fed it. Both remain ceilings.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m
kotlin.daemon.jvmargs=-Xmx4g
