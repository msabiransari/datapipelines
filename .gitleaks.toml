# .gitleaks.toml — allowlist for scripts/secret-scan.sh (gitleaks 8.30.1).
#
# RULE: every entry carries a reason + date comment (project rule). Entries are
# SECRET-targeted (regexTarget = "secret") AND path-scoped (paths = [...]) with
# condition = "AND": suppression requires BOTH the triaged file AND the
# extracted secret itself, so a real secret co-located with an allowlisted
# token — same file, same line — still fires.
#
# Why so defensive (009/F2, both halves verified against the 8.30.1 source):
#  - The pre-009 config used unanchored LINE-target regexes with no path
#    scoping: any line containing an allowlisted token had ALL its secrets
#    suppressed, anywhere in the repo (proven with a co-located real-format
#    GitHub PAT that sailed through).
#  - Path scoping ALONE is also a trap: with the DEFAULT condition ("OR") a
#    path match skips the whole file before scanning (detect.go
#    checkCommitOrPathAllowed), and --no-git/directory scans skip
#    path-matched files unconditionally (sources/common.go shouldSkipPath).
#    For the canonical wrapper's git scans, condition = "AND" + a secret
#    regex keeps the check at finding level: path AND extracted secret must
#    both match. Directory scans can skip a matching path before checking
#    the secret even with AND (reproduced on 8.30.1, 2026-10-24); these entries
#    are not a safe directory-scan boundary. Use an exact .gitleaksignore
#    fingerprint for a single historical finding instead of a new path entry.
#
# Baseline: full-history scan on 2026-08-15 found 5 hits, all rule
# `generic-api-key`, all triaged as false positives below. For every hit the
# extracted secret IS the token below (verified 2026-08-16 against the report's
# Secret field), which is what makes regexTarget = "secret" possible.
#
# NOTE: the old entry for `${DATAPIPELINES_DB_ENCRYPTION_KEY}` was dropped on
# 2026-08-16: no finding in the full history extracts that string as its
# secret, so the entry suppressed nothing real and existed only as co-location
# cover. If a future scan flags a docs/configuration.md reference line, re-add
# a scoped AND-entry for the ACTUAL extracted secret, not the placeholder
# syntax.

title = "datapipelines gitleaks config"

# Keep the built-in rule set — a custom config REPLACES the defaults otherwise
# (proven the hard way 2026-08-15: without this line a staged AWS key sailed
# through the pre-commit hook).
[extend]
useDefault = true

# deploy/.env.example HISTORY (values placeholdered at d8bc67c) — two working
# base64 values for the LOCAL dev compose stack. They secure nothing
# (localhost-only services; DEVELOPMENT.md tells every developer to generate
# their own), but they are high-entropy strings, so gitleaks flags them.
# (2026-08-15)
[[allowlists]]
description = "deploy/.env.example history: local dev-compose base64 values (2026-08-15)"
condition = "AND"
paths = ['''deploy/\.env\.example$''']
regexTarget = "secret"
regexes = [
  '''^cSZIW7DsvYRYUZWghr3t1mG2qGfGOMBRBcqNMiWSpX8=$''',
  '''^0mzTN2khjqIJ/vBX59Y79xmOrNNrceuNkMo0H5xE\+yQ=$''',
]

# modules/app ConfigValidatorTest.kt — `oidc-secret-456` is a deliberate
# fixture value for OIDC config validation tests. (2026-08-15)
[[allowlists]]
description = "ConfigValidatorTest.kt: OIDC fixture value (2026-08-15)"
condition = "AND"
paths = ['''modules/app/src/test/kotlin/co/datapipelines/config/ConfigValidatorTest\.kt$''']
regexTarget = "secret"
regexes = ['''^oidc-secret-456$''']

# docs/rest-api.md — `dpk_ab12cd34ef56.9f8e7d6c...` is a truncated EXAMPLE
# API key in the docs, not a credential. (2026-08-15)
[[allowlists]]
description = "rest-api.md: truncated example API key (2026-08-15)"
condition = "AND"
paths = ['''docs/rest-api\.md$''']
regexTarget = "secret"
regexes = ['''^dpk_ab12cd34ef56\.9f8e7d6c\.\.\.$''']

# docs/configuration.md HISTORY (removed before the 2026-08-15 scan; commit
# c105d58) — the old dev-only value is base64 of the literal string
# "dev-encryption-key-32-bytes!", a placeholder, never a real key. Kept so
# full-history scans stay clean. (2026-08-15)
[[allowlists]]
description = "configuration.md history: base64 of a placeholder string (2026-08-15)"
condition = "AND"
paths = ['''docs/configuration\.md$''']
regexTarget = "secret"
regexes = ['''^ZGV2LWVuY3J5cHRpb24ta2V5LTMyLWJ5dGVzIQ==$''']

# modules/web vendor-manifest.json — SHA-256 checksums of VENDORED, publicly
# committed CSS assets (013/F7: sync-design-system.sh records one hash per
# file). gitleaks' generic-api-key rule flags high-entropy hashes (the
# tokens.css hash, entropy 3.90, at 2026-08-17); a checksum of a public file
# is not a credential. Scoped by SHA-256 SHAPE (exactly 64 lowercase hex
# chars) in this exact file rather than one literal digest (014/F5): the
# recorded hashes change on every re-vendor, so a digest-pinned entry would
# block the next sync's commit whenever a DIFFERENT hash trips the entropy
# check. The AND-condition and path pin stay, so any secret in this file
# that is not itself a 64-lowercase-hex string still fires (proven with a
# planted AWS key, 2026-08-18). Residual, accepted: a real secret that IS
# exactly 64 lowercase hex chars in this manifest is indistinguishable from
# a checksum. (2026-08-18)
[[allowlists]]
description = "vendor-manifest.json: SHA-256 hashes of vendored public CSS (2026-08-18)"
condition = "AND"
paths = ['''modules/web/src/main/resources/static/vendor/design-system/vendor-manifest\.json$''']
regexTarget = "secret"
regexes = ['''^[a-f0-9]{64}$''']
# tests/integration-tests WriteSurfaceStampingE2eTest.kt — the session leg mints
# its own JWT against a FIXED test secret so the app context and the test agree;
# base64 of the literal "test-jwt-secret-for-via-stamping-32", a placeholder
# known only to this test's own @DynamicPropertySource, securing nothing.
# (2026-09-09)
[[allowlists]]
description = "WriteSurfaceStampingE2eTest.kt: fixed test-local JWT secret (2026-09-09)"
condition = "AND"
paths = ['''tests/integration-tests/src/test/kotlin/co/datapipelines/integration/WriteSurfaceStampingE2eTest\.kt$''']
regexTarget = "secret"
regexes = ['''^dGVzdC1qd3Qtc2VjcmV0LWZvci12aWEtc3RhbXBpbmctMzI=$''']

# modules/app logging/SyntheticPlants.kt — four `planted-secret-…` markers from
# the shared redaction corpus (#337-b): synthetic log text exercising the §9.2
# scrubber, whose KDoc states "No value is a real credential: every secret is a
# `planted-secret-` marker". These four trip `generic-api-key` on entropy
# alone. Exact values, deliberately NOT a `^planted-secret-[a-z0-9]+$` shape:
# the next plant that trips is triaged on its own merits, not auto-suppressed.
# (2026-10-22)
[[allowlists]]
description = "SyntheticPlants.kt: redaction-corpus planted-secret markers (2026-10-22)"
condition = "AND"
paths = ['''modules/app/src/test/kotlin/co/datapipelines/logging/SyntheticPlants\.kt$''']
regexTarget = "secret"
regexes = [
  '''^planted-secret-z9$''',
  '''^planted-secret-z10$''',
  '''^planted-secret-z11$''',
  '''^planted-secret-z2$''',
]

# tests/integration-tests ScheduledRunSurfacesE2eTest.kt — `scheduler-275` is
# the provider subject / email local part of the scheduler stand-in's SYSTEM
# identity in the #275 fixture's seed row (`scheduler-275@keys.invalid`), a
# username the product mints for its own schedule runner; it carries no secret
# material. (2026-10-22)
[[allowlists]]
description = "ScheduledRunSurfacesE2eTest.kt: scheduler stand-in identity subject (2026-10-22)"
condition = "AND"
paths = ['''tests/integration-tests/src/test/kotlin/co/datapipelines/integration/ScheduledRunSurfacesE2eTest\.kt$''']
regexTarget = "secret"
regexes = ['''^scheduler-275$''']

# tests/integration-tests KeysV2MigrationTest.kt — two synthetic pre-migration
# key ids (`dpk_` + fabricated characters) seeded into the pre-V37 fixture
# database for the keys-v2 B4 dry run: the inactive owner's key (`dpk_V37I…`,
# at HEAD `:66`) and a promoter's key (`dpk_V35P…`, HISTORY-ONLY — introduced
# at d53ded9a7 and carried by no commit's tree today, so only a path +
# exact-value entry can clear it). Fixture row ids, not credentials.
# (2026-10-22)
[[allowlists]]
description = "KeysV2MigrationTest.kt: synthetic pre-migration key ids (2026-10-22)"
condition = "AND"
paths = ['''tests/integration-tests/src/test/kotlin/co/datapipelines/integration/KeysV2MigrationTest\.kt$''']
regexTarget = "secret"
regexes = [
  '''^dpk_V35PROMOT01$''',
  '''^dpk_V37INACTIV1$''',
]

# modules/app config/ConfigValidatorDemoApiTest.kt — a deliberately MALFORMED
# demo key (`dpk_SHOR…`: the id part is not twelve base32 characters) fed to
# ConfigValidator in a test asserting startup REFUSES it; it validates nothing
# and unlocks nothing. (2026-10-22)
[[allowlists]]
description = "ConfigValidatorDemoApiTest.kt: deliberately malformed demo key (2026-10-22)"
condition = "AND"
paths = ['''modules/app/src/test/kotlin/co/datapipelines/config/ConfigValidatorDemoApiTest\.kt$''']
regexTarget = "secret"
regexes = ['''^dpk_SHORT0\.a_very_long_secret_part$''']

# tests/integration-tests McpSaveWorkspaceDatasourceE2eTest.kt — `lane134-oth…`
# is the FOREIGN workspace's slug in the MCP save-workspace-datasource E2E
# (the jwt() workspace argument and the `INSERT INTO workspaces` seed row), a
# plain name string, not a credential. (2026-10-22)
[[allowlists]]
description = "McpSaveWorkspaceDatasourceE2eTest.kt: foreign workspace slug (2026-10-22)"
condition = "AND"
paths = ['''tests/integration-tests/src/test/kotlin/co/datapipelines/integration/McpSaveWorkspaceDatasourceE2eTest\.kt$''']
regexTarget = "secret"
regexes = ['''^lane134-other$''']
