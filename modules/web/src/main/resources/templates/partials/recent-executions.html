<th:block xmlns:th="http://www.thymeleaf.org">
  <!--
    A standalone view (025 B2): what GET /partials/recent-executions returns. Same
    restructuring as dashboard-stats — the old parameterized fragment signature could not
    render outside an include and 500'd the endpoint.
  -->
  <!-- 282 (#282): a FIXED data-table frame, flush with the dashboard card it fills
       (ui-screens §3.7). The header row is also the `head` fragment: the dashboard's loading
       state (dashboard.html) is skeleton ROWS under this same header, so the columns never
       change between loading, empty and rows. The empty state is a row too. -->
  <div class="dt-frame dt-flush dt-scroll dt-h-sm dt-nowrap">
    <div class="dt-viewport" tabindex="-1">
    <table class="ds-table">
      <thead th:fragment="head">
        <tr>
          <th>Pipeline</th>
          <th data-type="number">Version</th>
          <th>Status</th>
          <th data-type="date">Started</th>
          <th class="num">Duration</th>
          <th>Via</th>
        </tr>
      </thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(executions)}" class="dt-state-row">
          <td colspan="6" class="dt-state-cell">
            <div class="dt-state">
              <b>No executions yet</b>
              <span>Run a pipeline to see results here.</span>
            </div>
          </td>
        </tr>
        <tr th:each="r : ${executions}" class="app-row-clickable" th:attr="data-href=@{/executions/{id}(id=${r.executionId})}">
          <td>
            <!-- 079 §E: the display name is prose, the machine path sits UNDER it in mono
                 (§3.3 — mono is for identifiers only). The path was previously only a
                 `title`, which is invisible on a touch screen and to anyone not hovering. -->
            <!-- th:with is precedence 500 and th:if is 300, so a `th:with` on the SAME
                 element is not yet in scope when the condition is evaluated — the path line
                 silently never rendered until a screenshot showed it missing. The binding
                 goes on a wrapping th:block, where both children can see it. -->
            <th:block th:with="p=${pipelineNames != null ? pipelineNames[r.pipelineId] : null}">
              <span class="app-name"
                    th:text="${p != null} ? (${p.displayName != null} ? ${p.displayName} : ${p.name}) : (${r.pipelineId.toString().substring(0, 8) + '...'})"
                    th:title="${p != null} ? ${p.name} : null">pipeline</span>
              <span class="app-path" th:if="${p != null and p.displayName != null}" th:text="${p.name}">nyc/mobility/x</span>
            </th:block>
          </td>
          <td th:text="${r.pipelineVersion}">1</td>
          <td>
            <!-- The chip shows prose ("Success"); the ENUM rides on data-status, which is
                 what a test or a script should read. Asserting on display text makes a copy
                 change a test failure and a machine reader's problem. -->
            <span class="app-chip" th:attr="data-status=${r.status.name()}"
                  th:classappend="${r.status.name() == 'SUCCESS'} ? 'app-chip-ok' : (${r.status.name() == 'FAILED'} ? 'app-chip-bad' : (${r.status.name() == 'RUNNING'} ? 'app-chip-run' : 'app-chip-warn'))"><i class="ds-status"></i><span th:text="${#strings.capitalize(#strings.toLowerCase(r.status.name()))}">Success</span></span>
          </td>
          <td th:text="${#temporals.format(r.startedAt, 'yyyy-MM-dd HH:mm')}">date</td>
          <td class="num" th:text="${r.durationMs != null} ? ${r.durationMs + ' ms'} : '—'">dur</td>
          <!-- 079 §E: `triggered_via` was already selected on every row and rendered on
               exactly one screen (the detail view). "Who started this" is the first
               question asked of a failed run; it belongs in the list. -->
          <td class="u-muted u-text-xs" th:text="${r.triggeredVia.name()}">MCP</td>
        </tr>
      </tbody>
    </table>
    </div>
  </div>
</th:block>
