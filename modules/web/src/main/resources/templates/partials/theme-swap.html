<th:block xmlns:th="http://www.thymeleaf.org">
  <!--
    The theme-swap response (025 C1), RENDERED — never hand-built HTML. Two elements,
    both out-of-band: the OOB stylesheet link that replaces the layout's #theme-link,
    and the confirmation toast for the #toast stack (030 — the old inline confirmation
    span is gone; the select fires hx-swap="none", so there is no content target). Rendering
    is what makes the href correct: @{...} prepends the context path, which a hand-built
    string would drop under a non-root deployment.
  -->
  <link id="theme-link" rel="stylesheet" hx-swap-oob="outerHTML"
        th:href="@{/vendor/design-system/themes/{theme}.css(theme=${theme})}">
  <div th:replace="~{partials/toast-oob :: oob('success', 'Theme updated', ${theme} + ' is now active.')}"></div>
</th:block>
