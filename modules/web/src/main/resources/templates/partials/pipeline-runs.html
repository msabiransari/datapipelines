<!-- The acting column's RUNS tab (106) — this pipeline's last 20 executions, so reading a
     pipeline no longer means leaving the screen for /executions and filtering it back down.

     Loaded on the tab's first click (`hx-trigger="click once"`) and never again: the tab is
     one fragment, and a tab nobody opens costs nothing.

     Visibility is the execution-history screen's, unchanged — an admin sees the workspace's
     runs, everyone else sees their own. The controller decides; this renders whatever it was
     handed. -->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="runs" class="tplx-runs">
  <p class="ds-empty-description" th:if="${#lists.isEmpty(runs)}">No executions of this pipeline yet.</p>

  <a class="tplx-runrow" th:each="r : ${runs}" th:href="@{'/executions/' + ${r.executionId}}">
    <span class="app-chip" th:attr="data-status=${r.status.name()}"
          th:classappend="${r.status.name() == 'SUCCESS'} ? 'app-chip-ok' : (${r.status.name() == 'FAILED'} ? 'app-chip-bad' : (${r.status.name() == 'RUNNING'} ? 'app-chip-run' : 'app-chip-warn'))"><i class="ds-status"></i><span th:text="${#strings.capitalize(#strings.toLowerCase(r.status.name()))}">Success</span></span>
    <span class="ds-badge ds-badge-default app-chip-mono" th:text="${'v' + r.pipelineVersion}">v1</span>
    <span class="tplx-vmeta">
      <span th:text="${r.durationMs != null} ? ${r.durationMs} + ' ms' : '—'">3200 ms</span>
      <span> · </span><span th:text="${r.triggeredVia.name()}">MCP</span>
      <span> · </span><span th:text="${runActors[r.triggeredBy]} ?: 'unknown'">Muhammad</span>
      <span> · </span><span th:text="${runAgo[r.executionId]}"
                            th:title="${#temporals.format(r.startedAt, 'yyyy-MM-dd HH:mm')}">4 mins ago</span>
    </span>
  </a>
</div>
