<!-- The RUNS tab (#349 house-table composition; the fragment the 106 explorer detail and
     the pipeline workspace both compose) — this pipeline's last 20 executions, so reading
     a pipeline no longer means leaving the screen for /executions and filtering it back
     down. Loaded lazily by both surfaces: the explorer on the tab's first click, the
     workspace on the tab's first open, generation-stamped.

     Visibility is the execution-history screen's, unchanged — an admin sees the
     workspace's runs, everyone else sees their own. The controller decides; this renders
     whatever it was handed.

     HOUSE TABLE (ui-screens §3.7, spec §4.4 "Runs: bounded dense/paged semantics where
     the existing source is paged"): the actual component — FIXED frame at the tab's
     bounded height, one line per row, the version/status/actor/surface/time/duration
     facts the inventory names, execution links on the row. The link is an anchor in the
     first cell with data-href on the row: shell.js's one delegated handler navigates,
     and the table's keyboard rows contract (Enter, arrows) applies. -->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="runs" class="tplx-runs">
  <div class="dt-frame dt-scroll dt-h-sm dt-fit" th:unless="${#lists.isEmpty(runs)}">
    <div class="dt-viewport" tabindex="-1">
      <table class="ds-table">
        <thead>
          <tr>
            <th>Status</th>
            <th>Version</th>
            <th>Duration</th>
            <th>Via</th>
            <th>By</th>
            <th>When</th>
          </tr>
        </thead>
        <tbody>
          <tr class="app-row-clickable" th:each="r : ${runs}" th:attr="data-href='/executions/' + ${r.executionId}">
            <td>
              <span class="app-chip" th:attr="data-status=${r.status.name()}"
                    th:classappend="${r.status.name() == 'SUCCESS'} ? 'app-chip-ok' : (${r.status.name() == 'FAILED'} ? 'app-chip-bad' : (${r.status.name() == 'RUNNING'} ? 'app-chip-run' : 'app-chip-warn'))"><i class="ds-status"></i><span th:text="${#strings.capitalize(#strings.toLowerCase(r.status.name()))}">Success</span></span>
            </td>
            <td class="u-mono" th:text="${'v' + r.pipelineVersion}">v1</td>
            <td class="u-mono" th:text="${r.durationMs != null} ? ${r.durationMs} + ' ms' : '—'">3200 ms</td>
            <td th:text="${r.triggeredVia.name()}">MCP</td>
            <td th:text="${runActors[r.executedBy]} ?: 'unknown'">Muhammad</td>
            <td class="u-mono">
              <span th:text="${runAgo[r.executionId]}"
                    th:title="${#temporals.format(r.startedAt, 'yyyy-MM-dd HH:mm')}">4 mins ago</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <p class="ds-empty-description" th:if="${#lists.isEmpty(runs)}">No executions of this pipeline yet.</p>
</div>
