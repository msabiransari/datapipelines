<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="rows">
  <!-- 097 §C — the admin user table's rows: the page's first paint and the search box's
       every later swap, from the same AdminUsersBrowseModel. -->
  <tr th:if="${userRows == null || userRows.isEmpty()}">
    <td colspan="7" class="u-p-md u-center u-secondary u-text-sm">No users found</td>
  </tr>
  <!-- th:each and th:replace cannot share an element: fragment inclusion has the higher
       precedence, so the fragment would be resolved BEFORE the loop variable exists. -->
  <th:block th:each="userRow : ${userRows}">
    <th:block th:replace="~{partials/admin-user-row :: row}"></th:block>
  </th:block>
</th:block>
