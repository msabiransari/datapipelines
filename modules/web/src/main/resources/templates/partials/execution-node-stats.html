<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="stats(nodeStats)">
  <table class="ds-table">
    <thead>
      <tr>
        <th>Node</th>
        <th class="num">Rows In</th>
        <th class="num">Rows Out</th>
        <th class="num">Duration</th>
        <!-- 082 §D: Context is an IDENTIFIER column (`key`, then its value), not a
             numeric one. It wore `.num`, which right-aligns AND shrinks a cell as well
             as setting it in mono; only the mono third of that was right. §3.3's
             decision table lists Context under Mono beside the node id, and gives
             `.num` to rows in/out and duration. (No long dash in this comment: a
             render test counts the em-dashes this partial emits.) -->
        <th>Context</th>
      </tr>
    </thead>
    <tbody>
      <th:block th:if="${nodeStats.isArray()}">
        <tr th:each="n : ${nodeStats}">
          <!-- §3.3: the node id is an identifier, so it sets in mono. It rendered in the
               body face, in the same table as a Context cell that was already mono. -->
          <td class="u-mono" th:text="${n.has('node_id') ? n.get('node_id').asText() : 'unknown'}">node</td>
          <td class="num" th:text="${n.has('rows_in') ? n.get('rows_in').asLong() : '-'}">in</td>
          <td class="num" th:text="${n.has('rows_out') ? n.get('rows_out').asLong() : '-'}">out</td>
          <td class="num" th:text="${n.has('duration_ms') ? n.get('duration_ms').asLong() + 'ms' : '-'}">dur</td>
          <!-- CALCULATOR nodes only (NodeStats §4.10): the Context key the node wrote and
               the value it wrote, mono because it is an identifier + value, and the one
               place a wrong-quarter debug session looks. Every other node type gets the
               em-dash; the keys are NON_NULL-included, so they are absent, not null.
               078 A5: a key the CALLER supplied skips the node, and the row says "(provided)";
               otherwise a supplied 7 and a computed 7 are indistinguishable here. -->
          <td class="u-mono"
              th:text="${n.has('context_key')} ? ${n.get('context_key').asText() + ' → ' + (n.has('context_value') ? n.get('context_value').asText() : '') + (n.has('provided_by') ? ' (provided)' : '')} : '—'">ctx</td>
        </tr>
      </th:block>
    </tbody>
  </table>
</th:block>
