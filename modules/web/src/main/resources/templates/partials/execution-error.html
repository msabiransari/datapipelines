<!-- 057/T85: the structured execution-error fragment, shared by the execution detail page's
     Error card and the result partial's failure branch. Model comes from
     ExecutionErrorView: plain strings plus `errorChain` already ROOT-CAUSE-FIRST with
     pre-joined frames. Absent sections (error-detail=structured carries no sql and no
     exception) simply do not render — no empty panel, no apology. Design tokens only. -->
<th:block th:fragment="error">
  <th:block th:if="${errorCode != null}">
    <div style="display: flex; align-items: baseline; gap: var(--gap-sm); flex-wrap: wrap; margin-bottom: var(--gap-sm);">
      <span class="ds-badge ds-badge-danger"
            style="font-family: var(--font-mono); font-size: var(--text-xs); word-break: break-all;"
            th:text="${errorCode}">pipeline.node.datasource_connection_failed</span>
      <span style="font-size: var(--text-sm); color: var(--text-primary); word-break: break-word;"
            th:text="${errorMessage}">Failed to initialize pool</span>
    </div>
    <div style="font-size: var(--text-sm); color: var(--text-secondary); margin-bottom: var(--gap-sm);"
         th:if="${errorUserMessage != null}" th:text="${errorUserMessage}">A step failed.</div>
    <div style="display: flex; gap: var(--gap-md); flex-wrap: wrap; font-size: var(--text-xs); color: var(--text-muted); margin-bottom: var(--gap-sm);">
      <span th:if="${failedNodeId != null}">failed node <code th:text="${failedNodeId}" style="font-family: var(--font-mono);">n</code></span>
      <span th:if="${errorCorrelationId != null}">correlation id <code th:text="${errorCorrelationId}" style="font-family: var(--font-mono); word-break: break-all;">id</code></span>
      <span th:if="${errorNodeLine != null}" th:text="${errorNodeLine}">node line</span>
      <a th:if="${errorDocUrl != null}" th:href="${errorDocUrl}" style="color: var(--text-muted);" target="_blank" rel="noopener">docs</a>
    </div>
    <pre style="background: var(--surface-inset); padding: var(--gap-xs); border-radius: var(--radius-base); font-family: var(--font-mono); font-size: var(--text-xs); white-space: pre-wrap; word-break: break-all; color: var(--text-secondary); margin-bottom: var(--gap-sm); max-height: 12vh; overflow-y: auto;"
         th:if="${errorDetailsJson != null}" th:text="${errorDetailsJson}">details</pre>
    <div style="margin-bottom: var(--gap-sm);" th:if="${errorSql != null}">
      <div style="font-size: var(--text-xs); color: var(--text-muted); margin-bottom: var(--gap-xs);">Rendered SQL (<code style="font-family: var(--font-mono);">:name</code> form — bound values are never included)</div>
      <pre style="background: var(--surface-inset); padding: var(--gap-sm); border-radius: var(--radius-base); font-family: var(--font-mono); font-size: var(--text-xs); overflow-x: auto; white-space: pre; max-height: 20vh; margin: 0;"
           th:text="${errorSql}">SELECT …</pre>
    </div>
    <details th:if="${!#lists.isEmpty(errorChain)}" style="border: 1px solid var(--border-default); border-radius: var(--radius-base); padding: var(--gap-xs) var(--gap-sm);">
      <summary style="cursor: pointer; font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--text-secondary);">
        Exception — root cause first
      </summary>
      <div th:each="level : ${errorChain}" style="margin-top: var(--gap-sm);">
        <div style="font-family: var(--font-mono); font-size: var(--text-xs); font-weight: var(--weight-semibold); word-break: break-all;"
             th:text="${level['label'] + level['cls']}">java.sql.SQLException</div>
        <div style="font-size: var(--text-xs); color: var(--text-secondary); word-break: break-word;"
             th:if="${level['message'] != null}" th:text="${level['message']}">message</div>
        <pre style="background: var(--surface-inset); padding: var(--gap-xs); border-radius: var(--radius-base); font-family: var(--font-mono); font-size: var(--text-xs); line-height: 1.5; color: var(--text-secondary); overflow-x: auto; white-space: pre; max-height: 30vh; overflow-y: auto; margin: var(--gap-xs) 0 0;"
             th:if="${level['framesText'] != null}" th:text="${level['framesText']}">frames</pre>
      </div>
    </details>
  </th:block>
</th:block>
