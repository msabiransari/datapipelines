<!-- 057/T85: the structured execution-error fragment, shared by the execution detail page's
     Error card and the result partial's failure branch. Model comes from
     ExecutionErrorView: plain strings plus `errorChain` already ROOT-CAUSE-FIRST with
     pre-joined frames. Absent sections (error-detail=structured carries no sql and no
     exception) simply do not render — no empty panel, no apology. Design tokens only. -->
<th:block th:fragment="error">
  <th:block th:if="${errorCode != null}">
    <div class="app-row-baseline u-wrap u-mb-sm">
      <span class="ds-badge ds-badge-danger u-mono u-text-xs u-break"
           
            th:text="${errorCode}">pipeline.node.datasource_connection_failed</span>
      <span class="u-text-sm u-primary app-break-word"
            th:text="${errorMessage}">Failed to initialize pool</span>
    </div>
    <div class="u-text-sm u-secondary u-mb-sm"
         th:if="${errorUserMessage != null}" th:text="${errorUserMessage}">A step failed.</div>
    <div class="u-row-md u-wrap u-text-xs u-muted u-mb-sm">
      <span th:if="${failedNodeId != null}">failed node <code class="u-mono" th:text="${failedNodeId}">n</code></span>
      <span th:if="${errorCorrelationId != null}">correlation id <code class="u-mono u-break" th:text="${errorCorrelationId}">id</code></span>
      <span th:if="${errorNodeLine != null}" th:text="${errorNodeLine}">node line</span>
      <a class="u-muted" th:if="${errorDocUrl != null}" th:href="${errorDocUrl}" target="_blank" rel="noopener">docs</a>
    </div>
    <pre class="app-errblock app-errblock-12 app-errblock-wrap u-secondary u-mb-sm"
         th:if="${errorDetailsJson != null}" th:text="${errorDetailsJson}">details</pre>
    <div class="u-mb-sm" th:if="${errorSql != null}">
      <div class="u-text-xs u-muted u-mb-xs">Rendered SQL (<code class="u-mono">:name</code> form — bound values are never included)</div>
      <pre class="app-errblock app-errblock-20 u-m0"
           th:text="${errorSql}">SELECT …</pre>
    </div>
    <details class="u-bordered app-pad-tight" th:if="${!#lists.isEmpty(errorChain)}">
      <summary class="app-summary">
        Exception — root cause first
      </summary>
      <div class="u-mt-sm" th:each="level : ${errorChain}">
        <div class="u-mono u-text-xs u-semibold u-break"
             th:text="${level['label'] + level['cls']}">java.sql.SQLException</div>
        <div class="u-text-xs u-secondary app-break-word"
             th:if="${level['message'] != null}" th:text="${level['message']}">message</div>
        <pre class="app-errblock app-errblock-30 app-errblock-tight u-secondary"
             th:if="${level['framesText'] != null}" th:text="${level['framesText']}">frames</pre>
      </div>
    </details>
  </th:block>
</th:block>
