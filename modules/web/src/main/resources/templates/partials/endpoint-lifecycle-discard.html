<!-- #786 B.3 — the API discard dialog. The GET pre-reads the version; the POST re-runs the service's guard. -->
<div xmlns:th="http://www.thymeleaf.org" class="u-backdrop" data-lifecycle-dialog="endpoint-discard">
  <div class="ds-card app-modal app-modal-md" role="dialog" aria-modal="true" aria-labelledby="axdiscard-title">
    <button type="button" class="ds-button ds-button-ghost ds-button-sm app-modal-close u-text-xl"
            aria-label="Close" data-lifecycle-close>
      <svg class="ds-icon ds-icon-sm" aria-hidden="true" focusable="false"><use href="/vendor/icons/lucide-sprite.svg#x"></use></svg>
    </button>
    <h2 class="ds-title u-m0 u-mb-md" id="axdiscard-title" th:text="'Discard v' + ${dlg.version} + '?'">Discard v2?</h2>
    <p class="u-text-sm">Pins <span class="u-mono" th:text="${dlg.pinLabel}">finance/revenue@3</span>.</p>
    <p class="u-secondary u-text-sm" th:text="${dlg.isCurrent} ? 'It is the current version, so it stops serving; the list then shows what the API serves.' : 'It can no longer be made current. Restore brings it back.'">It can no longer be made current.</p>
    <form th:attr="hx-post=@{'/partials/endpoints/{id}/lifecycle/discard'(id=${dlg.id},version=${dlg.version})}" hx-swap="none">
      <div class="app-page-actions">
        <button type="button" class="ds-button ds-button-ghost" data-lifecycle-close>Cancel</button>
        <button type="submit" class="ds-button ds-button-primary" data-api-submit>Discard</button>
      </div>
    </form>
  </div>
</div>
