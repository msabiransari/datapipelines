<!-- The /pipelines catalog's swap ROOT (067, #350): the flat list of full paths, rooted at
     id="pipeline-list-wrapper" (PipelineBrowseModel.fillWrapper). A non-empty `q` narrows it
     to the matches; there is no tree presentation to dispatch to — the folder tree is the
     global sidebar's, read from the REST tree since #460, and its server-rendered levels are
     gone with #466. This th:block contributes no element and MUST NOT carry the id —
     th:replace removes the host, so an id written here would never reach the DOM. -->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="fragment"
          th:replace="~{partials/pipeline-search :: results}">
</th:block>
