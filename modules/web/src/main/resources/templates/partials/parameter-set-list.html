<!-- The Parameter Sets CATALOG's flat list (#374): every set the caller's lens admits, as full paths, one
     server page of 25 at a time, under the stable swap root #parameter-set-list-wrapper so the pager
     replaces INSIDE the page and the root never moves. Plain links in a plain list — the page has no tree
     and no detail pane; the sidebar's Parameter Sets branch is the folder browser, and a set opens in its
     workspace (the pipelines catalog's shape, #350). Every row is a LINK to the canonical workspace
     /parameter-sets/{id}, a full document load (hx-boost="false"). A set the lens hides is not in this
     list: the service never returned it. -->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="results" th:id="${rootId}" data-parameter-set-list="page">
  <th:block th:if="${lensUnavailable != null and #lists.isEmpty(parameterSets)}">
    <div th:replace="~{partials/lens-unavailable :: notice(${lensUnavailable})}"></div>
  </th:block>
  <th:block th:if="${lensUnavailable == null and #lists.isEmpty(parameterSets)}">
    <div class="ds-empty">
      <p class="ds-empty-title">No parameter sets yet</p>
      <p class="ds-empty-description">
        Parameter sets are authored through the MCP server — ask your agent to create one. Give it a
        folder path like <code>finance/parameters/geo_filters</code> — a folder is required, and
        <code>test/&hellip;</code> is the place for experiments.
      </p>
    </div>
  </th:block>

  <ul class="tpl-results" th:unless="${#lists.isEmpty(parameterSets)}" aria-label="Parameter sets">
    <li th:each="p : ${parameterSets}">
      <a class="tpl-result" hx-boost="false"
         th:href="@{/parameter-sets/{id}(id=${p.id})}"
         th:attr="data-leaf-id=${p.id}">
        <span class="tpl-path" th:text="${p.name}" th:title="${p.name}">finance/parameters/geo_filters</span>
        <span class="ds-badge ds-badge-default" th:text="${'v' + p.version}">v1</span>
        <span th:if="${!p.released}" class="ds-badge ds-badge-warning"
              th:text="'draft v' + ${p.version} + ' pending release'"
              title="A draft exists; release it to publish."></span>
      </a>
    </li>
  </ul>

  <th:block th:unless="${#lists.isEmpty(parameterSets)}"
            th:with="prevUrl=@{/partials/parameter-sets/tree(offset=${offset - 25})},
                     nextUrl=@{/partials/parameter-sets/tree(offset=${offset + 25})}">
    <div th:replace="~{partials/pager :: pager('#' + ${rootId}, ${prevUrl}, ${nextUrl}, ${offset}, ${hasMore}, ${parameterSets.size()}, ${total})}"></div>
  </th:block>
</div>
