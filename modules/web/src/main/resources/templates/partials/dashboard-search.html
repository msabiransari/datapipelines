<!-- Artifact and version links use prepared main-content navigation, preserving the sidebar. -->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="results" th:id="${rootId}"
     data-dashboard-list="page">
  <th:block th:if="${lensUnavailable != null and #lists.isEmpty(dashboards)}">
    <div th:replace="~{partials/lens-unavailable :: notice(${lensUnavailable})}"></div>
  </th:block>
  <!-- The catalog with no query and no rows is the workspace's EMPTY state, not a failed
       search: it says how dashboards arrive (R10 — authored through agents). -->
  <th:block th:if="${lensUnavailable == null and #lists.isEmpty(dashboards) and #strings.isEmpty(q)}">
    <div class="ds-empty">
      <p class="ds-empty-title">No dashboards yet</p>
      <p class="ds-empty-description">
        Dashboards are authored through the MCP server — ask your agent to create one. Give it a
        folder path like <code>finance/dashboards/revenue_overview</code> — a folder is required.
      </p>
    </div>
  </th:block>
  <th:block th:if="${lensUnavailable == null and #lists.isEmpty(dashboards) and !#strings.isEmpty(q)}">
    <div class="ds-empty">
      <p class="ds-empty-title">No dashboards match your search</p>
      <div class="ds-empty-actions">
        <button type="button" class="ds-button ds-button-secondary ds-button-sm"
                data-dp-clear-filters="#dashboard-filter-q" hx-sync="#dashboard-filter-q:replace"
                th:attr="hx-get=@{/partials/dashboards}, hx-target='#' + ${rootId}, hx-swap='outerHTML'">Clear search</button>
      </div>
    </div>
  </th:block>

  <ul class="tpl-results" aria-label="Dashboards"
      th:unless="${#lists.isEmpty(dashboards)}">
    <li th:each="d : ${dashboards}">
      <a class="tpl-result" hx-boost="true"
         th:href="@{'/dashboards/' + ${d.id}}"
         th:attr="data-leaf-id=${d.id}">
        <!-- The FULL path, and it rides on `title` too — a deep path in a narrow pane
             truncates, and the truncated text must never be the only copy (§9.4). -->
        <span class="tpl-path" th:text="${d.name}" th:title="${d.name}">finance/dashboards/revenue_overview</span>
        <!-- D55: the working version — the draft's number when one exists (a freshly created
             dashboard has only a draft, and there is no served version to name instead). -->
        <span class="ds-badge ds-badge-default"
              th:text="${'v' + d.version}">v1</span>
        <!-- versioning §7 (the 035 regression) and the list.html promise, kept as a ROW state:
             a draft — and a draft-only dashboard, whose draft is the ONLY version — says so
             here. Opening one is the workspace's choose-a-version state, which names the
             dashboard and offers the draft with its preview link. -->
        <span th:if="${!d.released}" class="ds-badge ds-badge-warning"
              th:text="'draft v' + ${d.version} + ' pending release'"
              title="A draft exists; release it from the dashboard's workspace to publish."></span>
      </a>
    </li>
  </ul>

  <th:block th:unless="${#lists.isEmpty(dashboards)}"
            th:with="prevUrl=@{/partials/dashboards(q=${q}, offset=${offset - 25})},
                     nextUrl=@{/partials/dashboards(q=${q}, offset=${offset + 25})}">
    <div th:replace="~{partials/pager :: pager('#' + ${rootId}, ${prevUrl}, ${nextUrl}, ${offset}, ${hasMore}, ${dashboards.size()}, ${total})}"></div>
  </th:block>
</div>
