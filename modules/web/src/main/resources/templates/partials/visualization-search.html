<!-- Artifact and version links use prepared main-content navigation, preserving the sidebar. -->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="results" th:id="${rootId}"
     th:with="nav=${scope == 'nav'}" th:attr="data-visualization-list=${scope}">
  <th:block th:if="${lensUnavailable != null and #lists.isEmpty(visualizations)}">
    <div th:replace="~{partials/lens-unavailable :: notice(${lensUnavailable})}"></div>
  </th:block>
  <th:block th:if="${lensUnavailable == null and #lists.isEmpty(visualizations) and !nav and #strings.isEmpty(q)}">
    <div class="ds-empty">
      <p class="ds-empty-title">No visualizations yet</p>
      <p class="ds-empty-description">
        Visualizations are authored through the MCP server — ask your agent to create one. Give it
        a folder path like <code>finance/charts/revenue_by_region</code> — a folder is required.
      </p>
    </div>
  </th:block>
  <th:block th:if="${lensUnavailable == null and #lists.isEmpty(visualizations) and (nav or !#strings.isEmpty(q))}">
    <div class="ds-empty">
      <p class="ds-empty-title">No visualizations match your search</p>
      <div class="ds-empty-actions">
        <button th:if="${nav}" type="button" class="ds-button ds-button-secondary ds-button-sm"
                data-nav-tree-clear>Clear search</button>
        <button th:unless="${nav}" type="button" class="ds-button ds-button-secondary ds-button-sm"
                th:attr="hx-get=@{/partials/visualizations}, hx-target='#' + ${rootId}, hx-swap='outerHTML'">Clear search</button>
      </div>
    </div>
  </th:block>

  <ul class="tpl-results"
      th:unless="${#lists.isEmpty(visualizations)}"
      th:attr="role=${nav} ? 'listbox' : null,
               aria-label=${nav} ? 'Visualization search results' : 'Visualizations'">
    <li th:attr="role=${nav} ? 'none' : null" th:each="v : ${visualizations}">
      <a class="tpl-result" hx-boost="true"
         th:href="@{'/visualizations/' + ${v.id}}"
         th:attr="role=${nav} ? 'option' : null,
                  aria-selected=${nav} ? 'false' : null,
                  data-leaf-id=${v.id}">
        <span class="tpl-path" th:text="${v.name}" th:title="${v.name}">finance/charts/revenue_by_region</span>
        <span class="ds-badge ds-badge-default" th:text="${'v' + v.version}">v1</span>
        <span th:if="${!v.released}" class="ds-badge ds-badge-warning"
              th:text="'draft v' + ${v.version} + ' pending release'"
              title="A draft exists; release it from the visualization's workspace."></span>
      </a>
    </li>
  </ul>

  <th:block th:unless="${#lists.isEmpty(visualizations)}"
            th:with="prevUrl=${nav} ? @{/partials/visualizations/tree(q=${q}, scope='nav', offset=${offset - 25})} : @{/partials/visualizations(q=${q}, offset=${offset - 25})},
                     nextUrl=${nav} ? @{/partials/visualizations/tree(q=${q}, scope='nav', offset=${offset + 25})} : @{/partials/visualizations(q=${q}, offset=${offset + 25})}">
    <div th:replace="~{partials/pager :: pager('#' + ${rootId}, ${prevUrl}, ${nextUrl}, ${offset}, ${hasMore}, ${visualizations.size()}, ${total})}"></div>
  </th:block>
</div>
