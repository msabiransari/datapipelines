<!-- The Release dialog (ui-screens §4.3d, 102). The 094 §B shape: the pins are answered
     BEFORE the button — a DRAFT or MISSING template pin renders in the refused colour with
     "release the template first" and the button does not exist, which is §5.3 precondition 2
     pre-read, not a copy of the guard: the POST re-runs it in the service. -->
<div xmlns:th="http://www.thymeleaf.org" class="u-backdrop" data-lifecycle-dialog="pipeline-release">
  <div class="ds-card app-modal app-modal-md" role="dialog" aria-modal="true" aria-labelledby="plc-release-title">
    <button type="button" class="ds-button ds-button-ghost ds-button-sm app-modal-close u-text-xl"
            aria-label="Close" data-lifecycle-close>
      <svg class="ds-icon ds-icon-sm" aria-hidden="true" focusable="false"><use href="/vendor/icons/lucide-sprite.svg#x"></use></svg>
    </button>
    <h2 class="ds-title u-m0 u-mb-md" id="plc-release-title"
        th:text="'Release v' + ${dlg.version} + '?'">Release v3?</h2>

    <th:block th:if="${dlg.refusal != null}">
      <p class="u-secondary u-text-sm" th:text="${dlg.refusal.message}">No draft.</p>
    </th:block>

    <th:block th:if="${dlg.refusal == null}">
      <p class="u-secondary u-text-sm">
        Last written <span th:title="${#temporals.format(dlg.updatedAt, 'yyyy-MM-dd HH:mm')}" th:text="${dlg.updatedAgo}">2 hours ago</span>
        by <span th:text="${dlg.updatedBy}">Muhammad</span>.
      </p>

      <th:block th:if="${!#lists.isEmpty(dlg.pins)}">
        <p class="u-text-sm u-mb-xs">Template pins this release locks:</p>
        <ul class="u-text-sm u-mb-md" data-release-pins>
          <li th:each="p : ${dlg.pins}">
            <span class="u-mono" th:text="${p.label}">demo/x.sql@1</span>
            <span class="ds-badge ds-badge-default" th:classappend="${p.blocksRelease} ? 'ds-badge-danger'"
                  th:text="${p.statusLabel}">RELEASED</span>
            <span th:if="${p.blocksRelease}" class="tplx-danger u-text-sm"> — release the template first</span>
          </li>
        </ul>
      </th:block>

      <!-- The ONLY branch without the button: a blocking pin (§5.3). -->
      <p th:if="${!#lists.isEmpty(dlg.blockingPins)}" class="u-secondary u-text-sm">
        Releasing makes v<span th:text="${dlg.version}">3</span> the current version and locks it.
      </p>

      <form th:if="${#lists.isEmpty(dlg.blockingPins)}"
            th:attr="hx-post=@{'/partials/pipelines/{id}/lifecycle/release'(id=${dlg.id})},
                     hx-target=${from == 'editor'} ? null : '#pipeline-detail',
                     hx-swap=${from == 'editor'} ? 'none' : 'innerHTML'">
        <input type="hidden" name="from" th:value="${from}">
        <p class="u-secondary u-text-sm u-mb-md">
          Releasing makes v<span th:text="${dlg.version}">3</span> the current version and locks it.
        </p>
        <button type="submit" class="ds-button ds-button-primary u-full" hx-disabled-elt="this"
                th:text="'Release v' + ${dlg.version}">Release v3</button>
      </form>
    </th:block>
  </div>
</div>
