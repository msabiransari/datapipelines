<!-- The Release dialog for a visualization (#399) — the dashboard release dialog's shape (#400) over the
     visualization family's EXISTING rule (the service's order: at least one test case; the transform pin
     RELEASED, or DRAFT and released with it through the plan below; then the evidence gate — the latest run
     for this exact draft GREEN and the mechanical check passing now). The 094 §B shape: every NATIVE
     refusal (no draft, no test case, the evidence gate) is answered BEFORE the button — a refused dialog
     lists what the POST would answer and the button does not exist. The POST re-runs every guard regardless.

     #876 §F.2–F.3: the D61 consent group (the bare cascade flag) became the SHARED release plan (partials/release-dialog.html :: plan) —
     the transform template and everything below it are plan rows, each DRAFT one a checked box posting its node_id
     as include_dependencies, beside the plan's tree_hash. The plan renders for every draft, beside the native
     refusals: it alone presents the dependencies, so a MISSING or DISCARDED transform pin is its blocking row and
     a plan that is not submittable renders the submit disabled (lifecycle-dialog.js never enables it). -->
<div xmlns:th="http://www.thymeleaf.org" class="u-backdrop" data-lifecycle-dialog="visualization-release">
  <div class="ds-card app-modal app-modal-md dp-release" role="dialog" aria-modal="true" aria-labelledby="viz-release-title">
    <button type="button" class="ds-button ds-button-ghost ds-button-sm app-modal-close u-text-xl"
            aria-label="Close" data-lifecycle-close>
      <svg class="ds-icon ds-icon-sm" aria-hidden="true" focusable="false"><use href="/vendor/icons/lucide-sprite.svg#x"></use></svg>
    </button>
    <h2 class="ds-title u-m0 u-mb-md" id="viz-release-title"
        th:text="'Release v' + ${dlg.version} + '?'">Release v2?</h2>

    <p class="u-secondary u-text-sm" th:if="${!#strings.isEmpty(dlg.updatedBy)}">
      Last written <span th:text="${dlg.updatedAgo}">2 hours ago</span>
      by <span th:text="${dlg.updatedBy}">a member</span>;
      <span th:text="${dlg.caseCount} + (${dlg.caseCount} == 1 ? ' test case' : ' test cases')">3 test cases</span>.
    </p>

    <!-- The refused branch: what the POST would answer, in the service's order; no button. -->
    <th:block th:if="${!dlg.canRelease}">
      <ul class="u-text-sm u-mb-md" data-release-refusals>
        <li th:each="r : ${dlg.refusals}" th:attr="data-refusal-code=${r.code}">
          <span class="tplx-danger" th:text="${r.message}">The latest test run is RED; a release needs its run GREEN.</span>
          <span class="u-muted u-mono" th:text="${r.code}">visualization.release.tests_red</span>
        </li>
      </ul>
    </th:block>

    <form th:if="${dlg.hasDraft and rd != null}"
          th:attr="hx-post=@{'/partials/visualizations/{id}/lifecycle/release'(id=${dlg.id})},
                   hx-swap='none'">
      <input type="hidden" name="from" th:value="${from}">
      <!-- #416: the hash of the draft THIS dialog read (snake_case); the POST releases AT it. A draft changed
           after the dialog opened is refused: the plan's tree_hash answers visualization.release.plan_conflict
           first, and a current plan with a stale body_hash still answers visualization.version.conflict. -->
      <input type="hidden" name="body_hash" th:value="${dlg.bodyHash}" data-release-body-hash>
      <div th:replace="~{partials/release-dialog :: plan(${rd})}"></div>

      <p th:if="${dlg.canRelease}" class="u-secondary u-text-sm u-mb-md">
        Releasing makes v<span th:text="${dlg.version}">2</span> the current version and locks it; dashboards
        pin it by version.
      </p>

      <!-- Only a dialog the native rules admit has a button (094 §B); the plan then decides whether it is enabled. -->
      <button th:if="${canAuthor == true and dlg.canRelease}" type="submit" data-verb="visualization-release-confirm" data-consent-submit
              class="ds-button ds-button-primary u-full" hx-disabled-elt="this"
              th:attr="disabled=${!rd.submittable} ? 'disabled' : null"
              th:text="'Release v' + ${dlg.version}">Release v2</button>
    </form>
  </div>
</div>
