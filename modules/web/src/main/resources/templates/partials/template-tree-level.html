<!-- ONE level of the template tree (template-hierarchy-design §9.2), as the GLOBAL SIDEBAR
     renders it since #398.

     Deliberately the same shape as partials/pipeline-tree-level.html and
     partials/dashboard-tree-level.html, down to the class names: one stylesheet
     (template-tree.css) dresses every tree, a reader who knows one tree knows the others, and
     the browser-test selectors (details.tpl-folder, summary.tpl-summary, .tpl-leaf) transfer.

     The tree is backed by server-side prefix queries: this fragment renders the direct
     sub-folders and the direct template children of one prefix, and expanding a folder issues
     ONE more request for ONE more level. Nothing here ships the flat list to the browser and
     nothing assembles a tree in JS — at any size (§9.1).

     Folders are virtual (§3.1): a folder is a name prefix with no table, no column, no id and
     no CRUD. There is deliberately no New folder / rename / move / delete control anywhere in
     this file, and no empty-folder state — a folder is derived from the live rows beneath it,
     so one with nothing beneath it does not exist to be rendered.

     #398: a leaf NAVIGATES. It is a link to the canonical template workspace
     /templates/{name} (no version: the page's release-first rule resolves it, and a draft
     stays an explicit choice), and a FULL document load — hx-boost="false", the navigating-
     tree pattern's leaf (the dashboards tree's leaf precedent). The old explorer's
     select-into-a-detail-pane is gone with the pane.

     Folder expansion is <details>/<summary>: the browser owns open/closed state and the
     keyboard and screen-reader semantics, and htmx loads the level on the summary's FIRST
     click only (hx-trigger="click once"). nav-tree.js owns what the sidebar adds around it —
     the visible failure + retry, the stale-response guard, the width fit and the
     per-workspace state — without a second expansion path.

     The root level's id is #template-nav-root, the sidebar's stable swap root (its search and
     "clear" address it too); nested levels get a derived id from TemplateBrowseModel.levelId,
     so a placeholder and the fragment that replaces it cannot disagree. The `oob` flag is set
     ONLY by the create-success path (partials/template-created); every other render leaves
     the attribute off.

     ARIA: the ROOT level's list is role=tree; a NESTED level's container is role=group under
     its folder's treeitem. aria-expanded and the roving tabindex are owned by
     static/js/template-explorer.js (its nav context); aria-selected / aria-current mark the
     leaf of the page being viewed and are nav-tree.js's — the server cannot know which page
     the sidebar sits beside. -->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="level"
     th:id="${levelId}" class="tpl-level"
     th:attr="hx-swap-oob=${oob}, role=${#strings.isEmpty(prefix)} ? null : 'group'">

  <!-- The empty state belongs to the ROOT level only: a nested level always has at least one
       child, because its folder was derived from that child (§3.1). -->
  <th:block th:if="${lensUnavailable != null and #lists.isEmpty(folders) and #lists.isEmpty(templates)}">
    <div th:replace="~{partials/lens-unavailable :: notice(${lensUnavailable})}"></div>
  </th:block>
  <th:block th:if="${lensUnavailable == null and #lists.isEmpty(folders) and #lists.isEmpty(templates)}">
    <div class="ds-empty">
      <p class="ds-empty-title">No templates yet</p>
      <p class="ds-empty-description">
        Author one through your agent or the Create Template form under a folder, e.g.
        <code>test/&hellip;</code>
      </p>
    </div>
  </th:block>

  <ul class="tpl-tree"
      th:unless="${#lists.isEmpty(folders) and #lists.isEmpty(templates)}"
      th:attr="role=${#strings.isEmpty(prefix)} ? 'tree' : null,
               aria-label=${#strings.isEmpty(prefix)} ? 'Templates' : null">

    <!-- FOLDERS. The count is over live templates in the subtree under the SAME filters, so a
         folder whose whole subtree is filtered out is absent rather than empty. -->
    <li class="tpl-node" role="none" th:each="f : ${folders}">
      <details class="tpl-folder">
        <!-- The request rides on the SUMMARY, triggered by its own `click`, and targets the
             placeholder below with `next`. The obvious alternative — the request on the
             placeholder, triggered by `toggle from:closest details` — works at the root and
             silently does NOTHING for a folder that arrived in a swap: measured on the demo
             stack, the nested level's request never fires. `click` needs no `from:`
             indirection and no non-bubbling event, and `<summary>` raises it for keyboard
             activation too, so the keyboard path is unchanged. `once`: the level is fetched
             on first open and then simply shown and hidden. -->
        <summary class="tpl-summary" role="treeitem" aria-expanded="false"
                 th:attr="hx-get=@{/partials/templates(prefix=${f.path}, dialect=${selectedDialect}, type=${selectedType})}"
                 hx-trigger="click once"
                 hx-target="next .tpl-level" hx-swap="outerHTML">
          <!-- 085 §A: the disclosure marker is the sprite's chevron-right, rotated by CSS on
               details[open]; then the folder state glyph — folder-open swaps in via CSS on
               the same selector, so expansion needs no JS. All three are aria-hidden
               decoration: the summary's text and role carry the meaning. -->
          <svg class="ds-icon ds-icon-xs tpl-chevron" aria-hidden="true" focusable="false"><use href="/vendor/icons/lucide-sprite.svg#chevron-right"></use></svg>
          <svg class="ds-icon ds-icon-sm tpl-row-icon tpl-icon-folder" aria-hidden="true" focusable="false"><use href="/vendor/icons/lucide-sprite.svg#folder"></use></svg>
          <svg class="ds-icon ds-icon-sm tpl-row-icon tpl-icon-folder-open" aria-hidden="true" focusable="false"><use href="/vendor/icons/lucide-sprite.svg#folder-open"></use></svg>
          <span class="tpl-label" th:text="${f.segment}" th:title="${f.path}">finance</span>
          <span class="ds-badge ds-badge-default tpl-count" th:text="${f.templateCount}">12</span>
        </summary>
        <!-- Replaced whole by the child level, which carries this same derived id. -->
        <div class="tpl-level tpl-level-pending" th:id="${f.levelId}">
          <span class="ds-spinner htmx-indicator" aria-hidden="true"></span>
        </div>
      </details>
    </li>

    <!-- LEAVES. #398: a leaf is a LINK to the template's workspace — a full navigation
         (hx-boost="false", see the header). Enter on it is the browser's own link activation;
         the arrow keys only move focus (template-explorer.js's nav context). -->
    <li class="tpl-node" role="none" th:each="t : ${templates}">
      <a class="tpl-leaf" role="treeitem" aria-selected="false" hx-boost="false"
         th:href="@{'/templates/' + ${t.id}}"
         th:attr="data-leaf-id=${t.id}">
        <!-- The label is the leaf's own segment; the full path always rides on `title`
             (§9.4's rule for every surface that shows a template name). The file-code
             glyph sits where a sibling FOLDER's glyph sits — the leaf keeps the chevron
             slot empty (template-tree.css .tpl-leaf) — so a leaf's label lands one indent
             right of its parent's, level with its sibling folders' (owner, 2026-09-12: a
             leaf in the chevron slot read as a sibling of its own folder).

             There is no "at the root" branch here (077): §4.1 requires a folder, so a leaf
             always sits under a non-empty prefix and the substring is always the right
             label. TemplateBrowseModel does not even query the root's leaves. -->
        <svg class="ds-icon ds-icon-sm tpl-row-icon" aria-hidden="true" focusable="false"><use href="/vendor/icons/lucide-sprite.svg#file-code"></use></svg>
        <span class="tpl-label"
              th:text="${t.id.substring(prefix.length() + 1)}"
              th:title="${t.id}">monthly_revenue</span>
        <span class="ds-badge ds-badge-default" th:text="${t.type.wire}">sql</span>
        <span class="ds-badge ds-badge-default" th:if="${t.dialect != null}" th:text="${t.dialect.wire}">POSTGRES</span>
        <!-- versioning §7: unreleased edits stay visible in the list (templates §6). The tree
             keeps the badge compact; the version number and the release action live in the
             workspace, one click away. -->
        <span th:if="${drafts != null && drafts[t.id] != null}" class="ds-badge ds-badge-warning tpl-leaf-draft"
              th:title="'Draft v' + ${drafts[t.id].version} + ' is pending release — release it to publish.'">draft</span>
        <!-- 7d (transform-nodes design §8.2): a version citing a retired fact is MARKED on read,
             never blocked; the set is filled from the projection's own query. -->
        <span th:if="${needsReviewIds != null and #sets.contains(needsReviewIds, t.id)}" class="ds-badge ds-badge-warning" data-needs-review
              title="A fact this template cites was retired or superseded — re-verify before you lean on it.">needs review</span>
      </a>
    </li>
  </ul>

  <!-- Honest overflow rather than a silent cut: sub-folders are a GROUP BY over one path
       segment and are not paged. -->
  <p class="tpl-overflow" th:if="${foldersTruncated}">
    Only the first 200 sub-folders of this level are shown — narrow the view with search.
  </p>

  <!-- The level's own leaves page through the one shared pager, targeting this level's own
       root. `prefix` travels so the pager stays inside this level. -->
  <!-- The shared pager, rendered only when it can DO something: a tree renders many levels
       at once and most hold a handful of rows, so an always-on "Showing 1 of 1" with two
       dead buttons is noise repeated down the whole screen. The flat search list keeps the
       unconditional pager — there the count is the answer to the search. -->
  <th:block th:if="${!#lists.isEmpty(templates) and (offset > 0 or hasMore)}"
            th:with="prevUrl=@{/partials/templates(prefix=${prefix}, dialect=${selectedDialect}, type=${selectedType}, offset=${offset - 25})},
                     nextUrl=@{/partials/templates(prefix=${prefix}, dialect=${selectedDialect}, type=${selectedType}, offset=${offset + 25})}">
    <div th:replace="~{partials/pager :: pager('#' + ${levelId}, ${prevUrl}, ${nextUrl}, ${offset}, ${hasMore}, ${templates.size()}, ${total})}"></div>
  </th:block>
</div>
