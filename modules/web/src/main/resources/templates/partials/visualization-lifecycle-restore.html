<!-- The Restore dialog (#399) — a DISCARDED version becomes RELEASED again; the pointer moves only
     above-current-or-NULL (D60), and the dialog says whether it follows. The POST re-runs the service's
     dangling-pin check (#320: a version whose transform template went missing refuses restore). -->
<div xmlns:th="http://www.thymeleaf.org" class="u-backdrop" data-lifecycle-dialog="visualization-restore">
  <div class="ds-card app-modal app-modal-md" role="dialog" aria-modal="true" aria-labelledby="viz-restore-title">
    <button type="button" class="ds-button ds-button-ghost ds-button-sm app-modal-close u-text-xl"
            aria-label="Close" data-lifecycle-close>
      <svg class="ds-icon ds-icon-sm" aria-hidden="true" focusable="false"><use href="/vendor/icons/lucide-sprite.svg#x"></use></svg>
    </button>
    <h2 class="ds-title u-m0 u-mb-md" id="viz-restore-title"
        th:text="'Restore v' + ${dlg.version} + '?'">Restore v1?</h2>

    <p class="u-secondary u-text-sm">
      v<span th:text="${dlg.version}">1</span> becomes a released version again, pinnable by dashboards.
    </p>
    <p class="u-secondary u-text-sm u-mb-md" th:if="${dlg.movesPointer}">It also becomes the current version.</p>
    <p class="u-secondary u-text-sm u-mb-md" th:unless="${dlg.movesPointer}"
       th:text="'v' + ${dlg.currentVersion} + ' stays the current version.'">v3 stays the current version.</p>

    <form th:attr="hx-post=@{'/partials/visualizations/{id}/lifecycle/restore'(id=${dlg.id}, version=${dlg.version})},
                   hx-swap='none'">
      <input type="hidden" name="from" th:value="${from}">
      <button th:if="${canAuthor == true}" type="submit" data-verb="visualization-restore-confirm"
              class="ds-button ds-button-primary u-full" hx-disabled-elt="this"
              th:text="'Restore v' + ${dlg.version}">Restore v1</button>
    </form>
  </div>
</div>
