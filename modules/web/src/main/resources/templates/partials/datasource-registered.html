<!-- The register modal's success response (ui-screens.md §4.5, Shape A in §5.1).
     The form targets #register-result, so htmx swaps the non-OOB remainder (the
     success node) there — its arrival is what closes the modal (022/F9). The
     refreshed list and the toast ride along out-of-band; no HX-Redirect, so the
     screen never navigates and the toast survives. -->
<div xmlns:th="http://www.thymeleaf.org">
  <p style="color: var(--accent-success); font-size: var(--text-sm);"
     th:text="'Datasource ' + ${registeredName} + ' registered.'">registered</p>
  <!-- outerHTML OOB: the fragment root already carries id="datasource-list-wrapper";
       the controller set oob=true, which puts hx-swap-oob="true" on it for THIS
       render only (never baked into partials/datasources). -->
  <th:block th:replace="~{partials/datasources :: fragment}"></th:block>
  <div th:replace="~{partials/toast-oob :: oob('success', 'Datasource registered', ${registeredName} + ' is ready to use.')}"></div>
</div>
