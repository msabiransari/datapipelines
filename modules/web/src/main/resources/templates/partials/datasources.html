<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="fragment">
  <th:block th:if="${#lists.isEmpty(datasources)}">
    <div class="ds-empty-state" style="text-align: center; padding: var(--gap-2xl) var(--gap-lg);">
      <p style="color: var(--text-secondary); font-size: var(--text-base); margin-bottom: var(--gap-sm);">No datasources found</p>
      <p style="color: var(--text-secondary); font-size: var(--text-sm);" th:if="${#strings.isEmpty(q)}">Register your first datasource to get started.</p>
      <p style="color: var(--text-secondary); font-size: var(--text-sm);" th:unless="${#strings.isEmpty(q)}">Try adjusting your search.</p>
    </div>
  </th:block>

  <th:block th:unless="${#lists.isEmpty(datasources)}">
    <div style="border: 1px solid var(--border-default); border-radius: var(--radius-base); overflow: hidden;">
      <table style="width: 100%; border-collapse: collapse; font-size: var(--text-sm);">
        <thead>
          <tr style="background: var(--surface-raised); border-bottom: 1px solid var(--border-default);">
            <th style="padding: var(--gap-sm) var(--gap-md); text-align: left; font-weight: var(--weight-semibold); color: var(--text-secondary);">Name</th>
            <th style="padding: var(--gap-sm) var(--gap-md); text-align: left; font-weight: var(--weight-semibold); color: var(--text-secondary);">Dialect</th>
            <th style="padding: var(--gap-sm) var(--gap-md); text-align: left; font-weight: var(--weight-semibold); color: var(--text-secondary);">Workspace</th>
            <th style="padding: var(--gap-sm) var(--gap-md); text-align: left; font-weight: var(--weight-semibold); color: var(--text-secondary);">URL</th>
            <th style="padding: var(--gap-sm) var(--gap-md); text-align: left; font-weight: var(--weight-semibold); color: var(--text-secondary);">Username</th>
            <th style="padding: var(--gap-sm) var(--gap-md); text-align: right; font-weight: var(--weight-semibold); color: var(--text-secondary);">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="ds : ${datasources}" th:id="'ds-row-' + ${ds.name}"
              th:style="${dsStat.odd} ? 'border-bottom: 1px solid var(--border-default); background: var(--surface-default);' : 'border-bottom: 1px solid var(--border-default);'">
            <td style="padding: var(--gap-sm) var(--gap-md); font-weight: var(--weight-medium);">
              <span th:text="${ds.name}">pg-prod</span>
              <span th:if="${ds.isReadonly}"
                    style="display: inline-block; margin-left: var(--gap-xs); padding: 2px var(--gap-sm); border-radius: var(--radius-base); background: var(--surface-raised); font-size: var(--text-xs); color: var(--text-secondary);"
                    title="Write-shaped pipeline uses of this datasource are refused">readonly</span>
            </td>
            <td style="padding: var(--gap-sm) var(--gap-md);">
              <span style="display: inline-block; padding: 2px var(--gap-sm); border-radius: var(--radius-base); background: var(--surface-raised); font-size: var(--text-xs); font-family: monospace;" th:text="${ds.dialect.wire}"></span>
            </td>
            <td style="padding: var(--gap-sm) var(--gap-md); color: var(--text-secondary); font-size: var(--text-xs);">
              <span th:if="${ds.workspaceName} != null" th:text="${ds.workspaceName}">team</span>
              <span th:if="${ds.workspaceName} == null" title="Visible to every workspace">global</span>
            </td>
            <td style="padding: var(--gap-sm) var(--gap-md); color: var(--text-secondary); max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" th:text="${ds.jdbcUrl}"></td>
            <td style="padding: var(--gap-sm) var(--gap-md);" th:text="${ds.username}"></td>
            <td style="padding: var(--gap-sm) var(--gap-md); text-align: right; white-space: nowrap;">
              <th:block th:if="${#sets.contains(scopes, 'AUTHOR') or #sets.contains(scopes, 'ADMIN')}">
                <button class="ds-button ds-button-secondary ds-button-sm"
                        th:attr="hx-post=@{/partials/datasources/{name}/test(name=${ds.name})}, hx-target='#ds-row-' + ${ds.name}, hx-swap=outerHTML"
                        th:text="'Test'">Test</button>
              </th:block>
              <button class="ds-button ds-button-ghost ds-button-sm"
                      th:attr="hx-get=@{/api/v1/datasources/{name}(name=${ds.name})}"
                      th:text="'View'">View</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: var(--gap-md); margin-top: var(--gap-md); font-size: var(--text-sm);">
      <button class="ds-button ds-button-ghost ds-button-sm"
              th:disabled="${offset == 0}"
              th:with="prevUrl=@{/partials/datasources(q=${q}, dialect=${selectedDialect}, offset=${offset - 25})}"
              th:attr="hx-get=${prevUrl}"
              hx-target="#datasource-list-wrapper" hx-swap="outerHTML">
        Previous
      </button>
      <span style="color: var(--text-secondary);" th:text="'Showing ' + ${datasources.size()} + ' of ' + ${total}"></span>
      <button class="ds-button ds-button-ghost ds-button-sm"
              th:disabled="${!hasMore}"
              th:with="nextUrl=@{/partials/datasources(q=${q}, dialect=${selectedDialect}, offset=${offset + 25})}"
              th:attr="hx-get=${nextUrl}"
              hx-target="#datasource-list-wrapper" hx-swap="outerHTML">
        Next
      </button>
    </div>
  </th:block>
</th:block>
