<th:block xmlns:th="http://www.thymeleaf.org">
  <!--
    A standalone view (025 B2): this is what GET /partials/dashboard-stats returns and what
    dashboard.html's skeleton divs are swapped for. It is NOT a parameterized fragment —
    the old `stats(children)` signature made the standalone render die on
    `th:replace="${children}"` (no children exist outside an include), which is the 500
    every dashboard load hit at its two hx-get endpoints.
  -->
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--gap-md);">
    <div class="ds-card">
      <div style="font-size: var(--text-xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--text-muted); margin-bottom: var(--gap-xs);">Total Pipelines</div>
      <div style="font-size: var(--text-2xl); font-weight: var(--weight-bold);" th:text="${totalPipelines}">0</div>
    </div>
    <div class="ds-card">
      <div style="font-size: var(--text-xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--text-muted); margin-bottom: var(--gap-xs);">Executions Today</div>
      <div style="font-size: var(--text-2xl); font-weight: var(--weight-bold);" th:text="${executionsToday}">0</div>
    </div>
    <div class="ds-card">
      <div style="font-size: var(--text-xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--text-muted); margin-bottom: var(--gap-xs);">Success Rate</div>
      <div style="font-size: var(--text-2xl); font-weight: var(--weight-bold);" th:text="${successRate + '%'}">0%</div>
    </div>
  </div>
</th:block>
