<!-- The Purge-dashboard dialog (#400) — the whole entity, sole-draft-only (versioning §3.2's
     graph rule): any other version set refuses in place and the button does not exist. The
     typed confirm names the DASHBOARD (its full path, which the dialog showed); the POST
     re-reads the name fresh, so a rename between dialog and POST refuses rather than
     guesses. -->
<div xmlns:th="http://www.thymeleaf.org" class="u-backdrop" data-lifecycle-dialog="dashboard-purge-entity">
  <div class="ds-card app-modal app-modal-md" role="dialog" aria-modal="true" aria-labelledby="dp-purge-entity-title">
    <button type="button" class="ds-button ds-button-ghost ds-button-sm app-modal-close u-text-xl"
            aria-label="Close" data-lifecycle-close>
      <svg class="ds-icon ds-icon-sm" aria-hidden="true" focusable="false"><use href="/vendor/icons/lucide-sprite.svg#x"></use></svg>
    </button>
    <h2 class="ds-title u-m0 u-mb-md" id="dp-purge-entity-title">Purge this dashboard?</h2>

    <th:block th:if="${dlg.refusal != null}">
      <p class="u-secondary u-text-sm" th:text="${dlg.refusal.message}">An entity purge requires the only version to be a DRAFT.</p>
    </th:block>

    <th:block th:if="${dlg.refusal == null}">
      <p class="u-secondary u-text-sm">
        The dashboard and its draft are deleted permanently — this cannot be undone. The
        catalog and the sidebar tree lose it at once.
      </p>

      <form th:attr="hx-post=@{'/partials/dashboards/{id}/lifecycle/purge-entity'(id=${dlg.id})},
                       hx-swap='none'">
        <label class="ds-form-label u-mt-md" th:for="'dp-purge-entity-confirm'">
          Type <span class="u-mono" th:text="${dlg.expected}">finance/dashboards/revenue_overview</span> to confirm
        </label>
        <input class="ds-input u-mono" id="dp-purge-entity-confirm" data-confirm-input name="confirm" autocomplete="off"
               spellcheck="false" th:attr="data-confirm-expect=${dlg.expected}">
        <button th:if="${canAuthor == true}" type="submit" data-verb="dashboard-purge-entity-confirm" class="ds-button ds-button-danger u-full u-mt-md" data-typed-confirm
                disabled hx-disabled-elt="this">Purge dashboard</button>
      </form>
    </th:block>
  </div>
</div>
