<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="table">
  <th:block th:if="${#lists.isEmpty(executions)}">
    <div class="ds-empty">
      <div class="ds-empty-title">No executions found</div>
      <div class="ds-empty-description" th:if="${offset == 0}">Run a pipeline to see results here.</div>
      <div class="ds-empty-description" th:unless="${offset == 0}">No more results.</div>
    </div>
  </th:block>
  <th:block th:unless="${#lists.isEmpty(executions)}">
    <table class="ds-table">
      <thead>
        <tr>
          <th>Pipeline</th>
          <th>Version</th>
          <th>Status</th>
          <th>Started</th>
          <th>Duration</th>
          <th>Rows</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="r : ${executions}" style="cursor: pointer;" th:attr="onclick='window.location.href=\'/executions/' + ${r.executionId} + '\''">
          <td>
            <span th:text="${r.pipelineId.toString().substring(0, 8) + '...'}">pipeline</span>
            <div th:if="${r.parentExecutionId != null}" style="font-size: var(--text-xs);">
              <a th:href="@{/executions/{id}(id=${r.parentExecutionId})}"
                 onclick="event.stopPropagation()"
                 style="color: var(--text-muted);"
                 th:text="${'spawned by ' + r.parentExecutionId.toString().substring(0, 8) + '...'}">spawned by</a>
            </div>
          </td>
          <td th:text="${r.pipelineVersion}">1</td>
          <td>
            <span class="ds-badge"
                  th:classappend="${r.status.name() == 'SUCCESS'} ? 'ds-badge-success' : (${r.status.name() == 'FAILED'} ? 'ds-badge-danger' : (${r.status.name() == 'RUNNING'} ? 'ds-badge-primary' : 'ds-badge-warning'))"
                  th:text="${r.status.name()}">status</span>
          </td>
          <td th:text="${#temporals.format(r.startedAt, 'yyyy-MM-dd HH:mm')}">date</td>
          <td th:text="${r.durationMs != null} ? ${r.durationMs + 'ms'} : '-'">dur</td>
          <td th:text="${r.resultRowCount != null} ? ${r.resultRowCount} : '-'">rows</td>
        </tr>
      </tbody>
    </table>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: var(--gap-md);">
      <th:block th:if="${offset > 0}">
        <button class="ds-button ds-button-secondary"
                hx-get="/partials/executions"
                hx-include="#execution-filters"
                hx-vals='{"offset": "[[${offset - pageSize}]]"}'
                hx-target="#execution-table"
                hx-swap="innerHTML">Previous</button>
      </th:block>
      <th:block th:unless="${offset > 0}">
        <span></span>
      </th:block>
      <th:block th:if="${hasMore}">
        <button class="ds-button ds-button-secondary"
                hx-get="/partials/executions"
                hx-include="#execution-filters"
                hx-vals='{"offset": "[[${nextOffset}]]"}'
                hx-target="#execution-table"
                hx-swap="innerHTML">Next</button>
      </th:block>
    </div>
  </th:block>
</th:block>
