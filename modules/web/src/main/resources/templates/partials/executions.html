<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="table">
  <th:block th:if="${#lists.isEmpty(executions)}">
    <div class="ds-empty">
      <div class="ds-empty-title">No executions found</div>
      <div class="ds-empty-description" th:if="${offset == 0}">Run a pipeline to see results here.</div>
      <div class="ds-empty-description" th:unless="${offset == 0}">No more results.</div>
    </div>
  </th:block>
  <th:block th:unless="${#lists.isEmpty(executions)}">
    <table class="ds-table">
      <thead>
        <tr>
          <th>Pipeline</th>
          <th>Version</th>
          <th>Status</th>
          <th>Started</th>
          <th class="num">Duration</th>
          <th class="num">Rows</th>
          <th>Via</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="r : ${executions}" class="app-row-clickable" th:attr="onclick='window.location.href=\'/executions/' + ${r.executionId} + '\''">
          <td>
            <!-- T114: the display name is prose — it renders in the body face, not mono
                 (mono is for identifiers). The machine name (a folder path) rides on
                 `title`; a pipeline whose row is gone (deleted, execution remains) falls
                 back to the truncated id. -->
            <span class="app-name" th:with="p=${pipelineNames != null ? pipelineNames[r.pipelineId] : null}"
                  th:text="${p != null} ? (${p.displayName != null} ? ${p.displayName} : ${p.name}) : (${r.pipelineId.toString().substring(0, 8) + '...'})"
                  th:title="${p != null} ? ${p.name} : null">pipeline</span>
            <span class="app-path" th:with="p=${pipelineNames != null ? pipelineNames[r.pipelineId] : null}"
                  th:if="${p != null and p.displayName != null}" th:text="${p.name}">nyc/mobility/x</span>
            <div class="u-text-xs" th:if="${r.parentExecutionId != null}">
              <a class="u-muted" th:href="@{/executions/{id}(id=${r.parentExecutionId})}"
                 onclick="event.stopPropagation()"
                 th:text="${'spawned by ' + r.parentExecutionId.toString().substring(0, 8) + '...'}">spawned by</a>
            </div>
          </td>
          <td th:text="${r.pipelineVersion}">1</td>
          <td>
            <span class="app-chip"
                  th:classappend="${r.status.name() == 'SUCCESS'} ? 'app-chip-ok' : (${r.status.name() == 'FAILED'} ? 'app-chip-bad' : (${r.status.name() == 'RUNNING'} ? 'app-chip-run' : 'app-chip-warn'))"><i class="ds-status"></i><span th:text="${#strings.capitalize(#strings.toLowerCase(r.status.name()))}">Success</span></span>
          </td>
          <td th:text="${#temporals.format(r.startedAt, 'yyyy-MM-dd HH:mm')}">date</td>
          <td class="num" th:text="${r.durationMs != null} ? ${r.durationMs + ' ms'} : '—'">dur</td>
          <td class="num" th:text="${r.resultRowCount != null} ? ${r.resultRowCount} : '—'">rows</td>
          <!-- 079 §E: `triggered_via` rides on every ExecutionRecord already (SELECT_COLUMNS
               carries it) and was rendered only on the detail screen. -->
          <td class="u-muted u-text-xs" th:text="${r.triggeredVia.name()}">MCP</td>
        </tr>
      </tbody>
    </table>

    <div class="u-row u-between u-mt-md">
      <th:block th:if="${offset > 0}">
        <button class="ds-button ds-button-secondary"
                hx-get="/partials/executions"
                hx-include="#execution-filters"
                th:attr="hx-vals=|{&quot;offset&quot;: ${offset - pageSize}}|"
                hx-target="#execution-table"
                hx-swap="innerHTML">Previous</button>
      </th:block>
      <th:block th:unless="${offset > 0}">
        <span></span>
      </th:block>
      <th:block th:if="${hasMore}">
        <button class="ds-button ds-button-secondary"
                hx-get="/partials/executions"
                hx-include="#execution-filters"
                th:attr="hx-vals=|{&quot;offset&quot;: ${nextOffset}}|"
                hx-target="#execution-table"
                hx-swap="innerHTML">Next</button>
      </th:block>
    </div>
  </th:block>
</th:block>
