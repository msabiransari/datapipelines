<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="fragment">
  <tr th:id="'ds-row-' + ${testName}"
      style="border-bottom: 1px solid var(--border-default);">
    <td colspan="6" style="padding: var(--gap-sm) var(--gap-md);">
      <th:block th:if="${testResult != null}">
        <th:block th:if="${testResult.connected}">
          <span style="color: var(--accent-success); font-size: var(--text-sm);">Connected — Server version: <span th:text="${testResult.serverVersion}"></span></span>
        </th:block>
        <th:block th:unless="${testResult.connected}">
          <span style="color: var(--accent-danger); font-size: var(--text-sm);">Connection failed — <span th:text="${testResult.error}"></span></span>
        </th:block>
      </th:block>
      <th:block th:unless="${testResult != null}">
        <span style="color: var(--text-secondary); font-size: var(--text-sm);">Datasource not found</span>
      </th:block>
    </td>
  </tr>
  <tr th:id="'ds-row-' + ${testName} + '-actions'"
      style="border-bottom: 1px solid var(--border-default);">
    <td colspan="6" style="padding: var(--gap-sm) var(--gap-md); text-align: right;">
      <button class="ds-button ds-button-ghost ds-button-sm"
              th:attr="hx-get=@{/partials/datasources}, hx-target='#ds-row-' + ${testName} + ', #ds-row-' + ${testName} + '-actions', hx-swap=outerHTML">
        Back to list
      </button>
    </td>
  </tr>
</th:block>
