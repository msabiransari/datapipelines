<!-- Artifact and version links use prepared main-content navigation, preserving the sidebar. -->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="results" th:id="${rootId}"
     th:with="nav=${scope == 'nav'}" th:attr="data-pipeline-list=${scope}">
  <th:block th:if="${lensUnavailable != null and #lists.isEmpty(pipelines)}">
    <div th:replace="~{partials/lens-unavailable :: notice(${lensUnavailable})}"></div>
  </th:block>
  <!-- The catalog with no query and no rows is the workspace's EMPTY state, not a failed
       search: it says how pipelines arrive (R10 — authored through agents), like the tree's. -->
  <th:block th:if="${lensUnavailable == null and #lists.isEmpty(pipelines) and !nav and #strings.isEmpty(q)}">
    <div class="ds-empty">
      <p class="ds-empty-title">No pipelines yet</p>
      <p class="ds-empty-description">
        Pipelines are authored through the MCP server — ask your agent to create one. Give it a
        folder path like <code>nyc/mobility/revenue_by_borough</code> — a folder is required,
        and <code>test/&hellip;</code> is the place for experiments.
      </p>
    </div>
  </th:block>
  <th:block th:if="${lensUnavailable == null and #lists.isEmpty(pipelines) and (nav or !#strings.isEmpty(q))}">
    <div class="ds-empty">
      <p class="ds-empty-title">No pipelines match your search</p>
      <div class="ds-empty-actions">
        <button th:unless="${nav}" type="button" class="ds-button ds-button-secondary ds-button-sm"
                th:attr="hx-get=@{/partials/pipelines}, hx-target='#' + ${rootId}, hx-swap='outerHTML'">Clear search</button>
      </div>
    </div>
  </th:block>

  <ul class="tpl-results"
      th:unless="${#lists.isEmpty(pipelines)}"
      th:attr="role=${nav} ? 'listbox' : null,
               aria-label=${nav} ? 'Pipeline search results' : 'Pipelines'">
    <li th:attr="role=${nav} ? 'none' : null" th:each="p : ${pipelines}">
      <a class="tpl-result" hx-boost="true"
         th:href="@{/pipelines/{id}(id=${p.id})}"
         th:attr="role=${nav} ? 'option' : null,
                  aria-selected=${nav} ? 'false' : null,
                  data-leaf-id=${p.id}">
        <!-- The FULL path, and it rides on `title` too — a deep path in a narrow pane
             truncates, and the truncated text must never be the only copy (§9.4). -->
        <span class="tpl-path" th:text="${p.name}" th:title="${p.name}">nyc/mobility/revenue_by_borough</span>
        <!-- D55/D56: the working version — the draft's number when one exists (a freshly
             created pipeline has only a draft, and `currentVersion` is null). -->
        <!-- The binding goes on a wrapping th:block, never beside th:if on one element:
             th:with is precedence 500 and th:if is 300, so a same-element binding is not yet in
             scope when the condition runs (the trap partials/executions.html records). -->
        <th:block th:with="d=${drafts != null ? drafts[p.id] : null}">
          <span class="ds-badge ds-badge-default"
                th:if="${d != null or p.currentVersion != null}"
                th:text="${'v' + (d != null ? d.version : p.currentVersion)}">v1</span>
        </th:block>
        <!-- versioning §7 (the 035 regression): unreleased — often agent — work must be
             VISIBLE from first paint. The flat list has room for the version number, so it
             says the whole thing; the tree's leaf keeps the compact badge. -->
        <span th:if="${drafts != null && drafts[p.id] != null}" class="ds-badge ds-badge-warning"
              th:text="'draft v' + ${drafts[p.id].version} + ' pending release'"
              title="A draft exists; release it from the pipeline's workspace to publish."></span>
      </a>
    </li>
  </ul>

  <th:block th:unless="${#lists.isEmpty(pipelines)}"
            th:with="prevUrl=${nav} ? @{/partials/pipelines(q=${q}, scope='nav', offset=${offset - 25})} : @{/partials/pipelines(q=${q}, offset=${offset - 25})},
                     nextUrl=${nav} ? @{/partials/pipelines(q=${q}, scope='nav', offset=${offset + 25})} : @{/partials/pipelines(q=${q}, offset=${offset + 25})}">
    <div th:replace="~{partials/pager :: pager('#' + ${rootId}, ${prevUrl}, ${nextUrl}, ${offset}, ${hasMore}, ${pipelines.size()}, ${total})}"></div>
  </th:block>
</div>
