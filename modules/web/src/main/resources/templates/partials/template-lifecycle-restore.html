<!-- The template Restore dialog (ui-screens §4.3d/§4.6, 102). -->
<div xmlns:th="http://www.thymeleaf.org" class="u-backdrop" data-lifecycle-dialog="template-restore">
  <div class="ds-card app-modal app-modal-md" role="dialog" aria-modal="true" aria-labelledby="tlc-restore-title">
    <button type="button" class="ds-button ds-button-ghost ds-button-sm app-modal-close u-text-xl"
            aria-label="Close" data-lifecycle-close>
      <svg class="ds-icon ds-icon-sm" aria-hidden="true" focusable="false"><use href="/vendor/icons/lucide-sprite.svg#x"></use></svg>
    </button>
    <h2 class="ds-title u-m0 u-mb-md" id="tlc-restore-title"
        th:text="'Restore v' + ${dlg.version} + '?'">Restore v1?</h2>

    <p class="u-secondary u-text-sm">
      Restoring makes v<span th:text="${dlg.version}">1</span> a live release again.
      <span th:if="${dlg.movesPointer}" th:text="' v' + ${dlg.version} + ' becomes the resolved version.'"> v1 becomes the resolved version.</span>
      <span th:if="${!dlg.movesPointer and dlg.currentVersion != null}"
            th:text="' The pointer stays at v' + ${dlg.currentVersion} + '.'"> The pointer stays at v2.</span>
    </p>

    <form class="u-mt-md"
          th:attr="hx-post=@{'/partials/templates/lifecycle/restore'(name=${dlg.id}, version=${dlg.version})},
                   hx-target='#template-detail', hx-swap='innerHTML'">
      <input type="hidden" name="name" th:value="${dlg.id}">
      <input type="hidden" name="version" th:value="${dlg.version}">
      <button type="submit" class="ds-button ds-button-primary u-full" hx-disabled-elt="this"
              th:text="'Restore v' + ${dlg.version}">Restore v1</button>
    </form>
  </div>
</div>
