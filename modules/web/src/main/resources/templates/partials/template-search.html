<!-- Search results: a FLAT list of full paths (template-hierarchy-design §9.2, decided),
     rendered in the explorer's LEFT pane (058).

     Not a tree pruned to matching leaves. Pruning requires walking the ancestors of every
     match, which is precisely the whole-list-in-the-browser work §9.1 forbids, and a flat list
     of full paths is what someone searching `finance/agg` actually wants to see. Clearing `q`
     returns to the tree — partials/templates dispatches on exactly that.

     A result row SELECTS, exactly like a tree leaf: its header + versions table swap into
     #template-detail on the right, and Enter opens the editor. The rows are role=option in a
     role=listbox — this is a result list, not a tree, so it does not wear tree machinery.

     The ROOT carries id="template-list-wrapper", the same stable swap target the tree's root
     level carries, so the filter controls and the pager address one id in both presentations
     (ui-screens.md §4.5). The `oob` flag is set ONLY by the create-success path. -->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="results" id="template-list-wrapper"
     th:attr="hx-swap-oob=${oob}">
  <th:block th:if="${#lists.isEmpty(templates)}">
    <div class="ds-empty">
      <p class="ds-empty-title">No templates match your search</p>
      <div class="ds-empty-actions">
        <button class="ds-button ds-button-secondary ds-button-sm"
                th:attr="hx-get=@{/partials/templates}, hx-target='#template-list-wrapper', hx-swap='outerHTML'">Clear filters</button>
      </div>
    </div>
  </th:block>

  <!-- The full path IS the row — in a pane, not a full-width table (058); type and dialect
       ride along as the same badges a tree leaf carries, and the detail pane is where the
       wider columns live. -->
  <ul class="tpl-results" role="listbox" aria-label="Search results"
      th:unless="${#lists.isEmpty(templates)}">
    <li role="none" th:each="t : ${templates}">
      <button type="button" class="tpl-result" role="option" aria-selected="false"
              th:attr="hx-get=@{/partials/templates/versions(name=${t.id})},
                       data-editor-url=@{/templates/editor(name=${t.id})}"
              hx-target="#template-detail" hx-swap="innerHTML"
              hx-sync="#template-detail:replace"
              hx-indicator="#template-detail-spinner">
        <!-- The FULL path, and it rides on `title` too — a deep path in a narrow pane
             truncates, and the truncated text must never be the only copy (§9.4). -->
        <span class="tpl-path" th:text="${t.id}" th:title="${t.id}">acme/finance/monthly_revenue</span>
        <span class="ds-badge ds-badge-default" th:text="${t.type.wire}">sql</span>
        <span class="ds-badge ds-badge-default" th:if="${t.dialect != null}" th:text="${t.dialect.wire}">POSTGRES</span>
        <span th:if="${drafts != null && drafts[t.id] != null}" class="ds-badge ds-badge-warning"
              th:title="'Draft v' + ${drafts[t.id].version} + ' is pending release — release it from the editor to publish.'">draft</span>
      </button>
    </li>
  </ul>

  <th:block th:unless="${#lists.isEmpty(templates)}"
            th:with="prevUrl=@{/partials/templates(q=${q}, dialect=${selectedDialect}, type=${selectedType}, offset=${offset - 25})},
                     nextUrl=@{/partials/templates(q=${q}, dialect=${selectedDialect}, type=${selectedType}, offset=${offset + 25})}">
    <div th:replace="~{partials/pager :: pager('#template-list-wrapper', ${prevUrl}, ${nextUrl}, ${offset}, ${hasMore}, ${templates.size()}, ${total})}"></div>
  </th:block>
</div>
