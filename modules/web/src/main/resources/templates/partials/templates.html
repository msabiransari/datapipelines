<!-- The templates screen's swap ROOT — a dispatcher, not an element of its own.

     Browse and search are different presentations of the same surface
     (template-hierarchy-design §9.2, decided): browsing renders the tree one level per
     request; a non-empty `q` renders a FLAT list of full paths. Pruning a tree to matching
     leaves would mean walking the ancestors of every match — exactly the whole-list-in-the-
     browser work §9.1 forbids — and a flat list of full paths is what someone searching
     `finance/agg` wants to see. Clearing `q` returns to the tree, by construction: the same
     dispatcher answers both.

     Either branch's own root element carries id="template-list-wrapper", so the single stable
     swap target of ui-screens.md §4.5 survives every refresh in both presentations. This
     th:block contributes no element and MUST NOT carry the id — th:replace removes the host,
     so an id written here would never reach the DOM. -->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="fragment"
          th:replace="${searching} ? ~{partials/template-search :: results} : ~{partials/template-tree-level :: level}">
  <!-- ONE conditional fragment expression, not two blocks each carrying th:if + th:replace:
       th:replace has HIGHER attribute precedence than th:if, so the pair-of-blocks form
       renders BOTH presentations and the condition never runs. -->
</th:block>
