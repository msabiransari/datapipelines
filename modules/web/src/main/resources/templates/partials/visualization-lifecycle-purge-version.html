<!-- The Purge-version dialog (#399) — a DRAFT version deleted permanently (`purgeVersion`: drafts only,
     never a pinned one); the sole version takes the visualization with it. Typed confirm `v<n>`, checked
     client-side and server-side before the service runs. -->
<div xmlns:th="http://www.thymeleaf.org" class="u-backdrop" data-lifecycle-dialog="visualization-purge-version">
  <div class="ds-card app-modal app-modal-md" role="dialog" aria-modal="true" aria-labelledby="viz-purge-version-title">
    <button type="button" class="ds-button ds-button-ghost ds-button-sm app-modal-close u-text-xl"
            aria-label="Close" data-lifecycle-close>
      <svg class="ds-icon ds-icon-sm" aria-hidden="true" focusable="false"><use href="/vendor/icons/lucide-sprite.svg#x"></use></svg>
    </button>
    <h2 class="ds-title u-m0 u-mb-md" id="viz-purge-version-title"
        th:text="'Purge v' + ${dlg.version} + '?'">Purge v2?</h2>

    <div th:replace="~{partials/visualization-lifecycle-pinned :: pinned(${dlg.pinnedBy})}"></div>

    <th:block th:if="${dlg.canPurge}">
      <p class="u-secondary u-text-sm">
        Version <span th:text="${dlg.version}">2</span> is deleted permanently — this cannot be undone.
        <span th:if="${dlg.takesEntity}" data-purge-takes-entity>It is the only version: the visualization goes with it.</span>
      </p>
      <form th:attr="hx-post=@{'/partials/visualizations/{id}/lifecycle/purge-version'(id=${dlg.id}, version=${dlg.version})},
                     hx-swap='none'">
        <input type="hidden" name="from" th:value="${from}">
        <label class="ds-form-label u-mt-md" for="viz-purge-version-confirm">
          Type <span class="u-mono" th:text="${dlg.expected}">v2</span> to confirm
        </label>
        <input class="ds-input u-mono" id="viz-purge-version-confirm" data-confirm-input name="confirm" autocomplete="off"
               spellcheck="false" th:attr="data-confirm-expect=${dlg.expected}">
        <button th:if="${canAuthor == true}" type="submit" data-verb="visualization-purge-version-confirm"
                class="ds-button ds-button-danger u-full u-mt-md" data-typed-confirm
                disabled hx-disabled-elt="this"
                th:text="'Purge v' + ${dlg.version}">Purge v2</button>
      </form>
    </th:block>
  </div>
</div>
