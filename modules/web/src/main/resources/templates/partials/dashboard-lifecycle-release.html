<!-- The Release dialog for a dashboard (#400): the draft facts around the SHARED release plan (#876 §F.2–F.3,
     partials/release-dialog.html :: plan). The plan replaced the D61 consent group and the §3.2 pin pre-read:
     every dependency below the dashboard — its source pipelines, its parameter set, its visualizations and what
     they pin — is a plan row; each DRAFT one is a checked box posting its node_id as include_dependencies, beside
     the plan's tree_hash; MISSING or DISCARDED rows and unavailable datasources render blocking and the submit
     stays disabled. The POST re-plans and re-checks everything under the guard regardless. -->
<div xmlns:th="http://www.thymeleaf.org" class="u-backdrop" data-lifecycle-dialog="dashboard-release">
  <div class="ds-card app-modal app-modal-md dp-release" role="dialog" aria-modal="true" aria-labelledby="dp-release-title">
    <button type="button" class="ds-button ds-button-ghost ds-button-sm app-modal-close u-text-xl"
            aria-label="Close" data-lifecycle-close>
      <svg class="ds-icon ds-icon-sm" aria-hidden="true" focusable="false"><use href="/vendor/icons/lucide-sprite.svg#x"></use></svg>
    </button>
    <h2 class="ds-title u-m0 u-mb-md" id="dp-release-title"
        th:text="'Release v' + ${dlg.version} + '?'">Release v2?</h2>

    <th:block th:if="${dlg.refusal != null}">
      <p class="u-secondary u-text-sm" th:text="${dlg.refusal.message}">No draft.</p>
    </th:block>

    <th:block th:if="${dlg.refusal == null}">
      <p class="u-secondary u-text-sm">
        Last written <span th:title="${#temporals.format(dlg.updatedAt, 'yyyy-MM-dd HH:mm')}" th:text="${dlg.updatedAgo}">2 hours ago</span>
        by <span th:text="${dlg.updatedBy}">Muhammad</span>.
      </p>

      <form th:attr="hx-post=@{'/partials/dashboards/{id}/lifecycle/release'(id=${dlg.id})},
                     hx-swap='none'">
        <!-- #416: the hash of the draft THIS dialog read; the POST releases AT it. A draft changed
             after the dialog opened is refused: the plan's tree_hash answers dashboard.release.plan_conflict
             first, and a current plan with a stale bodyHash still answers dashboard.version.conflict. -->
        <input type="hidden" name="bodyHash" th:value="${dlg.bodyHash}" data-release-body-hash>

        <div th:replace="~{partials/release-dialog :: plan(${rd})}"></div>

        <p class="u-secondary u-text-sm u-mb-md">
          Releasing makes v<span th:text="${dlg.version}">2</span> the served version and locks it.
        </p>

        <button th:if="${canAuthor == true}" type="submit" data-verb="dashboard-release-confirm" data-consent-submit
                class="ds-button ds-button-primary u-full" hx-disabled-elt="this"
                th:attr="disabled=${!rd.submittable} ? 'disabled' : null"
                th:text="'Release v' + ${dlg.version}">Release v2</button>
      </form>
    </th:block>
  </div>
</div>
