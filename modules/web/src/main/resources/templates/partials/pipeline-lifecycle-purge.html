<!-- The Purge dialog (ui-screens §4.3d, 102) — THE irreversible one. The row and its
     executions are deleted (versioning §5.4); a sole draft takes the pipeline with it. The
     button needs the typed confirm `v<n>` (§5.1's convention, the second use after --clean):
     disabled client-side until the field matches, refused server-side as
     pipeline.version.confirm_mismatch before the service runs. -->
<div xmlns:th="http://www.thymeleaf.org" class="u-backdrop" data-lifecycle-dialog="pipeline-purge">
  <div class="ds-card app-modal app-modal-md" role="dialog" aria-modal="true" aria-labelledby="plc-purge-title">
    <button type="button" class="ds-button ds-button-ghost ds-button-sm app-modal-close u-text-xl"
            aria-label="Close" data-lifecycle-close>
      <svg class="ds-icon ds-icon-sm" aria-hidden="true" focusable="false"><use href="/vendor/icons/lucide-sprite.svg#x"></use></svg>
    </button>
    <h2 class="ds-title u-m0 u-mb-md" id="plc-purge-title"
        th:text="'Purge v' + ${dlg.version} + '?'">Purge v4?</h2>

    <p class="u-secondary u-text-sm">
      The draft row and its
      <strong th:text="${dlg.runCount}">3</strong> run<span th:if="${dlg.runCount != 1}">s</span>
      are deleted permanently — this cannot be undone, and a sole draft takes the pipeline with it.
    </p>

    <form th:attr="hx-post=@{'/partials/pipelines/{id}/lifecycle/purge'(id=${dlg.id}, version=${dlg.version})},
                     hx-target=${from == 'editor'} ? null : '#pipeline-detail',
                     hx-swap=${from == 'editor'} ? 'none' : 'innerHTML'">
      <input type="hidden" name="from" th:value="${from}">
      <label class="ds-form-label u-mt-md" th:for="'plc-purge-confirm'">
        Type <span class="u-mono" th:text="${dlg.expected}">v4</span> to confirm
      </label>
      <input class="ds-input u-mono" id="plc-purge-confirm" data-confirm-input name="confirm" autocomplete="off"
             spellcheck="false" th:attr="data-confirm-expect=${dlg.expected}">
      <button type="submit" data-verb="pipeline-purge-confirm" class="ds-button ds-button-danger u-full u-mt-md" data-typed-confirm
              disabled hx-disabled-elt="this"
              th:text="'Purge v' + ${dlg.version} + (${dlg.runCount > 0} ? ' and ' + ${dlg.runCount} + ' run' + (${dlg.runCount != 1} ? 's' : '') : '')">
        Purge v4 and 3 runs
      </button>
    </form>
  </div>
</div>
