<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: page(~{::content})}">
<th:block th:fragment="content">

  <link th:href="@{/css/pipeline-editor.css}" rel="stylesheet">

  <script th:src="@{/vendor/alpinejs/alpine.min.js}" defer></script>
  <script th:src="@{/vendor/dagre/dagre.min.js}"></script>
  <script th:src="@{/vendor/cytoscape/cytoscape.min.js}"></script>
  <script th:src="@{/vendor/cytoscape/cytoscape-dagre.js}"></script>
  <!-- 059 §reference route 1: HTML cards overlaid on the Cytoscape nodes. Its label
       container is pointer-events:none and carries the pan/zoom transform, so the
       cards scale WITH the canvas and the canvas keeps every interaction (031's
       selection/state/a11y machinery is untouched). -->
  <script th:src="@{/vendor/cytoscape/cytoscape-node-html-label.js}"></script>

  <script type="application/json" id="pipeline-data" th:utext="${pipelineJson}"></script>
  <!-- The draft lifecycle state the editor is showing (versioning §3.5/§7): draft.js reads
       it to render the pending-release affordances and to pin Execute to the draft version. -->
  <script type="application/json" id="pipeline-lifecycle" th:utext="${lifecycleJson}"></script>

  <script th:src="@{/js/pipeline-editor/init.js}"></script>
  <script th:src="@{/js/pipeline-editor/sql-highlight.js}"></script>
  <script th:src="@{/js/pipeline-editor/graph.js}"></script>
  <script th:src="@{/js/pipeline-editor/sse.js}"></script>
  <script th:src="@{/js/pipeline-editor/execute.js}"></script>
  <script th:src="@{/js/pipeline-editor/draft.js}"></script>
  <script th:src="@{/js/pipeline-editor/details.js}"></script>
  <script th:src="@{/js/pipeline-editor/error.js}"></script>
  <script th:src="@{/js/pipeline-editor/result.js}"></script>
  <script th:src="@{/js/pipeline-editor/a11y.js}"></script>

  <div x-data="pipelineEditor()" x-init="init()" class="pe-root">

    <!-- Top toolbar -->
    <div class="pe-toolbar" role="toolbar" aria-label="Pipeline editor controls">
      <a th:href="@{/pipelines}" class="ds-button ds-button-ghost ds-button-sm">&larr; Back</a>
      <h1 class="pe-pipeline-title" x-text="pipeline.display_name || pipeline.name"></h1>
      <div class="pe-toolbar-actions">
        <!-- versioning §3.5/§7: the pending-release affordance. Shown only while a draft
             exists — Execute targets the draft, and Release is the human action that
             moves the list to the draft's name (agents never release, D4). -->
        <span th:if="${hasDraft}" class="ds-badge ds-badge-warning"
              th:text="'Draft v' + ${draftVersion} + ' — pending release'"
              title="The list still shows the released version; release to publish this draft."></span>
        <button th:if="${hasDraft}" class="ds-button ds-button-primary ds-button-sm"
                id="pe-release-draft" th:attr="data-id=${pipelineId}, data-hash=${draftHash}">
          Release v<span th:text="${draftVersion}"></span>
        </button>
        <button th:if="${hasDraft}" class="ds-button ds-button-secondary ds-button-sm"
                id="pe-discard-draft" th:attr="data-id=${pipelineId}, data-hash=${draftHash}">
          Discard draft
        </button>
        <button class="ds-button ds-button-primary" x-bind:disabled="isExecuting" @click="executePipeline()">
          <span x-show="!isExecuting">Execute</span>
          <span x-show="isExecuting">Running...</span>
        </button>
        <button x-show="isExecuting" class="ds-button ds-button-danger ds-button-sm" @click="cancelExecution()">
          Cancel
        </button>
      </div>
    </div>

    <!-- Execution status banner -->
    <div x-show="banner.text" class="pe-banner" x-bind:class="banner.type" role="alert">
      <span x-text="banner.text"></span>
      <button class="pe-banner-dismiss" @click="banner.text = ''" aria-label="Dismiss">&times;</button>
    </div>

    <div class="pe-layout">
      <!-- Left sidebar: Settings + Parameters -->
      <aside class="pe-sidebar" aria-label="Pipeline settings">
        <div class="pe-sidebar-section">
          <h2 class="pe-sidebar-heading">Settings</h2>
          <div class="pe-field">
            <label class="pe-label">Name</label>
            <div class="pe-value" x-text="pipeline.name"></div>
          </div>
          <div class="pe-field">
            <label class="pe-label">Display Name</label>
            <div class="pe-value" x-text="pipeline.display_name"></div>
          </div>
          <div class="pe-field">
            <label class="pe-label">Description</label>
            <div class="pe-value" x-text="pipeline.description || '—'"></div>
          </div>
          <div class="pe-field">
            <label class="pe-label">Version</label>
            <div class="pe-value" x-text="pipeline.version"></div>
          </div>
          <template x-if="pipeline.settings && pipeline.settings.tempdb && pipeline.settings.tempdb.engine !== 'H2'">
            <div class="pe-field">
              <label class="pe-label">Staging Engine</label>
              <div class="pe-value" x-text="pipeline.settings.tempdb.engine"></div>
            </div>
          </template>
        </div>

        <div class="pe-sidebar-section" x-show="paramKeys.length">
          <h2 class="pe-sidebar-heading">Parameters</h2>
          <template x-for="key in paramKeys" :key="key">
            <div class="pe-field">
              <label class="pe-label" x-text="key"></label>
              <template x-if="parameterOverrides[key] !== undefined">
                <input type="text" class="pe-input" x-model="parameterOverrides[key]"
                  @input="onParameterInput()"
                  x-bind:placeholder="parameters[key].default ? 'Default: ' + JSON.stringify(parameters[key].default) : (parameters[key].required ? 'Required' : 'Optional')" />
              </template>
              <template x-if="parameterOverrides[key] === undefined">
                <div class="pe-value pe-value-muted" x-text="parameters[key]?.description || '—'"></div>
              </template>
              <span class="pe-type-badge" x-text="parameters[key]?.type"></span>
            </div>
          </template>
        </div>
      </aside>

      <!-- Center: Cytoscape graph -->
      <section class="pe-main" aria-label="Pipeline graph">
        <div class="pe-canvas-container" id="cy-container">
          <div id="cy-canvas" role="img" aria-label="Pipeline DAG visualization"></div>
        </div>

        <!-- View controls (059 §B): fit with a readable floor, reset, zoom in/out.
             Native buttons — keyboard reachable by tab, no shortcut layer to own. -->
        <div class="pe-graph-controls" role="toolbar" aria-label="Graph view controls">
          <button type="button" class="ds-button ds-button-ghost ds-button-sm"
                  @click="graph && graph.fitToView()" title="Fit graph to view" aria-label="Fit graph to view">
            <svg class="ds-icon ds-icon-sm" aria-hidden="true" focusable="false"><use href="/vendor/icons/lucide-sprite.svg#maximize"></use></svg>
          </button>
          <button type="button" class="ds-button ds-button-ghost ds-button-sm"
                  @click="graph && graph.resetView()" title="Reset zoom (100%)" aria-label="Reset zoom to 100 percent">
            <svg class="ds-icon ds-icon-sm" aria-hidden="true" focusable="false"><use href="/vendor/icons/lucide-sprite.svg#rotate-ccw"></use></svg>
          </button>
          <button type="button" class="ds-button ds-button-ghost ds-button-sm"
                  @click="graph && graph.zoomBy(1.25)" title="Zoom in" aria-label="Zoom in">
            <svg class="ds-icon ds-icon-sm" aria-hidden="true" focusable="false"><use href="/vendor/icons/lucide-sprite.svg#zoom-in"></use></svg>
          </button>
          <button type="button" class="ds-button ds-button-ghost ds-button-sm"
                  @click="graph && graph.zoomBy(0.8)" title="Zoom out" aria-label="Zoom out">
            <svg class="ds-icon ds-icon-sm" aria-hidden="true" focusable="false"><use href="/vendor/icons/lucide-sprite.svg#zoom-out"></use></svg>
          </button>
        </div>

        <!-- Accessible node list -->
        <ul id="pe-node-list" role="listbox" class="pe-node-list" aria-label="Pipeline nodes" tabindex="0"></ul>
        <div id="pe-live-region" class="sr-only" aria-live="polite" role="status"></div>
      </section>

      <!-- Right sidebar: Node details -->
      <aside class="pe-details-panel" x-bind:class="{ 'pe-details-visible': selectedNode }" aria-label="Node details">
        <template x-if="!selectedNode">
          <div class="pe-details-body">
            <div class="ds-empty">
              <p class="ds-empty-title">Select a node</p>
              <p class="ds-empty-description">Click a node in the graph to see its details and rendered SQL.</p>
            </div>
          </div>
        </template>
        <template x-if="selectedNode">
          <div>
            <div class="pe-details-header">
              <h2 class="pe-details-title" x-text="selectedNode.id"></h2>
              <button class="pe-details-close" @click="selectedNode = null" aria-label="Close details">&times;</button>
            </div>
            <div class="pe-details-body">
              <!-- Identity -->
              <div class="pe-details-section">
                <h3 class="pe-details-heading">Identity</h3>
                <div class="pe-field">
                  <label class="pe-label">Type</label>
                  <div class="pe-value"><span class="ds-badge ds-badge-default" x-text="selectedNode.type"></span></div>
                </div>
                <div class="pe-field">
                  <label class="pe-label">Description</label>
                  <div class="pe-value" x-text="selectedNode.description || '—'" x-bind:title="selectedNode.description || ''"></div>
                </div>
                <template x-if="selectedNode.type === 'PIPELINE' && selectedNode.pipeline">
                  <div class="pe-field">
                    <label class="pe-label">Child Pipeline</label>
                    <div class="pe-value">
                      <a class="pe-link"
                         x-bind:href="'/pipelines?q=' + encodeURIComponent(selectedNode.pipeline.name)"
                         x-text="selectedNode.pipeline.name + ' @ v' + selectedNode.pipeline.version"></a>
                    </div>
                  </div>
                </template>
              </div>

              <!-- SQL — the node's rendered SQL, resolved server-side from its PINNED
                   template (contract §2.3: SQL lives in template entities, not nodes) -->
              <div class="pe-details-section">
                <h3 class="pe-details-heading">SQL
                  <span id="pe-node-sql-spinner" class="htmx-indicator ds-spinner" aria-hidden="true"></span>
                </h3>
                <!-- Filled by htmx.ajax on selection change; the URL carries §6.3 wire
                     parameters built by the page's own coerceValue (init.js). -->
                <div id="pe-node-sql"></div>
              </div>

              <!-- Configuration -->
              <div class="pe-details-section">
                <h3 class="pe-details-heading">Configuration</h3>
                <div class="pe-field">
                  <label class="pe-label">Source</label>
                  <div class="pe-value" x-text="selectedNode.source || '—'" x-bind:title="selectedNode.source || ''"></div>
                </div>
                <div class="pe-field" x-show="selectedNode.type !== 'PIPELINE'">
                  <label class="pe-label">Template</label>
                  <!-- §9.4: a template name is a PATH now. `acme/finance/monthly_revenue @ v3`
                       in a 320px inspector truncates to one line, and the full reference rides
                       on `title` so the truncated text is never the only copy of it. -->
                  <div class="pe-value">
                    <a class="pe-link pe-path"
                       x-bind:href="'/templates/editor?name=' + encodeURIComponent(selectedNode.template?.id || '')"
                       x-bind:title="templateRefText(selectedNode)"
                       x-text="templateRefText(selectedNode)"></a>
                  </div>
                </div>
                <div class="pe-field">
                  <label class="pe-label">Output</label>
                  <div class="pe-value" x-text="outputText(selectedNode)" x-bind:title="outputText(selectedNode)"></div>
                </div>
                <template x-if="selectedNode.depends_on && selectedNode.depends_on.length">
                  <div class="pe-field">
                    <label class="pe-label">Depends On</label>
                    <ul class="pe-depends-list">
                      <template x-for="dep in selectedNode.depends_on">
                        <li x-text="dep" class="pe-depends-item"></li>
                      </template>
                    </ul>
                  </div>
                </template>
              </div>

              <!-- Runtime -->
              <div class="pe-details-section" x-show="nodeStates[selectedNode.id]">
                <h3 class="pe-details-heading">Runtime</h3>
                <div class="pe-field">
                  <label class="pe-label">Status</label>
                  <div class="pe-value">
                    <span class="ds-badge" x-bind:class="statusBadgeClass(nodeStates[selectedNode.id])" x-text="nodeStates[selectedNode.id]"></span>
                  </div>
                </div>
              </div>

              <!-- 057/T85: the failure record for THIS node — code, message, correlation id,
                   node context, the rendered SQL and the exception chain (root cause first),
                   straight from the node_failed payload. Absent sections stay absent: under
                   error-detail=structured there is no SQL and no exception, and no apology. -->
              <div class="pe-details-section pe-node-failure" x-show="nodeStates[selectedNode.id] === 'failed' && nodeErrors[selectedNode.id]">
                <template x-if="nodeErrors[selectedNode.id]">
                  <div x-data="{ view: failureView(nodeErrors[selectedNode.id]) }">
                    <h3 class="pe-details-heading">Failure</h3>
                    <div class="pe-field">
                      <label class="pe-label">Code</label>
                      <div class="pe-value"><code class="pe-error-code" x-text="view.code"></code></div>
                    </div>
                    <div class="pe-field">
                      <label class="pe-label">Message</label>
                      <div class="pe-value" x-text="view.message"></div>
                    </div>
                    <div class="pe-field" x-show="view.nodeLine">
                      <label class="pe-label">Node</label>
                      <div class="pe-value" x-text="view.nodeLine" x-bind:title="view.nodeLine"></div>
                    </div>
                    <div class="pe-field" x-show="view.correlationId">
                      <label class="pe-label">Correlation ID</label>
                      <div class="pe-value"><code class="pe-error-corr" x-text="view.correlationId"></code></div>
                    </div>
                    <template x-if="view.detailsText">
                      <div class="pe-field">
                        <label class="pe-label">Details</label>
                        <pre class="pe-error-details-json" x-text="view.detailsText"></pre>
                      </div>
                    </template>
                    <template x-if="view.sql">
                      <div class="pe-field">
                        <label class="pe-label">SQL</label>
                        <div class="pe-sql-block">
                          <pre class="pe-sql"><code class="pe-sql-code" x-text="view.sql"></code></pre>
                        </div>
                      </div>
                    </template>
                    <template x-if="view.chain">
                      <details class="pe-error-exception">
                        <summary>Exception <span class="pe-error-root" x-text="'· root: ' + view.rootCause"></span></summary>
                        <template x-for="(level, idx) in view.chain" :key="idx">
                          <div class="pe-error-level">
                            <div class="pe-error-level-title" x-text="(idx === 0 ? 'Root cause: ' : 'Caused by: ') + level.cls"></div>
                            <div class="pe-error-level-message" x-text="level.message"></div>
                            <pre class="pe-error-frames" x-text="level.frames.join('\n')"></pre>
                          </div>
                        </template>
                      </details>
                    </template>
                    <button type="button" class="ds-button ds-button-ghost ds-button-sm pe-copy"
                            x-bind:data-copy="view.copyText" data-copy-label="Failure detail">
                      Copy failure detail
                    </button>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>
      </aside>
    </div>

    <!-- Result panel -->
    <div x-show="resultPanel.visible" class="pe-result-panel" role="region" aria-label="Execution results">
      <div class="pe-result-header">
        <h2>Results</h2>
        <button class="pe-details-close" @click="resultPanel.visible = false" aria-label="Close results">&times;</button>
      </div>

      <!-- 057/T85: the execution-level failure record — the same rendering the node inspector
           gets, in the place the engineer is already looking when the run ends. -->
      <template x-if="resultPanel.failure">
        <div class="pe-result-failure" x-data="{ view: failureView(resultPanel.failure) }">
          <div class="pe-failure-summary">
            <span class="ds-badge ds-badge-danger" x-text="view.code"></span>
            <span class="pe-failure-message" x-text="view.message"></span>
          </div>
          <div class="pe-failure-meta">
            <span x-show="view.correlationId">correlation id <code class="pe-error-corr" x-text="view.correlationId"></code></span>
            <span x-show="view.nodeLine" x-text="view.nodeLine"></span>
          </div>
          <template x-if="view.sql">
            <div class="pe-field">
              <label class="pe-label">SQL</label>
              <div class="pe-sql-block">
                <pre class="pe-sql"><code class="pe-sql-code" x-text="view.sql"></code></pre>
              </div>
            </div>
          </template>
          <template x-if="view.chain">
            <details class="pe-error-exception" open>
              <summary>Exception <span class="pe-error-root" x-text="'· root: ' + view.rootCause"></span></summary>
              <template x-for="(level, idx) in view.chain" :key="idx">
                <div class="pe-error-level">
                  <div class="pe-error-level-title" x-text="(idx === 0 ? 'Root cause: ' : 'Caused by: ') + level.cls"></div>
                  <div class="pe-error-level-message" x-text="level.message"></div>
                  <pre class="pe-error-frames" x-text="level.frames.join('\n')"></pre>
                </div>
              </template>
            </details>
          </template>
          <button type="button" class="ds-button ds-button-ghost ds-button-sm pe-copy"
                  x-bind:data-copy="view.copyText" data-copy-label="Failure detail">
            Copy failure detail
          </button>
        </div>
      </template>

      <div x-show="resultPanel.ttlSeconds > 0 && !resultPanel.failure" class="pe-result-ttl" x-text="'Expires in ' + resultPanel.ttlSeconds + 's'"></div>
      <div x-show="resultPanel.expired && !resultPanel.failure" class="pe-result-expired-card">
        <p>Result expired — re-run the pipeline to see the latest data.</p>
      </div>
      <div x-show="!resultPanel.expired && resultPanel.data && !resultPanel.failure">
        <div class="pe-result-table-container">
          <table class="ds-table">
            <thead>
              <tr>
                <template x-for="col in resultPanel.columns" :key="col">
                  <th x-text="col"></th>
                </template>
              </tr>
            </thead>
            <tbody>
              <template x-for="row in resultPanel.rows" :key="row.__idx">
                <tr>
                  <template x-for="col in resultPanel.columns" :key="col">
                    <td x-text="row[col]"></td>
                  </template>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <div class="pe-result-actions">
          <!-- Client-side cursor paging over a stored result (027b C, frozen):
               prevPage/nextPage and hasPrev/hasNext keep their exact bindings;
               limit-authoritative, total_rows-denominated arithmetic lives in
               result.js. This row is restyled, not rewired. -->
          <button class="ds-button ds-button-ghost ds-button-sm" @click="resultPanel.prevPage()" x-bind:disabled="!resultPanel.hasPrev">Prev</button>
          <span class="pe-result-page-info" x-text="'Page ' + resultPanel.page + ' / ' + resultPanel.totalPages"></span>
          <button class="ds-button ds-button-ghost ds-button-sm" @click="resultPanel.nextPage()" x-bind:disabled="!resultPanel.hasNext">Next</button>
          <div class="pe-result-downloads">
            <a class="ds-button ds-button-ghost ds-button-sm" x-bind:href="resultPanel.downloadUrl('json')">JSON</a>
            <a class="ds-button ds-button-ghost ds-button-sm" x-bind:href="resultPanel.downloadUrl('csv')">CSV</a>
            <a class="ds-button ds-button-ghost ds-button-sm" x-bind:href="resultPanel.downloadUrl('arrow')">Arrow</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Error modal -->
    <div x-show="errorModal.visible" class="pe-modal-backdrop" @click.self="errorModal.hide()">
      <div class="pe-modal" role="alertdialog" aria-label="Execution error">
        <div class="pe-modal-header">
          <h2>Execution Failed</h2>
          <button @click="errorModal.hide()" aria-label="Close">&times;</button>
        </div>
        <div class="pe-modal-body">
          <p x-text="errorModal.message"></p>
        </div>
        <div class="pe-modal-footer">
          <button class="ds-button ds-button-ghost" @click="errorModal.hide()">Dismiss</button>
        </div>
      </div>
    </div>
  </div>

</th:block>
</html>
