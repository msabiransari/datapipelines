<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: page(~{::content})}">
<th:block th:fragment="content">
  <!-- #350 — the pipelines CATALOG (ui-screens.md §4.3). The folder tree lives in the resource
       browser's Pipelines panel (#554); a leaf there opens the pipeline's workspace. What stays
       here is the catalog landing the spec retains (§3.2): one flat,
       server-paged list of full paths — every pipeline the caller may read, or the matches of
       the search — each row a link into /pipelines/{id} (owner ruling 2026-10-02). There is no
       second tree and no detail pane: the workspace is the one place a pipeline is read,
       run and managed. `?q=` stays the deep link every "find this pipeline" link uses. -->
  <div class="app-page-h">
    <div>
      <h1 class="ds-headline">Pipelines</h1>
      <!-- T108: this says what is true today and where authoring actually happens. -->
      <p class="app-page-sub">
        Pipelines are authored through agents over the
        <a th:href="@{/docs/mcp-server}">MCP server</a> — ask your agent to create one, giving it
        a folder path like <code>nyc/mobility/revenue_by_borough</code>. Browse the folders in the
        resource browser's Pipelines tree, or search the whole catalog here; a pipeline opens in
        its workspace.
      </p>
    </div>
    <div class="app-page-actions">
      <!-- The resource browser's other door (js/tree/sidebar.mjs, #554): shows the browser —
           the phone drawer, or lifts a desktop Hide — and puts focus in its Pipelines
           search. It replaces 106 §B's Browse button, which opened the explorer's own tree drawer. -->
      <button type="button" class="ds-button ds-button-secondary"
              data-nav-tree-reveal="pipelines" aria-controls="nav-tree-pipelines">Browse folders</button>
    </div>
  </div>

  <!-- SPA search control (ui-screens.md §4.3, the 028 §4.5 contract): it re-fetches ONLY the
       list fragment into the stable #pipeline-list-wrapper root, so the control is never
       re-rendered and the search keeps focus and value. #556: the lifecycle select is the
       overview's drill-down (`?lifecycle=`, the inventory's buckets); each control carries the
       other, as the templates catalog's dialect and type do. -->
  <!-- #591: every swap answers HX-Replace-Url (web CatalogUrl), so the address bar describes the
       list. hx-history="false" keeps the catalog out of htmx's history cache: a snapshot holds
       the controls' rendered attributes, not their live values, so Back would restore the list
       under a stale search and select; Back fetches the page at its URL instead (ui-screens §5). -->
  <div class="u-row-md app-catalog-search" hx-history="false">
    <input type="search" id="pipeline-filter-q" name="q" th:value="${q}"
           placeholder="Search pipelines..." aria-label="Search pipelines"
           th:attr="hx-get=@{/partials/pipelines}, hx-target='#pipeline-list-wrapper', hx-swap='outerHTML'"
           hx-trigger="input changed delay:300ms, search"
           hx-include="#pipeline-filter-lifecycle"
           hx-sync="this:replace"
           hx-indicator="#pipeline-filter-spinner"
           class="ds-input app-search-input">
    <select id="pipeline-filter-lifecycle" name="lifecycle" class="ds-input app-select-auto"
            aria-label="Filter by lifecycle"
            th:attr="hx-get=@{/partials/pipelines}, hx-target='#pipeline-list-wrapper', hx-swap='outerHTML'"
            hx-trigger="change"
            hx-include="#pipeline-filter-q"
            hx-indicator="#pipeline-filter-spinner">
      <option value="" th:selected="${#strings.isEmpty(lifecycle)}">All lifecycles</option>
      <option th:each="o : ${lifecycleOptions}" th:value="${o.value}" th:text="${o.label}"
              th:selected="${o.value == lifecycle}">Draft only</option>
    </select>
    <span id="pipeline-filter-spinner" class="htmx-indicator ds-spinner" aria-hidden="true"></span>
  </div>

  <div class="app-catalog-list">
    <!-- The fragment's own root carries id="pipeline-list-wrapper", so the swap target
         survives every refresh — this div is only a placeholder. -->
    <div th:replace="~{partials/pipelines :: fragment}"></div>
  </div>
</th:block>
</html>
