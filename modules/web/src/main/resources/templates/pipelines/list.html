<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: page(~{::content})}">
<th:block th:fragment="content">
  <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--gap-lg);">
    <h1 style="font-size: var(--text-2xl); font-weight: var(--weight-bold);">Pipelines</h1>
    <th:block th:if="${#sets.contains(scopes, 'AUTHOR') or #sets.contains(scopes, 'ADMIN')}">
      <button class="ds-button ds-button-primary" disabled
              style="opacity: 0.6;" th:title="${'Pipeline editor — Phase 2 other worktree'}">Create Pipeline</button>
    </th:block>
  </div>

  <div style="margin-bottom: var(--gap-md); display: flex; gap: var(--gap-md); align-items: center;">
    <input type="search" name="q" th:value="${q}"
           placeholder="Search pipelines..."
           style="flex: 1; padding: var(--gap-sm) var(--gap-md); border: 1px solid var(--border-default); border-radius: var(--radius-base); background: var(--surface-raised); color: var(--text-primary); font-size: var(--text-sm); max-width: 360px;">
    <select name="datasource" style="padding: var(--gap-sm) var(--gap-md); border: 1px solid var(--border-default); border-radius: var(--radius-base); background: var(--surface-raised); color: var(--text-primary); font-size: var(--text-sm);">
      <option value="">All Datasources</option>
      <option th:each="d : ${dialects}" th:value="${d}" th:text="${d}"></option>
    </select>
  </div>

  <div id="pipeline-list-wrapper"
       th:replace="~{partials/pipelines :: fragment}">
  </div>
</th:block>
</html>
