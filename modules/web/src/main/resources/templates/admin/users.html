<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: page(~{::content})}">
<th:block th:fragment="content">
  <h1 class="ds-headline u-m0 u-mb-lg">User Management</h1>

  <!-- Out-of-band target for one-time password notices (create / reset). -->
  <div id="admin-notice"></div>

  <form th:if="${localEnabled}" method="post"
        hx-post="/partials/admin/users"
        hx-target="#user-table-body"
        hx-swap="afterbegin"
        class="u-row u-mb-md">
    <input type="email" name="email" class="ds-input app-input-inline" placeholder="new-user@example.com" required>
    <input type="text" name="displayName" class="ds-input app-input-inline" placeholder="Display name (optional)">
    <button type="submit" class="ds-button ds-button-primary ds-button-sm">Create local user</button>
    <span class="u-secondary u-text-xs">Creates a local account with a one-time password, shown once (auth.md §5A.1)</span>
  </form>

  <div class="u-row u-mb-md">
    <input type="text" id="userSearch" class="ds-input app-input-inline-lg" placeholder="Search by email or name"
           hx-get="/partials/admin/users"
           hx-trigger="keyup changed delay:300ms"
           hx-target="#user-table-body"
           hx-swap="innerHTML"
           name="q">
    <span class="htmx-indicator ds-spinner" aria-hidden="true"></span>
  </div>

  <!-- .ds-table supplies its own box (app.css) — the old .ds-card wrapper double-framed it. -->
  <table class="ds-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Status</th>
        <th>Role</th>
        <th>Local</th>
        <th class="num">Actions</th>
      </tr>
    </thead>
    <tbody id="user-table-body">
      <!-- The load placeholder is what the dashboard skeletons made the house idiom
           (025 B2): real shimmer rows, not a "Loading..." caption. Replaced whole by the
           htmx.ajax load below. -->
      <tr><td colspan="7" class="u-p0"><div class="ds-skeleton ds-skeleton-table-row"></div></td></tr>
      <tr><td colspan="7" class="u-p0"><div class="ds-skeleton ds-skeleton-table-row"></div></td></tr>
      <tr><td colspan="7" class="u-p0"><div class="ds-skeleton ds-skeleton-table-row"></div></td></tr>
    </tbody>
  </table>

  <script>
    // 076 §B: run immediately when this fragment arrives in a boosted swap
    // (DOMContentLoaded has long fired); arm the listener only on a cold parse.
    var loadUsers = function() {
      htmx.ajax('GET', '/partials/admin/users?offset=0&limit=20', {target: '#user-table-body', swap: 'innerHTML'});
    };
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadUsers);
    } else {
      loadUsers();
    }
  </script>
</th:block>
</html>
