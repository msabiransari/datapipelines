<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: page(~{::content})}">
<th:block th:fragment="content">
  <div class="app-page-h">
    <div>
      <h1 class="ds-headline u-m0">Users</h1>
      <p class="app-page-sub">Every user across every workspace. Admin-ness is not a scope — it is this list.</p>
    </div>
  </div>

  <!-- Out-of-band target for one-time password notices (create / reset). -->
  <div id="admin-notice"></div>

  <form th:if="${localEnabled}" method="post"
        hx-post="/partials/admin/users"
        hx-target="#user-table-body"
        hx-swap="afterbegin"
        class="u-row u-mb-md">
    <input type="email" name="email" class="ds-input app-input-inline" placeholder="new-user@example.com" required>
    <input type="text" name="displayName" class="ds-input app-input-inline" placeholder="Display name (optional)">
    <input type="text" name="workspace" class="ds-input app-input-inline" placeholder="Workspace (optional)"
           title="Also add the new user to this workspace — leave blank to add them later">
    <label class="u-text-xs" title="Author can create and edit"><input type="checkbox" name="author" value="true"> author</label>
    <label class="u-text-xs" title="Promoter can release and promote"><input type="checkbox" name="promoter" value="true"> promoter</label>
    <label class="u-text-xs" title="Workspace admin manages members"><input type="checkbox" name="admin" value="true"> admin</label>
    <button type="submit" class="ds-button ds-button-primary ds-button-sm">Create local user</button>
    <span class="u-secondary u-text-xs">Creates a local account with a one-time password, shown once (auth.md §5A.1); the workspace + flags are applied at once (auth.md §4.6)</span>
  </form>

  <div class="u-row u-mb-md">
    <input type="text" id="userSearch" class="ds-input app-input-inline-lg" placeholder="Search by email or name"
           hx-get="/partials/admin/users"
           hx-trigger="keyup changed delay:300ms"
           hx-target="#user-table-body"
           hx-swap="innerHTML"
           name="q">
    <span class="htmx-indicator ds-spinner" aria-hidden="true"></span>
  </div>

  <!-- .ds-table supplies its own box (app.css) — the old .ds-card wrapper double-framed it. -->
  <table class="ds-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Status</th>
        <th>Role</th>
        <th>Local</th>
        <th class="num">Actions</th>
      </tr>
    </thead>
    <!-- §5 (097 §B): the shell AND the initial fragment, from AdminUsersBrowseModel — the
         same rows the search box swaps in. This used to be three skeleton rows plus an inline
         script that fetched them, which made the screen's first paint a second round trip. -->
    <tbody id="user-table-body">
      <th:block th:replace="~{partials/admin-users-rows :: rows}"></th:block>
    </tbody>
  </table>

</th:block>
</html>
