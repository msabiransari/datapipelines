<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:fragment="page(content)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link th:href="@{/vendor/design-system/tokens.css}" rel="stylesheet">
  <link th:id="theme-link"
        th:href="@{/vendor/design-system/themes/{theme}.css(theme=${activeTheme})}"
        rel="stylesheet">
  <link th:href="@{/vendor/design-system/base.css}" rel="stylesheet">
  <link th:href="@{/vendor/design-system/motion.css}" rel="stylesheet">
  <link th:href="@{/vendor/design-system/primitives.css}" rel="stylesheet">

  <!-- Bootstrap AFTER the design system, BEFORE app.css (§3.4 load order): its reboot
       must not be the last word — it paints <body> Bootstrap-white for every theme,
       masking the theme's --surface-page canvas (app.css re-asserts the tokens). -->
  <link rel="stylesheet"
        th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"
        media="screen">
  <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body
    th:attr="hx-headers='{&quot;DP-CSRF-Token&quot;:&quot;' + ${_csrf?.token} + '&quot;' + ${workspaceHeaderFragment} + '}'">
  <!-- No hx-target-error here: the response-targets extension is NOT loaded, so the
       attribute was dead config. Refusals that should toast use Shape C (§5.1) —
       HX-Retarget/HX-Reswap response headers admitted by toast.js's bridgeErrors. -->
  <nav class="app-nav">
    <div class="app-container app-nav-inner">
      <div class="app-nav-left">
        <a class="app-brand" th:href="@{/}">datapipelines</a>
        <form th:if="${activeWorkspace} != null" th:action="@{/workspace/switch}" method="post"
              class="app-workspace-form">
          <label for="workspace-switcher" class="app-workspace-label">workspace</label>
          <select id="workspace-switcher" name="name" onchange="this.form.submit()"
                  class="app-workspace-select">
            <option th:each="membership : ${workspaceOptions}"
                    th:value="${membership.workspaceName}"
                    th:text="${membership.workspaceName}"
                    th:selected="${membership.workspaceName == activeWorkspace}">workspace</option>
          </select>
          <noscript><button type="submit" class="ds-button ds-button-ghost ds-button-sm">Go</button></noscript>
        </form>
      </div>
      <div class="app-nav-links" th:if="${authenticated}">
        <a th:href="@{/}" class="app-nav-link"
           th:classappend="${currentPath != null and currentPath == '/'} ? 'active' : null">Dashboard</a>
        <a th:href="@{/pipelines}" class="app-nav-link"
           th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/pipelines')} ? 'active' : null">Pipelines</a>
        <a th:href="@{/datasources}" class="app-nav-link"
           th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/datasources')} ? 'active' : null">Datasources</a>
        <a th:href="@{/templates}" class="app-nav-link"
           th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/templates')} ? 'active' : null">Templates</a>
        <a th:href="@{/executions}" class="app-nav-link"
           th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/executions')} ? 'active' : null">Executions</a>
        <a th:href="@{/workspaces}" class="app-nav-link"
           th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/workspaces')} ? 'active' : null">Workspaces</a>
        <a th:href="@{/settings}" class="app-nav-link"
           th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/settings')} ? 'active' : null">Settings</a>
        <a th:href="@{/admin/users}" class="app-nav-link"
           th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/admin')} ? 'active' : null">Admin</a>
        <form th:action="@{/logout}" method="post" class="app-logout-form">
          <button type="submit" class="ds-button ds-button-ghost ds-button-sm">Logout</button>
        </form>
      </div>
    </div>
  </nav>

  <!-- The notification stack (ui-screens.md §5.1): htmx appends server-rendered
       partials/toast fragments here (hx-swap="beforeend"); toast.js arms each. -->
  <div id="toast" class="ds-toast-stack" aria-live="polite" style="top: var(--header-height); right: var(--gap-md);">
    <!-- Full-page redirect flashes, rendered server-side into the stack (§4.13): the
         workspaces mutations keep their redirect contract — only how the result is
         DISPLAYED changed (banner → toast). toast.js arms these at DOMContentLoaded
         like any swapped-in toast. Error copy is the reviewed 022/F8 wording, verbatim. -->
    <!-- th:if CANNOT share an element with th:replace: fragment inclusion has the
         higher precedence and DISCARDS the host before the condition is evaluated —
         so the condition wraps a th:block and the replace lives on the inner div. -->
    <th:block th:if="${param.error}" th:with="code=${param.error[0]}">
      <th:block th:if="${code == 'duplicate_name'}"><div th:replace="~{partials/toast :: toast('danger', 'Workspace action refused', 'A workspace with that name already exists.')}"></div></th:block>
      <th:block th:if="${code == 'name_invalid'}"><div th:replace="~{partials/toast :: toast('danger', 'Workspace action refused', 'Workspace names use lowercase letters, digits, dashes and underscores — 1 to 63 characters.')}"></div></th:block>
      <th:block th:if="${code == 'creation_forbidden'}"><div th:replace="~{partials/toast :: toast('danger', 'Workspace action refused', 'Creating workspaces is not permitted on this server.')}"></div></th:block>
      <th:block th:if="${code == 'in_use'}"><div th:replace="~{partials/toast :: toast('danger', 'Workspace action refused', 'This workspace still owns content (pipelines, templates or datasources), or still needs its owner.')}"></div></th:block>
      <th:block th:if="${code == 'membership_required'}"><div th:replace="~{partials/toast :: toast('danger', 'Workspace action refused', 'That workspace is not available to you.')}"></div></th:block>
      <th:block th:if="${code == 'session_required'}"><div th:replace="~{partials/toast :: toast('danger', 'Workspace action refused', 'Workspace actions from these screens need a signed-in session. Use the workspace REST API with an API key, or sign in.')}"></div></th:block>
      <th:block th:if="${code == 'switch_refused'}"><div th:replace="~{partials/toast :: toast('danger', 'Workspace action refused', 'Switching workspaces was refused — you are not a member of that workspace.')}"></div></th:block>
      <th:block th:if="${code == 'user_not_found' or code == 'not_found'}"><div th:replace="~{partials/toast :: toast('danger', 'Workspace action refused', 'No user or workspace with that identity exists.')}"></div></th:block>
    </th:block>
    <th:block th:if="${param.ok}" th:with="code=${param.ok[0]}">
      <th:block th:if="${code == 'created'}"><div th:replace="~{partials/toast :: toast('success', 'Done', 'The workspace was created.')}"></div></th:block>
      <th:block th:if="${code == 'joined'}"><div th:replace="~{partials/toast :: toast('success', 'Done', 'You joined the workspace.')}"></div></th:block>
      <th:block th:if="${code == 'member_added'}"><div th:replace="~{partials/toast :: toast('success', 'Done', 'The member was added.')}"></div></th:block>
      <th:block th:if="${code == 'member_removed'}"><div th:replace="~{partials/toast :: toast('success', 'Done', 'The member was removed.')}"></div></th:block>
      <th:block th:if="${code == 'deleted'}"><div th:replace="~{partials/toast :: toast('success', 'Done', 'The workspace was deleted.')}"></div></th:block>
    </th:block>
  </div>

  <main class="app-container app-main">
    <th:block th:replace="${content}"/>
  </main>

  <script th:src="@{/webjars/htmx.org/2.0.10/dist/htmx.min.js}"></script>
  <script th:src="@{/js/toast.js}"></script>
</body>
</html>
