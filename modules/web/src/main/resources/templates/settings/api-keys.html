<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: page(~{::content})}">
<th:block th:fragment="content">
  <!-- 091 — this screen used to issue and revoke keys. It holds nothing but the link now:
       "the keys that may call this deployment" and "the endpoints they may call" are one
       question, and keeping them a page apart made the API screen a read-only shadow of a
       settings page nobody found. The route stays so existing bookmarks and the avatar
       menu still land somewhere true. -->
  <div class="app-page-h">
    <div>
      <h1 class="ds-headline">API keys</h1>
      <p class="app-page-sub">API keys live on the API screen, beside the endpoints and the MCP connection they are used with.</p>
    </div>
    <div class="app-page-actions">
      <a class="ds-button ds-button-primary" th:href="@{/api-console}">Go to API</a>
    </div>
  </div>

  <div class="ds-card">
    <div class="app-card-b">
      <div class="app-empty">
        <b>Moved to the API screen</b>
        Issue, inspect and revoke your keys — agent keys, endpoint keys and server keys — at
        <a th:href="@{/api-console}" class="ds-mono">/api-console</a>.
      </div>
    </div>
  </div>
</th:block>
</html>
