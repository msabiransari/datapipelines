<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: page(~{::content})}">
<th:block th:fragment="content">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--gap-lg)">
    <h1 style="font-size:var(--text-xl);font-weight:var(--weight-bold);margin:0">API Keys</h1>
    <button class="ds-button ds-button-primary" onclick="showCreateModal()">Generate Key</button>
  </div>

  <div id="keyCreated" style="display:none;background:var(--accent-success-bg);border:1px solid var(--accent-success);padding:var(--gap-md);border-radius:var(--radius-base);margin-bottom:var(--gap-md)"></div>

  <div class="ds-card" style="padding:var(--gap-md)">
    <table style="width:100%;font-size:var(--text-sm)">
      <thead>
        <tr>
          <th style="text-align:left;padding:var(--gap-xs);color:var(--text-secondary);font-weight:var(--weight-medium);border-bottom:1px solid var(--border-default)">Name</th>
          <th style="text-align:left;padding:var(--gap-xs);color:var(--text-secondary);font-weight:var(--weight-medium);border-bottom:1px solid var(--border-default)">Created</th>
          <th style="text-align:left;padding:var(--gap-xs);color:var(--text-secondary);font-weight:var(--weight-medium);border-bottom:1px solid var(--border-default)">Last Used</th>
          <th style="text-align:left;padding:var(--gap-xs);color:var(--text-secondary);font-weight:var(--weight-medium);border-bottom:1px solid var(--border-default)">Scopes</th>
          <th style="text-align:right;padding:var(--gap-xs);color:var(--text-secondary);font-weight:var(--weight-medium);border-bottom:1px solid var(--border-default)">Actions</th>
        </tr>
      </thead>
      <tbody id="keys-table-body">
        <th:block th:if="${keys == null || keys.isEmpty()}">
          <tr><td colspan="5" style="padding:var(--gap-md);text-align:center;color:var(--text-secondary);font-size:var(--text-sm)">No API keys found</td></tr>
        </th:block>
        <tr th:each="key : ${keys}">
          <td style="padding:var(--gap-xs);font-family:var(--font-mono)">
            <span th:text="${key.name}">key-name</span>
            <span th:if="${key.isRevoked}" style="color:var(--accent-danger);font-size:var(--text-xs)"> (revoked)</span>
          </td>
          <td style="padding:var(--gap-xs);color:var(--text-secondary)" th:text="${#temporals.format(key.createdAt, 'yyyy-MM-dd HH:mm')}">2026-08-01 12:00</td>
          <td style="padding:var(--gap-xs);color:var(--text-secondary)" th:text="${key.lastUsedAt != null ? #temporals.format(key.lastUsedAt, 'yyyy-MM-dd HH:mm') : 'never'}">never</td>
          <td style="padding:var(--gap-xs)">
            <span style="font-size:var(--text-xs);background:var(--surface-tertiary);padding:2px var(--gap-xs);border-radius:var(--radius-base)" th:each="scope : ${key.scopes}" th:text="${scope.wire}">read</span>
          </td>
          <td style="padding:var(--gap-xs);text-align:right">
            <th:block th:if="!${key.isRevoked}">
              <button class="ds-button ds-button-ghost ds-button-sm"
                      th:attr="hx-delete=@{/partials/api-keys/{id}(id=${key.id})}"
                      hx-target="#keys-table-body"
                      hx-confirm="Revoke this key?"
                      style="color:var(--accent-danger)">Revoke</button>
            </th:block>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div id="create-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center">
    <div class="ds-card" style="max-width:480px;width:100%;padding:var(--gap-lg);position:relative">
      <button class="ds-button ds-button-ghost ds-button-sm" onclick="hideCreateModal()" style="position:absolute;top:var(--gap-sm);right:var(--gap-sm);font-size:var(--text-xl)">&times;</button>
      <h2 style="font-size:var(--text-lg);font-weight:var(--weight-semibold);margin:0 0 var(--gap-md) 0">Generate API Key</h2>
      <form id="createKeyForm"
            th:attr="hx-post=@{/partials/api-keys}"
            hx-target="#keyCreated"
            hx-swap="innerHTML">
        <div style="margin-bottom:var(--gap-md)">
          <label style="display:block;color:var(--text-secondary);font-size:var(--text-sm);margin-bottom:var(--gap-xs)">Name</label>
          <input type="text" name="name" class="ds-input" style="width:100%" placeholder="My Key" required>
        </div>
        <div style="margin-bottom:var(--gap-md)">
          <label style="display:block;color:var(--text-secondary);font-size:var(--text-sm);margin-bottom:var(--gap-xs)">Scopes (comma-separated)</label>
          <input type="text" name="scopes" class="ds-input" style="width:100%" placeholder="read, execute" th:attr="placeholder='Available: ' + ${#strings.listJoin(scopes, ', ')}">
          <p style="color:var(--text-tertiary);font-size:var(--text-xs);margin:var(--gap-xs) 0 0 0">Available: <th:block th:each="s,stat : ${scopes}"><span th:text="${s}">read</span><th:block th:if="!${stat.last}">, </th:block></th:block></p>
        </div>
        <div style="margin-bottom:var(--gap-lg)">
          <label style="display:block;color:var(--text-secondary);font-size:var(--text-sm);margin-bottom:var(--gap-xs)">Expiry (days, optional)</label>
          <input type="number" name="expiryDays" class="ds-input" style="width:100%" placeholder="Leave blank for no expiry" min="1">
        </div>
        <button type="submit" class="ds-button ds-button-primary" style="width:100%" onclick="setTimeout(hideCreateModal, 200)">Generate</button>
      </form>
    </div>
  </div>

  <script>
    function showCreateModal() {
      document.getElementById('create-modal').style.display = 'flex';
    }
    function hideCreateModal() {
      document.getElementById('create-modal').style.display = 'none';
    }
    document.addEventListener('DOMContentLoaded', function() {
      var observer = new MutationObserver(function() {
        var created = document.getElementById('keyCreated');
        if (created.children.length > 0 && created.style.display === 'none') {
          created.style.display = 'block';
          hideCreateModal();
          htmx.ajax('GET', '/settings/api-keys', {target: '#keys-table-body', swap: 'outerHTML'}).then(function() {
            setTimeout(function() {
              var keyInput = created.querySelector('input');
              if (keyInput) keyInput.select();
            }, 50);
          });
        }
      });
      observer.observe(document.getElementById('keyCreated'), {childList: true, subtree: true});
    });
  </script>
</th:block>
</html>
