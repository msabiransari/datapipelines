<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: page(~{::content})}">
<th:block th:fragment="content">
  <h1 style="font-size:var(--text-xl);font-weight:var(--weight-bold);margin:0 0 var(--gap-lg) 0">Settings</h1>

  <div style="display:grid;grid-template-columns:1fr;gap:var(--gap-lg);max-width:640px">

    <div class="ds-card" style="padding:var(--gap-lg)">
      <h2 style="font-size:var(--text-lg);font-weight:var(--weight-semibold);margin:0 0 var(--gap-md) 0">Profile</h2>
      <div style="display:flex;align-items:center;gap:var(--gap-md);margin-bottom:var(--gap-md)">
        <th:block th:if="${user?.profilePictureUrl != null}">
          <img th:src="${user.profilePictureUrl}" alt="Avatar" style="width:48px;height:48px;border-radius:50%;object-fit:cover">
        </th:block>
        <th:block th:if="${user?.profilePictureUrl == null}">
          <div style="width:48px;height:48px;border-radius:50%;background:var(--surface-tertiary);display:flex;align-items:center;justify-content:center;font-size:var(--text-lg);color:var(--text-secondary)" th:text="${user?.displayName != null ? #strings.substring(user.displayName, 0, 1)?.toUpperCase() : '?'}">?</div>
        </th:block>
        <div>
          <p style="font-weight:var(--weight-semibold);margin:0" th:text="${user?.displayName ?: 'Unknown'}">Display Name</p>
          <p style="color:var(--text-secondary);font-size:var(--text-sm);margin:0" th:text="${user?.email ?: '—'}">email@example.com</p>
        </div>
      </div>
      <div style="display:flex;gap:var(--gap-sm);margin-bottom:var(--gap-md)">
        <span style="font-size:var(--text-xs);background:var(--surface-tertiary);padding:2px var(--gap-xs);border-radius:var(--radius-base);color:var(--text-secondary)" th:text="${user?.provider ?: 'N/A'}">Google</span>
        <span style="font-size:var(--text-xs);background:var(--surface-tertiary);padding:2px var(--gap-xs);border-radius:var(--radius-base);color:var(--text-secondary)" th:text="${authMethod}">OIDC</span>
      </div>
    </div>

    <div class="ds-card" style="padding:var(--gap-lg)">
      <h2 style="font-size:var(--text-lg);font-weight:var(--weight-semibold);margin:0 0 var(--gap-md) 0">Appearance</h2>
      <div style="display:flex;align-items:center;gap:var(--gap-sm)">
        <label for="themeSelect" style="color:var(--text-secondary);font-size:var(--text-sm);white-space:nowrap">Theme</label>
        <select id="themeSelect" class="ds-select" style="flex:1" hx-patch="/partials/profile/theme" hx-include="this" name="theme" hx-target="#theme-status" hx-swap="innerHTML">
          <option value="" th:selected="${user?.themePreference == null}">Default (deployment)</option>
          <th:block th:each="theme : ${themes}">
            <option th:value="${theme}" th:selected="${theme == user?.themePreference}" th:text="${theme}">theme</option>
          </th:block>
        </select>
      </div>
      <div id="theme-status" style="margin-top:var(--gap-xs)"></div>
    </div>

    <div class="ds-card" style="padding:var(--gap-lg)">
      <h2 style="font-size:var(--text-lg);font-weight:var(--weight-semibold);margin:0 0 var(--gap-md) 0">Session</h2>
      <div style="font-size:var(--text-sm)">
        <div style="display:flex;justify-content:space-between;padding:var(--gap-xs) 0;border-bottom:1px solid var(--border-default)">
          <span style="color:var(--text-secondary)">Scopes</span>
          <span th:each="s,stat : ${sessionScopes}"><span style="font-family:var(--font-mono)" th:text="${s}">read</span><th:block th:if="!${stat.last}">, </th:block></span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:var(--gap-xs) 0;border-bottom:1px solid var(--border-default)">
          <span style="color:var(--text-secondary)">User ID</span>
          <span style="font-family:var(--font-mono);font-size:var(--text-xs)" th:text="${user?.id}">uuid</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:var(--gap-xs) 0">
          <span style="color:var(--text-secondary)">Last Login</span>
          <span style="color:var(--text-secondary)" th:text="${user?.lastLoginAt != null ? #temporals.format(user.lastLoginAt, 'yyyy-MM-dd HH:mm') : '—'}">2026-08-01 12:00</span>
        </div>
      </div>
    </div>

    <form th:action="@{/logout}" method="post" style="margin-top:var(--gap-sm)">
      <button type="submit" class="ds-button ds-button-secondary" style="width:100%">Logout</button>
    </form>

  </div>
</th:block>
</html>
