<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: page(~{::content})}">
<th:block th:fragment="content">
  <link th:href="@{/css/template-editor.css}" rel="stylesheet">

  <!-- D4: the shared, dependency-free SQL tokenizer (032) — consumed, not modified.
       It highlights the read-only PREVIEW OUTPUT only; the editable textarea stays
       plain (D5). preview.js wraps the pass this page's renderPreview calls. -->
  <script th:src="@{/js/pipeline-editor/sql-highlight.js}"></script>
  <script th:src="@{/js/template-editor/preview.js}"></script>

  <!-- 041 layout: the page is a two-row grid — this header, then a row that fills
       the viewport below the nav. Inside that row: context rail LEFT (the
       --app-detail-width token), SQL source RIGHT taking the remainder, preview
       output below the editor sharing its width (template-editor.css). -->
  <div class="te-page">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <div>
      <h1 style="font-size:var(--text-xl);font-weight:var(--weight-bold);margin:0" th:text="${template?.displayName ?: 'Unknown Template'}">Template Name</h1>
      <p style="color:var(--text-secondary);font-size:var(--text-sm);margin:var(--gap-xs) 0 0 0"
         th:text="'ID: ' + ${template?.id ?: '—'}" th:title="${template?.id}">Template ID</p>
      <!-- §9.3: `type` is a create-time input and IMMUTABLE afterwards (§5.3), so it renders
           here as a read-only VALUE — never as a disabled control. A disabled <select> is
           re-enabled in devtools in one click; the server refuses the write with
           `template.validation.type_immutable` either way, but the UI must not present a lock
           it does not own. `dialect` shows for the same reason: it belongs to the type.
           There is no name control here either — §4.5 offers no rename, anywhere. -->
      <p style="color:var(--text-secondary);font-size:var(--text-sm);margin:var(--gap-xs) 0 0 0">
        <span>Type:</span>
        <span class="ds-badge ds-badge-default" th:text="${template?.type?.wire ?: '—'}">sql</span>
        <th:block th:if="${template?.dialect != null}">
          <span>Dialect:</span>
          <span class="ds-badge ds-badge-default" th:text="${template.dialect.wire}">POSTGRES</span>
        </th:block>
      </p>
    </div>
    <div style="display:flex;gap:var(--gap-sm);align-items:center">
      <!-- versioning §6/§7: the pending-release affordance. Release is the human action
           that publishes the draft (agents never release, D4); discard deletes it (a
           template draft is always deletable — nothing references it by FK). -->
      <span th:if="${hasDraft}" class="ds-badge ds-badge-warning"
            th:text="'Draft v' + ${draftVersion} + ' — pending release'"></span>
      <button th:if="${hasDraft}" class="ds-button ds-button-primary ds-button-sm" id="tpl-release-draft"
              th:attr="data-id=${template?.id}, data-hash=${draftHash}"
              onclick="tplLifecycle('release')">Release</button>
      <button th:if="${hasDraft}" class="ds-button ds-button-secondary ds-button-sm" id="tpl-discard-draft"
              th:attr="data-id=${template?.id}, data-hash=${draftHash}"
              onclick="tplLifecycle('discard')">Discard draft</button>
      <!-- R5 (054): selecting a version LOADS it. The request swaps the source column
           (§5's idiom — a stable target, outerHTML, the same fragment the page painted
           first); the select's own `version` value rides along, and the name is a
           server-rendered @{...} parameter because it is fixed for the page (§9.6: never
           a path segment). -->
      <label for="versionSelect" style="color:var(--text-secondary);font-size:var(--text-sm)">Version:</label>
      <select id="versionSelect" name="version" class="ds-select" style="font-size:var(--text-sm)"
              th:attr="hx-get=@{/partials/templates/editor/source(name=${templateName})}"
              hx-trigger="change" hx-target="#template-source" hx-swap="outerHTML">
        <th:block th:each="v : ${versions}">
          <option th:value="${v.version}" th:selected="${v.version == selectedVersion}" th:text="'v' + ${v.version}"></option>
        </th:block>
      </select>
    </div>
  </div>

  <div class="te-body">
    <!-- LEFT: the render-context rail. Keyboard/focus order is context → source →
         Preview (041 gate 4) — this rail precedes the source column in the DOM. -->
    <div class="te-rail">
      <div>
        <div class="te-panel-head">
          <h2>Render Context</h2>
          <div style="display:flex;gap:var(--gap-xs)">
            <button class="ds-button ds-button-ghost ds-button-sm" onclick="switchTab('kv')" id="tab-kv-btn" style="font-weight:var(--weight-semibold);border-bottom:2px solid var(--accent-primary)">Key/Value</button>
            <button class="ds-button ds-button-ghost ds-button-sm" onclick="switchTab('json')" id="tab-json-btn" style="border-bottom:2px solid transparent">JSON</button>
          </div>
        </div>
        <div id="context-kv" style="margin-bottom:var(--gap-sm)">
          <!-- The row markup addContextRow() clones — styled once, in template-editor.css. -->
          <div id="context-rows" class="te-context-rows">
            <div class="context-row">
              <input type="text" placeholder="key">
              <input type="text" placeholder="value">
              <button class="ds-button ds-button-ghost ds-button-sm" onclick="removeContextRow(this)">&times;</button>
            </div>
          </div>
          <button class="ds-button ds-button-ghost ds-button-sm" onclick="addContextRow()">+ Add Row</button>
        </div>
        <div id="context-json" style="display:none">
          <textarea id="contextJsonTextarea" class="ds-textarea" placeholder='{"key1": "value1", "key2": 42}'>{ }</textarea>
        </div>
      </div>

      <th:block th:if="${template?.imports != null && !template.imports.isEmpty()}">
        <div>
          <div class="te-panel-head">
            <h2>Imports</h2>
          </div>
          <!-- .ds-table supplies its own box (app.css) — the old .ds-card wrapper double-framed it. -->
          <table class="ds-table">
            <thead>
              <tr>
                <th>Template ID</th>
                <th class="num">Version</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="imp : ${template.imports}">
                <td th:text="${imp.id}">import_id</td>
                <td class="num" th:text="${imp.version}">1</td>
              </tr>
            </tbody>
          </table>
        </div>
      </th:block>
    </div>

    <!-- RIGHT: the source column — the editor (~2/3) and, below it sharing the
         width, the preview output (~1/3). Both scroll inside their panes (D2/D3).
         Defined ONCE in partials/template-source so the first paint and every
         version swap render the same markup (R5). -->
    <div th:replace="~{partials/template-source :: source}"></div>
  </div>
  </div>

  <script th:inline="javascript">
    let selectedTab = 'kv';

    /* versioning §5.3/§5.4: the draft lifecycle actions — hash-guarded through the same
       REST endpoints and the same CSRF double-submit pair every cookie-authenticated
       state-changing fetch on this server uses. */
    function tplLifecycle(action) {
      var btn = document.getElementById(action === 'release' ? 'tpl-release-draft' : 'tpl-discard-draft');
      var id = btn.getAttribute('data-id');
      var hash = btn.getAttribute('data-hash');
      if (action === 'discard' && !window.confirm('Discard this draft? Its version number returns to the pool.')) return;
      btn.disabled = true;
      var csrf = (document.cookie.match(/(?:^|;\s*)dp_csrf=([^;]*)/) || [])[1];
      /* §9.6: the name never travels in a URL path segment (a `%2F` is refused 400 below
         routing) — release/discard carry it in the JSON body instead. */
      var url = action === 'release'
        ? '/api/v1/templates/release'
        : '/api/v1/templates/draft/discard';
      fetch(url, {
        method: 'POST',
        headers: { 'DP-CSRF-Token': csrf ? decodeURIComponent(csrf) : '', 'If-Match': hash, 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ name: id })
      }).then(function (response) {
        if (response.ok) { window.location.reload(); return null; }
        return response.json().catch(function () { return {}; }).then(function (err) {
          throw new Error((err && err.error && err.error.message) || ('HTTP ' + response.status));
        });
      }).catch(function (err) {
        btn.disabled = false;
        window.alert((action === 'release' ? 'Release' : 'Discard') + ' refused: ' + err.message);
      });
    }

    function switchTab(tab) {
      selectedTab = tab;
      document.getElementById('context-kv').style.display = tab === 'kv' ? 'block' : 'none';
      document.getElementById('context-json').style.display = tab === 'json' ? 'block' : 'none';
      document.getElementById('tab-kv-btn').style.borderBottom = tab === 'kv' ? '2px solid var(--accent-primary)' : '2px solid transparent';
      document.getElementById('tab-kv-btn').style.fontWeight = tab === 'kv' ? 'var(--weight-semibold)' : 'var(--weight-normal)';
      document.getElementById('tab-json-btn').style.borderBottom = tab === 'json' ? '2px solid var(--accent-primary)' : '2px solid transparent';
      document.getElementById('tab-json-btn').style.fontWeight = tab === 'json' ? 'var(--weight-semibold)' : 'var(--weight-normal)';
    }

    function addContextRow() {
      var row = document.createElement('div');
      row.className = 'context-row';
      row.innerHTML = '<input type="text" placeholder="key">' +
        '<input type="text" placeholder="value">' +
        '<button class="ds-button ds-button-ghost ds-button-sm" onclick="removeContextRow(this)">&times;</button>';
      document.getElementById('context-rows').appendChild(row);
    }

    function removeContextRow(btn) {
      btn.closest('.context-row').remove();
    }

    function buildContextJson() {
      if (selectedTab === 'json') {
        return document.getElementById('contextJsonTextarea').value;
      }
      var obj = {};
      var rows = document.querySelectorAll('#context-rows .context-row');
      rows.forEach(function(row) {
        var inputs = row.querySelectorAll('input');
        var key = inputs[0].value.trim();
        var val = inputs[1].value.trim();
        if (key) {
          obj[key] = val.match(/^[0-9]+(?:\.[0-9]+)?$/) ? Number(val) : val;
        }
      });
      return JSON.stringify(obj);
    }

    function renderPreview() {
      var btn = document.getElementById('previewBtn');
      var spinner = document.getElementById('previewSpinner');
      btn.disabled = true;
      spinner.style.display = 'inline';
      var pane = document.getElementById('previewPane');

      var templateId = [[${template?.id ?: ""}]];
      var version = document.getElementById('versionSelect')?.value || '1';
      /* Whichever body is on screen: the editable textarea on the working version, the
         read-only <pre> on a selected one. The server renders the STORED version either
         way — this only keeps the request honest about what the author is looking at. */
      var body = document.getElementById('templateBody')?.value
        || document.getElementById('versionBody')?.textContent
        || '';
      var context = buildContextJson();

      var params = new URLSearchParams();
      params.append('body', body);
      params.append('context', context);

      fetch('/partials/templates/render?name=' + encodeURIComponent(templateId) + '&version=' + encodeURIComponent(version), {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          'DP-CSRF-Token': document.querySelector('[hx-headers]')?.getAttribute('hx-headers') ? JSON.parse(document.querySelector('[hx-headers]').getAttribute('hx-headers'))['DP-CSRF-Token'] : ''
        },
        body: params
      }).then(function(r) { return r.text(); })
        .then(function(html) {
          pane.innerHTML = html;
          /* 041 D4 — rendered SQL gets the shared tokenizer's treatment; the
             pass is a no-op on shapes without a <pre> (the error card). */
          if (window.TplPreviewHighlight) window.TplPreviewHighlight.highlightPreview(pane);
        })
        .catch(function(e) { pane.innerHTML = '<div class="ds-card" style="padding:var(--gap-md);border-color:var(--accent-danger)"><p style="color:var(--accent-danger);font-size:var(--text-sm)">' + e.message + '</p></div>'; })
        .finally(function() { btn.disabled = false; spinner.style.display = 'none'; });
    }
  </script>
</th:block>
</html>
