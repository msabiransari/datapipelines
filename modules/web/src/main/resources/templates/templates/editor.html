<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: page(~{::content})}">
<th:block th:fragment="content">
  <link th:href="@{/css/template-editor.css}" rel="stylesheet">

  <!-- D4: the shared, dependency-free SQL tokenizer (032) — consumed, not modified.
       It highlights the read-only PREVIEW OUTPUT only; the editable textarea stays
       plain (D5). preview.js wraps the pass this page's renderPreview calls. -->
  <script th:src="@{/js/pipeline-editor/sql-highlight.js}"></script>
  <script th:src="@{/js/template-editor/preview.js}"></script>
  <!-- 097 §D: the page's behaviour is a FILE — the draft lifecycle, the context rail and the
       preview call. It was a ~135-line inline script body, which put it outside the CSRF
       audit's static/js sweep, outside `node --test`, and outside review as JS. csrf.js is
       the one reader of the double-submit cookie. -->
  <script th:src="@{/js/csrf.js}"></script>
  <script th:src="@{/js/template-editor/lifecycle.js}"></script>

  <!-- 041 layout: the page is a two-row grid — this header, then a row that fills
       the viewport below the nav. Inside that row: context rail LEFT (the
       --app-detail-width token), SQL source RIGHT taking the remainder, preview
       output below the editor sharing its width (template-editor.css). -->
  <!-- The template under edit, as DATA: lifecycle.js reads it here instead of the server
       inlining a value into a script body (which is what made the script un-extractable). -->
  <div class="te-page" th:attr="data-template-id=${template?.id ?: ''}">
  <div class="u-row u-between">
    <div>
      <h1 class="ds-headline u-m0" th:text="${template?.displayName ?: 'Unknown Template'}">Template Name</h1>
      <p class="u-secondary u-text-sm u-m0 u-mt-xs"
         th:text="'ID: ' + ${template?.id ?: '—'}" th:title="${template?.id}">Template ID</p>
      <!-- §9.3: `type` is a create-time input and IMMUTABLE afterwards (§5.3), so it renders
           here as a read-only VALUE — never as a disabled control. A disabled <select> is
           re-enabled in devtools in one click; the server refuses the write with
           `template.validation.type_immutable` either way, but the UI must not present a lock
           it does not own. `dialect` shows for the same reason: it belongs to the type.
           There is no name control here either — §4.5 offers no rename, anywhere. -->
      <p class="u-secondary u-text-sm u-m0 u-mt-xs">
        <span>Type:</span>
        <span class="ds-badge ds-badge-default" th:text="${template?.type?.wire ?: '—'}">sql</span>
        <th:block th:if="${template?.dialect != null}">
          <span>Dialect:</span>
          <span class="ds-badge ds-badge-default" th:text="${template.dialect.wire}">POSTGRES</span>
        </th:block>
      </p>
    </div>
    <div class="u-row">
      <!-- versioning §6/§7: the pending-release affordance. Release is the human action
           that publishes the draft (agents never release, D4); discard deletes it (a
           template draft is always deletable — nothing references it by FK). -->
      <span th:if="${hasDraft}" class="ds-badge ds-badge-warning"
            th:text="'Draft v' + ${draftVersion} + ' — pending release'"></span>
      <button th:if="${hasDraft}" class="ds-button ds-button-primary ds-button-sm" id="tpl-release-draft"
              th:attr="data-id=${template?.id}, data-hash=${draftHash}"
              onclick="tplLifecycle('release')">Release</button>
      <button th:if="${hasDraft}" class="ds-button ds-button-secondary ds-button-sm" id="tpl-discard-draft"
              th:attr="data-id=${template?.id}, data-hash=${draftHash}"
              onclick="tplLifecycle('discard')">Discard draft</button>
      <!-- R5 (054): selecting a version LOADS it. The request swaps the source column
           (§5's idiom — a stable target, outerHTML, the same fragment the page painted
           first); the select's own `version` value rides along, and the name is a
           server-rendered @{...} parameter because it is fixed for the page (§9.6: never
           a path segment). -->
      <label for="versionSelect" class="u-secondary u-text-sm">Version:</label>
      <select id="versionSelect" name="version" class="ds-select u-text-sm"
              th:attr="hx-get=@{/partials/templates/editor/source(name=${templateName})}"
              hx-trigger="change" hx-target="#template-source" hx-swap="outerHTML">
        <th:block th:each="v : ${versions}">
          <option th:value="${v.version}" th:selected="${v.version == selectedVersion}" th:text="'v' + ${v.version}"></option>
        </th:block>
      </select>
    </div>
  </div>

  <div class="te-body">
    <!-- LEFT: the render-context rail. Keyboard/focus order is context → source →
         Preview (041 gate 4) — this rail precedes the source column in the DOM. -->
    <div class="te-rail">
      <div>
        <div class="te-panel-head">
          <h2>Render Context</h2>
          <div class="u-flex u-gap-xs">
            <button class="ds-button ds-button-ghost ds-button-sm u-semibold app-tab-active" onclick="switchTab('kv')" id="tab-kv-btn">Key/Value</button>
            <button class="ds-button ds-button-ghost ds-button-sm app-tab-idle" onclick="switchTab('json')" id="tab-json-btn">JSON</button>
          </div>
        </div>
        <div id="context-kv" class="u-mb-sm">
          <!-- The row markup addContextRow() clones — styled once, in template-editor.css. -->
          <div id="context-rows" class="te-context-rows">
            <div class="context-row">
              <input type="text" placeholder="key">
              <input type="text" placeholder="value">
              <button class="ds-button ds-button-ghost ds-button-sm" onclick="removeContextRow(this)"><svg class="ds-icon ds-icon-sm" aria-hidden="true" focusable="false"><use href="/vendor/icons/lucide-sprite.svg#x"></use></svg></button>
            </div>
          </div>
          <button class="ds-button ds-button-ghost ds-button-sm" onclick="addContextRow()"><svg class="ds-icon ds-icon-sm" aria-hidden="true" focusable="false"><use href="/vendor/icons/lucide-sprite.svg#plus"></use></svg> Add Row</button>
        </div>
        <div id="context-json" class="u-hidden">
          <textarea id="contextJsonTextarea" class="ds-textarea" placeholder='{"key1": "value1", "key2": 42}'>{ }</textarea>
        </div>
      </div>

      <th:block th:if="${template?.imports != null && !template.imports.isEmpty()}">
        <div>
          <div class="te-panel-head">
            <h2>Imports</h2>
          </div>
          <!-- .ds-table supplies its own box (app.css) — the old .ds-card wrapper double-framed it. -->
          <table class="ds-table">
            <thead>
              <tr>
                <th>Template ID</th>
                <th class="num">Version</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="imp : ${template.imports}">
                <td th:text="${imp.id}">import_id</td>
                <td class="num" th:text="${imp.version}">1</td>
              </tr>
            </tbody>
          </table>
        </div>
      </th:block>
    </div>

    <!-- RIGHT: the source column — the editor (~2/3) and, below it sharing the
         width, the preview output (~1/3). Both scroll inside their panes (D2/D3).
         Defined ONCE in partials/template-source so the first paint and every
         version swap render the same markup (R5). -->
    <div th:replace="~{partials/template-source :: source}"></div>
  </div>
  </div>

  <!-- The discard confirmation, in the page (§5.1): the house backdrop + `.app-modal`
       idiom the register and delete dialogs use. It replaces a `window.confirm`, which
       blocks the page, cannot be styled and cannot be driven by the browser suite. -->
  <div id="tpl-discard-confirm" class="u-backdrop u-backdrop-hidden">
    <div class="ds-card app-modal app-modal-sm">
      <h2 class="ds-title u-m0 u-mb-sm">Discard this draft?</h2>
      <p class="u-secondary u-text-sm u-mb-md">Its version number returns to the pool. The released version is untouched.</p>
      <div class="u-row u-between">
        <button type="button" class="ds-button ds-button-secondary ds-button-sm"
                onclick="TplLifecycle.closeConfirm()">Keep the draft</button>
        <button type="button" class="ds-button ds-button-primary ds-button-sm" id="tpl-discard-confirm-btn"
                onclick="TplLifecycle.confirmDiscard()">Discard draft</button>
      </div>
    </div>
  </div>
</th:block>
</html>
