<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: page(~{::content})}">
<th:block th:fragment="content">
  <!-- 058: the explorer's keyboard layer — up/down moves selection, right/left expands and
       collapses, Enter opens the editor. The tree's expansion itself stays htmx+<details>
       (047); this script only owns selection, focus and the aria state the layout adds. -->
  <!-- 104 §A: the shared pane splitter, PARSER-BLOCKING and above the markup — it puts the
       remembered `--tplx-tree-w` on <html> before the tree pane paints, so a remembered width
       is the width of the FIRST frame and not a shift onto it. -->
  <script th:src="@{/js/splitter.js}"></script>
  <script th:src="@{/js/template-explorer.js}" defer></script>
  <!-- 106: the detail pane's tabs, its lifecycle verbs and the narrow layout's tree drawer. -->
  <script th:src="@{/js/explorer-detail.js}" defer></script>
  <!-- 102: the lifecycle dialogs' close/focus/typed-confirm layer (§4.3d). -->
  <script th:src="@{/js/lifecycle-dialog.js}" defer></script>

  <!-- 058 — the explorer: TREE LEFT, the selected template RIGHT. The 047 accordion put each
       template's versions table under its own row, pushing every other row down; the owner's
       spec is Windows file explorer — "tree on the left and when click on the leaf, table
       should show up on the right". Everything 047 built underneath (server-side prefix
       levels, virtual folders, browse-vs-search) stays; this is what those queries are
       rendered INTO. -->
  <div class="tplx-page">

    <div class="app-page-h">
      <div>
        <h1 class="ds-headline">Templates</h1>
        <p class="app-page-sub">Reusable SQL that pipelines pin by version. A template's folder is the first
          segment of its name.</p>
      </div>
      <div class="app-page-actions">
        <!-- 106 §B: below 1100px the tree is a DRAWER, not a column — this is what opens it.
             The stylesheet decides when it is visible (`display: none` above the breakpoint),
             so the markup states the affordance once and no script measures the viewport. -->
        <button type="button" class="ds-button ds-button-secondary tplx-browse"
                data-explorer-drawer-open aria-expanded="false" aria-controls="template-tree-pane">Browse</button>
        <button class="ds-button ds-button-primary" onclick="showCreateTemplateModal()"
                th:if="${canAuthor}" data-verb="template-create">Create Template</button>
      </div>
    </div>

    <!-- Search, dialect and type address each other by ID (hx-include): a name-based include
         would also sweep up the create modal's own name="dialect" and name="type" inputs
         (§4.6). A non-empty search switches the LEFT pane to a flat list of full paths;
         clearing it returns to the tree (template-hierarchy-design §9.2). -->
    <!-- `.ds-input` is `width: 100%`, so a bare select in a flex row grows without bound.
         With three controls instead of two that starved the search box to a few pixels, so
         the selects are sized by their content and only the search box flexes. -->
    <div class="u-row-md u-wrap u-mb-md tplx-search-row">
      <input type="search" id="template-filter-q" name="q" th:value="${q}"
             placeholder="Search templates..."
             th:attr="hx-get=@{/partials/templates}, hx-target='#template-list-wrapper', hx-swap='outerHTML'"
             hx-trigger="input changed delay:300ms, search"
             hx-include="#template-filter-dialect, #template-filter-type"
             hx-indicator="#template-filter-spinner"
             class="ds-input app-search-input">
      <select id="template-filter-dialect" name="dialect" class="ds-input app-select-auto"
              th:attr="hx-get=@{/partials/templates}, hx-target='#template-list-wrapper', hx-swap='outerHTML'"
              hx-trigger="change"
              hx-include="#template-filter-q, #template-filter-type"
              hx-indicator="#template-filter-spinner">
        <option value="" th:selected="${#strings.isEmpty(selectedDialect)}">All Dialects</option>
        <option th:each="d : ${dialects}" th:value="${d}" th:text="${d}"
                th:selected="${d == selectedDialect}"></option>
      </select>
      <!-- 046 shipped `type` on the version row; it filters like `dialect` and joins it here. -->
      <select id="template-filter-type" name="type" class="ds-input app-select-auto"
              th:attr="hx-get=@{/partials/templates}, hx-target='#template-list-wrapper', hx-swap='outerHTML'"
              hx-trigger="change"
              hx-include="#template-filter-q, #template-filter-dialect"
              hx-indicator="#template-filter-spinner">
        <option value="" th:selected="${#strings.isEmpty(selectedType)}">All Types</option>
        <option th:each="ty : ${types}" th:value="${ty}" th:text="${ty}"
                th:selected="${ty == selectedType}"></option>
      </select>
      <span id="template-filter-spinner" class="htmx-indicator ds-spinner" aria-hidden="true"></span>
    </div>

    <!-- The two panes. The LEFT pane is a stable container around #template-list-wrapper —
         filters, the search pager and level swaps all replace INSIDE it, so the pane (and
         the RIGHT pane beside it) never move. The RIGHT pane is #template-detail: a leaf's
         selection swaps its innerHTML and nothing else — the whole point of the layout. -->
    <div class="tplx-body">
      <!-- The drawer's scrim (106 §B). Inert and display:none above 1100px; `hidden` is what
           the script toggles, so the closed state needs no inline style. -->
      <div class="tplx-drawer-backdrop" data-explorer-drawer-backdrop hidden></div>

      <div class="tplx-tree" id="template-tree-pane" data-explorer-pane>
        <!-- The fragment's own root carries id="template-list-wrapper" in BOTH presentations, so
             the swap target survives every refresh — this div is only a placeholder (§4.6). -->
        <div th:replace="~{partials/templates :: fragment}"></div>
      </div>

      <!-- 104 §C — the divider handle. It overlays `.tplx-detail`'s left border (the pane
           boundary) and replaces the pane's native `resize` corner, which sat at the bottom
           right where nobody found it: three rounds of "the tree is too narrow / too wide"
           were spent editing the stylesheet instead. Both explorers share one key, so the
           width follows the user between them. -->
      <div class="tplx-splitter" data-splitter="explorer-tree" role="separator"
           aria-orientation="vertical" tabindex="0" aria-label="Resize navigation tree"></div>

      <div class="tplx-detail">
        <!-- Nothing selected: a quiet empty state, not a blank panel. Replaced (innerHTML)
             the first time a leaf is selected, by /partials/templates/versions. The spinner
             lives here and in the detail header — exactly one of the two is in the DOM at
             any time, and it is what a selection's hx-indicator points at. -->
        <div id="template-detail" class="tplx-detail-empty-state">
          <p class="ds-empty-title">Select a template</p>
          <p class="ds-empty-description">Choose a template in the tree to see its versions.</p>
          <span class="htmx-indicator ds-spinner" id="template-detail-spinner" aria-hidden="true"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- CREATE (§9.3). `type` is a create-time input and appears on NO other form: it is
       immutable after creation (§5.3), so the edit screen shows it as a read-only value.
       `name` is likewise create-time only — §4.5 offers no rename, anywhere, so this modal
       is the only place a template name is ever typed. -->
  <!-- 114 §A — the modal rides the same guard as its opener: a viewer's page carries no
       create form at all, not a hidden one. -->
  <div th:if="${canAuthor}" id="create-template-modal" class="u-backdrop u-backdrop-hidden">
    <div class="ds-card app-modal app-modal-lg">
      <button class="ds-button ds-button-ghost ds-button-sm app-modal-close u-text-xl" onclick="hideCreateTemplateModal()"><svg class="ds-icon ds-icon-sm" aria-hidden="true" focusable="false"><use href="/vendor/icons/lucide-sprite.svg#x"></use></svg></button>
      <h2 class="ds-title u-m0 u-mb-md">Create Template</h2>
      <form th:attr="hx-post=@{/partials/templates}"
            hx-target="#template-create-result"
            hx-swap="innerHTML">
        <div class="u-mb-md">
          <label class="u-block u-secondary u-text-sm u-mb-xs">Name (path)</label>
          <!-- §9.5: `pattern` and `maxlength` are RENDERED FROM the server's own grammar
               (TemplateNameGrammar reads the validator's Regex and its length cap) — not a
               regex retyped beside it, which is the drift this project has been bitten by.
               The check is a convenience that saves a round-trip; the server validates every
               write regardless and its rejection is the one that counts. -->
          <input type="text" name="name" class="ds-input"
                 placeholder="acme/finance/monthly_revenue" required
                 th:attr="pattern=${namePattern}, maxlength=${nameMaxLength}, title=${nameHint}">
          <!-- 077: the folder is mandatory, and the `pattern` above already refuses a bare
               name because it is the server's own grammar. This line is what tells someone
               WHY the field went red before they have to read the full rule below it. -->
          <p class="u-muted u-text-xs u-m0 u-mt-xs">
            folder/name &mdash; e.g. <code>test/scratch</code>
          </p>
          <p class="u-muted u-text-xs u-m0 u-mt-xs"
             th:text="${nameHint}">grammar</p>
        </div>
        <div class="u-mb-md">
          <label class="u-block u-secondary u-text-sm u-mb-xs">Display name (optional)</label>
          <input type="text" name="displayName" class="ds-input" placeholder="Monthly Revenue">
        </div>
        <div class="u-flex u-gap-md u-mb-md">
          <div class="u-grow">
            <label class="u-block u-secondary u-text-sm u-mb-xs">Type</label>
            <select id="create-template-type" name="type" class="ds-input" required
                    onchange="syncTemplateDialect()">
              <option th:each="ty : ${types}" th:value="${ty}" th:text="${ty}"
                      th:selected="${ty == 'sql'}">sql</option>
            </select>
          </div>
          <!-- `dialect` is CONDITIONAL on type: required for `sql`, hidden AND removed from
               the submitted form for `html`. chk_type_dialect is the database's backstop and
               the controller drops the field for `html` regardless — the form is not the
               authority on that rule (§5.1). -->
          <div class="u-grow" id="create-template-dialect-field">
            <label class="u-block u-secondary u-text-sm u-mb-xs">Dialect</label>
            <select id="create-template-dialect" name="dialect" class="ds-input" required>
              <option th:each="d : ${dialects}" th:value="${d}" th:text="${d}">POSTGRES</option>
            </select>
          </div>
        </div>
        <div class="u-mb-md">
          <label class="u-block u-secondary u-text-sm u-mb-xs">Description</label>
          <input type="text" name="description" class="ds-input"
                 placeholder="What this template expects and produces" required>
        </div>
        <div class="u-mb-md">
          <label class="u-block u-secondary u-text-sm u-mb-xs">Body</label>
          <textarea name="body" class="ds-input app-template-body-input"
                    placeholder="SELECT 1" required></textarea>
        </div>
        <div id="template-create-result" class="u-mb-md"></div>
        <button type="submit" data-verb="template-create-submit" class="ds-button ds-button-primary u-full">Create</button>
      </form>
    </div>
  </div>

  <script>
    function showCreateTemplateModal() {
      document.getElementById('template-create-result').removeAttribute('data-error');
      document.getElementById('template-create-result').innerHTML = '';
      document.getElementById('create-template-modal').style.display = 'flex';
    }
    function hideCreateTemplateModal() {
      document.getElementById('create-template-modal').style.display = 'none';
    }
    /* §9.3: dialect is required for `sql` and ABSENT for `html`. `disabled` (not just hidden)
       is what keeps the field out of the submitted form data — a hidden-but-enabled select
       would still post a dialect for an html template. The server drops it either way. */
    function syncTemplateDialect() {
      // 114: a viewer's page carries no create modal, so these three nodes are absent.
      // Returning is the whole handling — there is no form to keep in sync.
      var type = document.getElementById('create-template-type');
      var field = document.getElementById('create-template-dialect-field');
      var select = document.getElementById('create-template-dialect');
      if (!type || !field || !select) return;
      var isSql = type.value === 'sql';
      field.hidden = !isSql;
      select.disabled = !isSql;
      select.required = isSql;
    }
    // 076 §D: arm immediately when this fragment arrives in a boosted swap
    // (DOMContentLoaded has long fired); wait for the parse only on a cold load.
    var initCreateTemplateModal = function() {
      syncTemplateDialect();
      var result = document.getElementById('template-create-result');
      if (!result) return;

      /* Refusals arrive as 4xx and htmx does not swap those. The modal must not close over an
         error and a 6s toast is the wrong place for form-level feedback (the 022 review F9
         rule), so this screen owns its error path: the refusal lands in the result node,
         tagged so the observer below does NOT close the modal over it. */
      document.body.addEventListener('htmx:responseError', function(event) {
        if (!event.detail.elt.closest || !event.detail.elt.closest('#create-template-modal')) return;
        result.setAttribute('data-error', 'true');
        result.innerHTML = event.detail.xhr.responseText;
      });
      document.body.addEventListener('htmx:beforeRequest', function(event) {
        if (!event.detail.elt.closest || !event.detail.elt.closest('#create-template-modal')) return;
        result.removeAttribute('data-error');
        result.innerHTML = '';
      });

      /* Close the modal only on SUCCESS content — never over an error. */
      var observer = new MutationObserver(function() {
        var modal = document.getElementById('create-template-modal');
        if (modal.style.display === 'flex' &&
            result.children.length > 0 &&
            result.getAttribute('data-error') !== 'true') {
          hideCreateTemplateModal();
        }
      });
      observer.observe(result, {childList: true, subtree: true});
    };
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initCreateTemplateModal);
    } else {
      initCreateTemplateModal();
    }
  </script>

  <!-- 102: the lifecycle dialogs' single per-screen container (§4.3d), the pipelines twin. -->
  <div id="tx-dialog"></div>
</th:block>
</html>
