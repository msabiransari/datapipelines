<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: page(~{::content})}">
<th:block th:fragment="content">
  <!-- #9 slice 2 — the Schedules page (ui-screens.md §4.20). The SHELL is server-rendered;
       every schedule read and write is a fetch to rest-api §20 from static/js/schedules/
       (the record's §6: the UI uses REST for every schedule operation, no partial route).

       The markup the scripts fill lives below as <template> skeletons, rendered HERE by
       Thymeleaf, so the verbs are decided by role on the server: a verb outside the viewer's
       role is not in the skeleton at all, and nothing the script does can draw it. The script
       fills text with textContent only — names, parameters, reasons and trail text are user
       data and never markup.

       Scripts: the explorer's shared layers first (the splitter parser-blocking, as on the
       other explorers — 104 §A), then the page's own, in dependency order. htmx re-inserts
       them with async=false on a boosted visit, so the order below is the execution order. -->
  <script th:src="@{/js/splitter.js}"></script>
  <script th:src="@{/js/template-explorer.js}" defer></script>
  <script th:src="@{/js/explorer-detail.js}" defer></script>
  <script th:src="@{/js/csrf.js}" defer></script>
  <script th:src="@{/js/schedules/model.js}" defer></script>
  <script th:src="@{/js/schedules/api.js}" defer></script>
  <script th:src="@{/js/schedules/dom.js}" defer></script>
  <script th:src="@{/js/schedules/explorer.js}" defer></script>
  <script th:src="@{/js/schedules/detail.js}" defer></script>
  <script th:src="@{/js/schedules/form.js}" defer></script>
  <script th:src="@{/js/schedules/page.js}" defer></script>

  <div class="tplx-page sch-page" data-schedules-root
       th:attr="data-can-author=${canAuthor == true},
                data-can-read-executions=${canReadExecutions == true},
                data-can-execute=${canExecute == true}">

    <!-- ONE grid child for the heading row (the `.tplx-page` three-row grid — pipelines/list.html). -->
    <div class="app-page-h">
      <div>
        <h1 class="ds-headline">Schedules</h1>
        <p class="app-page-sub">
          Run a pipeline on a timetable. A schedule fires as the system identity, never as the
          person who created it, and follows the pipeline's current version.
        </p>
      </div>
      <div class="app-page-actions">
        <!-- 106 §B: below 1100px the tree is a drawer; the stylesheet decides when this shows. -->
        <button type="button" class="ds-button ds-button-secondary tplx-browse"
                data-explorer-drawer-open aria-expanded="false" aria-controls="schedule-tree-pane">Browse</button>
        <button th:if="${canAuthor == true}" data-verb="schedule-create" type="button"
                class="ds-button ds-button-primary" data-sch-action="create">New schedule</button>
      </div>
    </div>

    <!-- Search: a flat list of full paths while the box holds text, the tree when it is empty
         (the explorers' browse-vs-search rule, §4.3). It matches every column the list
         renders — the name, the pipeline, the pattern and the condition (§5.1 Search). -->
    <div class="u-row-md tplx-search-row">
      <input type="search" id="schedule-filter-q" name="q" placeholder="Search schedules..."
             class="ds-input app-search-input" autocomplete="off" aria-controls="schedule-list">
    </div>

    <div class="tplx-body">
      <div class="tplx-drawer-backdrop" data-explorer-drawer-backdrop hidden></div>

      <div class="tplx-tree" id="schedule-tree-pane" data-explorer-pane>
        <!-- The root level. Loading state until the first §20.1 read answers. -->
        <div id="schedule-list" class="tpl-level" aria-busy="true" aria-live="polite">
          <div class="ds-skeleton ds-skeleton-table-row" aria-hidden="true"></div>
          <div class="ds-skeleton ds-skeleton-table-row" aria-hidden="true"></div>
          <div class="ds-skeleton ds-skeleton-table-row" aria-hidden="true"></div>
          <span class="u-hidden">Loading schedules…</span>
        </div>
      </div>

      <div class="tplx-splitter" data-splitter="explorer-tree" role="separator"
           aria-orientation="vertical" tabindex="0" aria-label="Resize navigation tree"></div>

      <div class="tplx-detail">
        <div id="schedule-detail" class="tplx-detail-empty-state" aria-live="polite">
          <p class="ds-empty-title">Select a schedule</p>
          <p class="ds-empty-description">Choose a schedule in the tree to see when it runs next and what its runs did.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- The page's ONE dialog container (the §4.3d idiom): the form, the delete confirm and a
       run's detail are cloned in here and removed on close. -->
  <div id="sch-dialog"></div>

  <th:block th:replace="~{schedules/explorer :: skeletons}"></th:block>
  <th:block th:replace="~{schedules/detail :: skeletons}"></th:block>
  <th:block th:replace="~{schedules/form :: skeletons}"></th:block>
</th:block>
</html>
