<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: page(~{::content})}">
<th:block th:fragment="content">
  <div class="app-page-h">
    <div>
      <h1 class="ds-headline">Executions</h1>
      <p class="app-page-sub">Every run in this workspace, newest first — what started it, how long it took
        and how many rows it returned.</p>
    </div>
  </div>

  <div class="ds-card u-mb-lg">
    <form id="execution-filters" hx-get="/partials/executions" hx-trigger="change from:select, submit" hx-target="#execution-table" hx-swap="innerHTML" class="app-filters">
      <div class="ds-field">
        <label class="ds-field-label" for="pipeline_id">Pipeline</label>
        <select id="pipeline_id" name="pipeline_id" class="ds-select app-filter-select">
          <option value="">All pipelines</option>
          <option th:each="p : ${pipelines}" th:value="${p.id}" th:text="${p.displayName}">Pipeline</option>
        </select>
      </div>
      <div class="ds-field">
        <label class="ds-field-label" for="status">Status</label>
        <select id="status" name="status" class="ds-select">
          <option value="">All statuses</option>
          <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.name()}">Status</option>
        </select>
      </div>
      <div class="ds-field">
        <label class="ds-field-label" for="started_after">After</label>
        <input type="date" id="started_after" name="started_after" class="ds-input app-filter-date">
      </div>
      <div class="ds-field">
        <label class="ds-field-label" for="started_before">Before</label>
        <input type="date" id="started_before" name="started_before" class="ds-input app-filter-date">
      </div>
      <div class="ds-field">
        <button type="submit" class="ds-button ds-button-primary">Filter</button>
      </div>
    </form>
  </div>

  <div id="execution-table" hx-get="/partials/executions" hx-trigger="load" hx-swap="innerHTML">
    <div class="u-center u-p-lg u-muted">
      <div class="ds-spinner u-mb-md"></div>
      <div class="u-text-sm">Loading executions…</div>
    </div>
  </div>
</th:block>
</html>
