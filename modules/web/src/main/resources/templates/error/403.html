<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: page(~{::content})}">
<th:block th:fragment="content">
  <div class="app-center" style="min-height: 60vh;">
    <div class="ds-card app-card-auth" style="text-align: center;">
      <h2 class="ds-headline" style="margin-bottom: var(--gap-sm);">403</h2>
      <h3 style="font-size: var(--text-lg); margin-bottom: var(--gap-md);">Access Denied</h3>
      <p style="color: var(--text-secondary); font-size: var(--text-sm); margin-bottom: var(--gap-lg);">
        You do not have permission to access this page.
      </p>
      <a th:href="@{/dashboard}" class="ds-button ds-button-secondary">Go to Dashboard</a>
    </div>
  </div>
</th:block>
</html>
