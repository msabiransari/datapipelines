<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: page(~{::content})}">
<th:block th:fragment="content">
  <div style="display: flex; align-items: center; justify-content: center; min-height: 60vh;">
    <div class="ds-card" style="max-width: 420px; width: 100%; text-align: center;">
      <h2 style="font-size: var(--text-3xl); font-weight: var(--weight-bold); margin-bottom: var(--gap-sm);">500</h2>
      <h3 style="font-size: var(--text-lg); margin-bottom: var(--gap-md);">Server Error</h3>
      <p style="color: var(--text-secondary); font-size: var(--text-sm); margin-bottom: var(--gap-md);">
        Something went wrong on our side.
      </p>
      <p th:if="${correlationId}" style="font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-muted); margin-bottom: var(--gap-lg);">
        Correlation ID: <th:block th:text="${correlationId}"/>
      </p>
      <a th:href="@{/}" class="ds-button ds-button-secondary">Go to Dashboard</a>
    </div>
  </div>
</th:block>
</html>
