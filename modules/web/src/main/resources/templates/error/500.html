<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: page(~{::content})}">
<th:block th:fragment="content">
  <div class="app-center u-modal-tall">
    <div class="ds-card app-card-auth u-center">
      <h2 class="ds-headline u-mb-sm">500</h2>
      <h3 class="u-text-lg u-mb-md">Server Error</h3>
      <p class="u-secondary u-text-sm u-mb-md">
        Something went wrong on our side.
      </p>
      <p th:if="${correlationId}" class="u-mono u-text-xs u-muted u-mb-lg">
        Correlation ID: <th:block th:text="${correlationId}"/>
      </p>
      <a th:href="@{/dashboard}" class="ds-button ds-button-secondary">Go to Dashboard</a>
    </div>
  </div>
</th:block>
</html>
