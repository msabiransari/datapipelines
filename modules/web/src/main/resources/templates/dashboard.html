<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: page(~{::content})}">
<th:block th:fragment="content">
  <div class="app-page-h">
    <div>
      <h1 class="ds-headline">Dashboard</h1>
      <p class="app-page-sub" th:text="${activeWorkspace != null} ? ${activeWorkspace} + ' · the last 24 hours' : 'The last 24 hours'">workspace · the last 24 hours</p>
    </div>
    <div class="app-page-actions">
      <a class="ds-button ds-button-secondary" th:href="@{/executions}">All executions</a>
    </div>
  </div>

  <!--
    The skeleton loaders (025 B2): each hx-get swaps itself for the real partial once
    loaded. This used to be a `th:replace` round trip through the partials' (children)
    fragment signatures — which emitted `children` unchanged AND made the partials
    unrenderable standalone (the 500 the hx-gets hit); the skeletons live here directly.
  -->
  <div class="ds-stats app-grid app-grid-3 u-mb-md" hx-get="/partials/dashboard-stats" hx-trigger="load" hx-swap="outerHTML">
    <div class="ds-skeleton ds-skeleton-card"></div>
    <div class="ds-skeleton ds-skeleton-card"></div>
    <div class="ds-skeleton ds-skeleton-card"></div>
  </div>

  <div class="ds-card app-card-table">
    <div class="app-card-h">
      <h2 class="ds-title">Recent executions</h2>
      <a class="u-text-sm" th:href="@{/executions}">View all <svg class="ds-icon ds-icon-xs" aria-hidden="true" focusable="false"><use href="/vendor/icons/lucide-sprite.svg#arrow-right"></use></svg></a>
    </div>
    <div class="ds-recent" hx-get="/partials/recent-executions" hx-trigger="load" hx-swap="outerHTML">
      <div class="app-card-b">
        <div class="ds-skeleton ds-skeleton-table-row"></div>
        <div class="ds-skeleton ds-skeleton-table-row"></div>
        <div class="ds-skeleton ds-skeleton-table-row"></div>
      </div>
    </div>
  </div>
</th:block>
</html>
