<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: page(~{::content})}">
<th:block th:fragment="content">
  <div class="app-reading">
  <div class="app-page-h">
    <div>
      <h1 class="ds-headline">Documentation</h1>
      <!-- 033: the docs ship in the jar — this index always matches the running version. -->
      <p class="app-page-sub">The operations manual and specifications for the version you are running.</p>
    </div>
    <!-- 127 §C: the docs screen's own route to the bug form — the same SitePages constant the
         avatar menu reads (via SiteOriginAdvice), a new tab, never boosted. -->
    <div class="app-page-actions">
      <a th:href="${reportProblemUrl}" target="_blank" rel="noopener" class="ds-button ds-button-secondary"><svg class="ds-icon ds-icon-sm" aria-hidden="true" focusable="false"><use href="/vendor/icons/lucide-sprite.svg#bug"></use></svg>Report a problem</a>
    </div>
  </div>

  <section th:each="group : ${groups}" class="u-mb-lg">
    <h2 class="ds-title u-mb-md"
        th:text="${group.name}">Group</h2>
    <div class="ds-card">
      <ul class="u-list-plain u-m0 u-p0">
        <li th:each="doc : ${group.docs}"
            class="u-py-sm u-divider-bottom">
          <a th:href="@{/docs/{slug}(slug=${doc.slug})}" th:text="${doc.title}">Doc</a>
        </li>
      </ul>
    </div>
  </section>
  </div>
</th:block>
</html>
