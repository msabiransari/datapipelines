<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: page(~{::content})}">
<th:block th:fragment="content">
  <div class="app-reading">
  <div class="app-page-h">
    <div>
      <h1 class="ds-headline">Documentation</h1>
      <!-- 033: the docs ship in the jar — this index always matches the running version. -->
      <p class="app-page-sub">The operations manual and specifications for the version you are running.</p>
    </div>
  </div>

  <section th:each="group : ${groups}" class="u-mb-lg">
    <h2 class="ds-title u-mb-md"
        th:text="${group.name}">Group</h2>
    <div class="ds-card">
      <ul class="u-list-plain u-m0 u-p0">
        <li th:each="doc : ${group.docs}"
            class="u-py-sm u-divider-bottom">
          <a th:href="@{/docs/{slug}(slug=${doc.slug})}" th:text="${doc.title}">Doc</a>
        </li>
      </ul>
    </div>
  </section>
  </div>
</th:block>
</html>
