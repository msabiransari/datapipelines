<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: page(~{::content})}">
<th:block th:fragment="content">
  <div style="display: flex; align-items: center; justify-content: center; min-height: 70vh;">
    <div class="ds-card" style="max-width: 420px; width: 100%; text-align: center;">
      <h1 style="font-size: var(--text-2xl); font-weight: var(--weight-bold); margin-bottom: var(--gap-xs);">datapipelines.co</h1>
      <p style="color: var(--text-secondary); font-size: var(--text-sm); margin-bottom: var(--gap-lg);">Sign in to continue</p>

      <th:block th:if="${error}">
        <div th:if="${#strings.equals(error, 'expired')}" style="background: var(--accent-warning-bg); color: var(--accent-warning); padding: var(--gap-sm); border-radius: var(--radius-base); margin-bottom: var(--gap-md); font-size: var(--text-sm);">
          Your login session has expired. Please try again.
        </div>
        <div th:if="${#strings.equals(error, 'domain_not_allowed')}" style="background: var(--accent-danger); color: var(--accent-danger-text); padding: var(--gap-sm); border-radius: var(--radius-base); margin-bottom: var(--gap-md); font-size: var(--text-sm);">
          Your email domain is not allowed.
        </div>
        <div th:if="${#strings.equals(error, 'inactive')}" style="background: var(--accent-danger); color: var(--accent-danger-text); padding: var(--gap-sm); border-radius: var(--radius-base); margin-bottom: var(--gap-md); font-size: var(--text-sm);">
          Your account is inactive. Please contact an administrator.
        </div>
        <div th:if="${#strings.equals(error, 'oidc_error')}" style="background: var(--accent-danger); color: var(--accent-danger-text); padding: var(--gap-sm); border-radius: var(--radius-base); margin-bottom: var(--gap-md); font-size: var(--text-sm);">
          Login failed. Please try again.
        </div>
      </th:block>

      <th:block th:each="provider : ${providers}">
        <a th:href="@{/oauth2/authorization/{id}(id=${provider.registrationId})}"
           class="ds-button ds-button-secondary"
           style="display: block; width: 100%; margin-bottom: var(--gap-sm); text-align: center; text-decoration: none;"
           th:text="${provider.displayName}">Provider Name</a>
      </th:block>
    </div>
  </div>
</th:block>
</html>
