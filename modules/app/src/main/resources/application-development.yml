# The `development` POSTURE (configuration.md §3.23, docs/environments.md).
#
# This file is loaded when `DATAPIPELINES_POSTURE=development` — which is also the
# shipped default, so it is the profile every deployment gets unless it asks for
# `hardened`. It replaces the old `dev` profile (039's `application-dev.yml`), and the
# difference is the whole of 075: the old file was a LAPTOP file (localhost:5434,
# console logging, one developer's ports). Those values are not a posture — an org's
# `dev` environment on Kubernetes is `development` posture and must not inherit one
# laptop's host ports. They moved to `deploy/env/defaults.env`, the one tracked settings
# file every loader reads.
#
# WHAT BELONGS HERE: the posture table's non-secret DEFAULTS, each written as a
# placeholder so an operator can still set it either way. Nothing else — no secrets
# (this file ships inside every production jar; the 2026-08-07 security review's
# HIGH-2 is why), no infrastructure, no org facts.
#
# AND NOWHERE ELSE (081). `deploy/env/defaults.env` must never name these two keys: it
# is loaded for every posture, so a value there is one posture's answer imposed on both.
# `deploy/compose.yml` passes them in Compose's valueless form so an unset variable stays
# unset and this file's default survives. `PostureDefaultsSpecDriftTest` and
# `compose-env-audit.sh` check 7 hold both halves of that.
#
# The `development` row of the posture table (environments.md):
#   authoring-enabled   true   — someone running one box authors there and runs there
#   demo                allowed
#   bootstrap password  allowed
#   loopback DB/Redis   allowed
#   cookie Secure       derived from base-url's scheme (an http:// base-url drops it)
#   OIDC                optional
datapipelines:
  deployment:
    authoring-enabled: ${DATAPIPELINES_DEPLOYMENT_AUTHORING_ENABLED:true}
  auth:
    # Empty = the base file's derivation from `base-url`'s scheme. Spelled out rather
    # than omitted so the two posture files read as one table with two columns.
    cookie-secure: ${DATAPIPELINES_AUTH_COOKIE_SECURE:}
