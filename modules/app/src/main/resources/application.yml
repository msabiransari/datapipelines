# Base configuration — reproduced from configuration.md §5, which is the ONLY
# place a configuration key is defined. Do not add a key here that does not
# appear there; add it there first (enforced by scripts/docs-audit.sh).

spring:
  application:
    name: datapipelines
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}

  # Spring Boot's Redis autoconfiguration reads `spring.data.redis.*`, while the
  # operator-facing contract is `datapipelines.redis.*` (configuration.md §2/§3.1).
  # This block is a BINDING, not a new configuration key: the only names an
  # operator ever sets are still DATAPIPELINES_REDIS_*.
  #
  # TODO(dag / web modules — module-structure.md §3.1 rule 3): replace this bridge
  #  with an explicit LettuceConnectionFactory built from a
  #  @ConfigurationProperties("datapipelines.redis") class owned by the module that
  #  actually talks to Redis, and drop this block.
  data:
    redis:
      host: ${DATAPIPELINES_REDIS_HOST}
      port: ${DATAPIPELINES_REDIS_PORT:6379}
      password: ${DATAPIPELINES_REDIS_PASSWORD:}

  # Flyway runs on startup against the metadata DB. Migrations live only in this
  # module (module-structure.md §3.1 rule 2); the DDL authority is metadata-db.md §4.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  # Spring Boot's own framework wiring key (like `management.server.port` above — not a
  # datapipelines.* configuration key). Graceful web shutdown (deployment.md §8.3.1): on
  # SIGTERM the web server stops accepting new requests and lets in-flight ones end instead
  # of cutting them off. The execution drain itself is ExecutionDrainLifecycle, which stops
  # FIRST (higher SmartLifecycle phase), so cancellations flush while the server is still up.
  shutdown: graceful

# Actuator: the HealthEndpoint bean backs the root-level /health, /ready and /info
# controllers (observability.md §6). NO /actuator path is reachable on the
# application port (§6.4); /actuator/prometheus arrives later on the SEPARATE
# management port (§4.2), never here.
management:
  # SEPARATE MANAGEMENT PORT (observability.md §4.2). This is the mechanism that
  # keeps /actuator off the application port, and it is not interchangeable with
  # tuning `exposure`. Two non-obvious facts learned the hard way here:
  #   1. An empty/omitted `exposure.include` does NOT mean "expose nothing" —
  #      Spring Boot falls back to its default include set (`health`), so
  #      /actuator/health answered 200 on the app port.
  #   2. `exposure.exclude: "*"` does close the HTTP surface, but it ALSO deletes
  #      the HealthEndpoint bean: @ConditionalOnAvailableEndpoint keys off
  #      exposure, so the endpoint HealthController depends on disappears and the
  #      context fails to start.
  # Moving management to its own port satisfies both — the bean exists, and
  # nothing under /actuator is routable on the application port.
  # `management.server.port` is Spring Boot's own framework wiring key;
  # datapipelines defines no key of its own for it (observability.md §4.2).
  # ApplicationSmokeTest's "no actuator endpoint is reachable" case guards this.
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
    # LOOPBACK BY DEFAULT (configuration.md §3.14). Without this, the management
    # port binds 0.0.0.0 and /actuator/health is reachable from anywhere that can
    # route to the host — an unauthenticated surface, silently public, on a port
    # nobody thinks to firewall because it isn't the application port. Nothing in
    # the test suite can catch that regression: the smoke test sets port 0, so it
    # exercises the port but never the bind address. This line is the control.
    # Kubernetes scraping (scraper → pod IP) needs 0.0.0.0 EXPLICITLY, paired with
    # a NetworkPolicy limiting the port to the monitoring namespace
    # (deployment.md §9). Explicit opt-open, never default-open.
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        # On the management port only, reachable from the cluster-internal network.
        # /actuator/prometheus joins this list with the metrics registry.
        include: "health"
  health:
    # observability.md §6.1: nothing in this architecture writes to local disk, so
    # a disk-space signal would restart a perfectly healthy pod.
    diskspace:
      enabled: false

datapipelines:
  redis:
    host: ${DATAPIPELINES_REDIS_HOST}
    port: ${DATAPIPELINES_REDIS_PORT:6379}
    password: ${DATAPIPELINES_REDIS_PASSWORD:}

  jwt:
    secret: ${DATAPIPELINES_JWT_SECRET}

  db:
    # §3.20 — which KeyProvider supplies the credential data keys (datasources.md §7.1).
    # `env` is the default and is today's behaviour: keys come from the config values below.
    # Other providers (aws-kms, …) are implemented from docs/key-providers.md; an unknown
    # name is refused at boot by ConfigValidator §7.
    key-provider: ${DATAPIPELINES_DB_KEY_PROVIDER:env}
    # §2/§3.20 — the `env` provider's key. Required, base64 of exactly 32 bytes, and it is
    # KEY VERSION 1 forever: every credential written under it carries 0x01 as its first byte.
    encryption-key: ${DATAPIPELINES_DB_ENCRYPTION_KEY}
    # §3.20 — rotation, deliberately UNSET here. Adding `encryption-keys: {2: ${VAR}}` plus
    # `encryption-key-current: 2` starts writing new credentials under version 2 while every
    # version-1 row keeps decrypting; see datasources.md §7.3 for when version 1 can be
    # retired. Declaring an empty map here instead would bind an empty map over any
    # environment-supplied one, so the keys are absent, not blank.

  auth:
    # §3.4 — the deployment's exact external origin; OIDC redirect URIs are built
    # absolutely from it (auth.md §5.2). Startup fails when unset while providers are
    # configured (OidcConfig + ConfigValidator §7). Empty default = unset.
    base-url: ${DATAPIPELINES_AUTH_BASE_URL:}
    # §3.4 — optional; empty = no bootstrap admin (auth.md §4.4).
    bootstrap-admin-email: ${DATAPIPELINES_AUTH_BOOTSTRAP_ADMIN_EMAIL:}
    oidc:
      providers:
        # client-id/client-secret default to EMPTY: an unset entry is ignored with a
        # WARN (OidcConfig, configuration.md §7), so a local-accounts-only deployment
        # starts with zero OIDC providers. Set the vars to enable the provider.
        - name: google
          client-id: ${GOOGLE_CLIENT_ID:}
          client-secret: ${GOOGLE_CLIENT_SECRET:}
          issuer-uri: https://accounts.google.com
          display-name: "Sign in with Google"
        # Microsoft (Entra ID) — SINGLE-TENANT only in v1 (auth.md §11.1): the
        # issuer-uri MUST name your tenant, because the multi-tenant `/common`
        # endpoint cannot work via OIDC discovery — its metadata carries the
        # `{tenantid}` template, which Nimbus (Spring's discovery client) refuses.
        # Uncomment and set MICROSOFT_CLIENT_ID / MICROSOFT_CLIENT_SECRET to enable:
        # - name: microsoft
        #   client-id: ${MICROSOFT_CLIENT_ID}
        #   client-secret: ${MICROSOFT_CLIENT_SECRET}
        #   issuer-uri: https://login.microsoftonline.com/{tenant-id}/v2.0
        #   display-name: "Sign in with Microsoft"
        # Add more providers as needed (Okta, Auth0, Keycloak, etc.)
    jwt:
      ttl-hours: ${DATAPIPELINES_AUTH_JWT_TTL_HOURS:8}
    allowlist:
      domains: ${DATAPIPELINES_AUTH_ALLOWLIST_DOMAINS:}
    api-keys:
      cache-ttl-seconds: ${DATAPIPELINES_AUTH_API_KEYS_CACHE_TTL_SECONDS:60}
      default-scopes: ${DATAPIPELINES_AUTH_API_KEYS_DEFAULT_SCOPES:read}
    rate-limit:
      login-per-minute: ${DATAPIPELINES_AUTH_RATE_LIMIT_LOGIN_PER_MINUTE:10}
    # §3.4 / deployment.md §6.2 — CIDRs of proxies whose X-Forwarded-For names the real
    # client (the login limiter and every audit source_ip key on it). EMPTY DEFAULT:
    # the header is ignored entirely and the direct peer is the client, exactly as
    # before the key existed. Each entry must parse as a CIDR (a bare IP is a host
    # CIDR) or startup is refused (ClientAddressResolver construction).
    trusted-proxies: ${DATAPIPELINES_AUTH_TRUSTED_PROXIES:}
    # §3.4 — optional local password accounts (auth.md §5A), disabled by default.
    # The seed keys configure the FIRST ADMIN's initial credential ONLY (the
    # bootstrap-admin-email account) and force a first-login change; the hash form
    # is preferred (produce one with the `hashPassword` Gradle task, §3.4).
    local:
      enabled: ${DATAPIPELINES_AUTH_LOCAL_ENABLED:false}
      bootstrap-password-hash: ${DATAPIPELINES_AUTH_LOCAL_BOOTSTRAP_PASSWORD_HASH:}
      bootstrap-password: ${DATAPIPELINES_AUTH_LOCAL_BOOTSTRAP_PASSWORD:}
      lockout:
        max-failures: ${DATAPIPELINES_AUTH_LOCAL_LOCKOUT_MAX_FAILURES:5}
        duration-minutes: ${DATAPIPELINES_AUTH_LOCAL_LOCKOUT_DURATION_MINUTES:15}

  executor:
    max-parallel-nodes: ${DATAPIPELINES_EXECUTOR_MAX_PARALLEL_NODES:4}
    max-concurrent-executions-per-user: ${DATAPIPELINES_EXECUTOR_MAX_CONCURRENT_EXECUTIONS_PER_USER:10}
    # Per-INSTANCE ceiling (050/R2): N replicas admit N × this. The deprecated alias
    # `max-concurrent-executions-global` is deliberately NOT here — defining it would pin the
    # alias set on every deployment and defeat the §7 "alias alone → WARN" detection; an
    # operator who still sets the old key (or its env var) binds it through relaxed binding.
    max-concurrent-executions-per-instance: ${DATAPIPELINES_EXECUTOR_MAX_CONCURRENT_EXECUTIONS_PER_INSTANCE:100}
    node-query-timeout-seconds: ${DATAPIPELINES_EXECUTOR_NODE_QUERY_TIMEOUT_SECONDS:60}
    execution-timeout-seconds: ${DATAPIPELINES_EXECUTOR_EXECUTION_TIMEOUT_SECONDS:600}

  pipelines:
    max-composition-depth: ${DATAPIPELINES_PIPELINES_MAX_COMPOSITION_DEPTH:5}

  # §3.19 — the deployment-role settings (versioning §5.5). `name` is a LABEL only —
  # nothing branches on it (pinned by DeploymentNameBranchingGuardTest); it is logged
  # once at boot beside the authoring state and is deliberately NOT on /info.
  # `authoring-enabled` is the capability: default ON, because someone running one box
  # authors there and runs there; false turns this deployment into a promotion receiver
  # whose pipeline/template authoring writes (create, update/draft, release, discard,
  # delete) refuse with `*.authoring.disabled`. Reads, execution and import are
  # unaffected. Startup REFUSES when authoring is disabled while drafts still exist (§7).
  # The `promotion` sub-block (versioning §10.6, shipped by 055) is the deployment-to-
  # deployment channel, and BOTH halves default to empty:
  #   - `server-key` is the RECEIVER's. Empty means promotion is REFUSED — a deployment
  #     that never configured a key must not silently accept pushes (fail closed).
  #   - `target.*` is the SENDER's: exactly one higher environment (§10), its base URL and
  #     the SAME secret. A base-url without a key refuses startup (§7).
  # Both keys are bearer secrets: never logged, never in an error message, compared in
  # constant time. A deployment may hold either half, both, or neither.
  deployment:
    name: ${DATAPIPELINES_DEPLOYMENT_NAME:}
    authoring-enabled: ${DATAPIPELINES_DEPLOYMENT_AUTHORING_ENABLED:true}
    promotion:
      server-key: ${DATAPIPELINES_DEPLOYMENT_PROMOTION_SERVER_KEY:}
      target:
        base-url: ${DATAPIPELINES_DEPLOYMENT_PROMOTION_TARGET_URL:}
        server-key: ${DATAPIPELINES_DEPLOYMENT_PROMOTION_TARGET_KEY:}

  # §3.17 — workspace provisioning (design 2026-08-16-workspaces §7). `auto-per-user`
  # mints a personal workspace on first OIDC login; `self-serve` lets any authenticated
  # user create workspaces; `closed` is admin-only creation.
  workspaces:
    provisioning-mode: ${DATAPIPELINES_WORKSPACES_PROVISIONING_MODE:self-serve}
    open-join: ${DATAPIPELINES_WORKSPACES_OPEN_JOIN:false}
    member-datasources-enabled: ${DATAPIPELINES_WORKSPACES_MEMBER_DATASOURCES_ENABLED:true}

  staging:
    h2:
      mode: ${DATAPIPELINES_STAGING_H2_MODE:PostgreSQL}
      max-memory-mb: ${DATAPIPELINES_STAGING_H2_MAX_MEMORY_MB:1024}
      insert-batch-size: ${DATAPIPELINES_STAGING_H2_INSERT_BATCH_SIZE:1000}
      result-batch-size: ${DATAPIPELINES_STAGING_H2_RESULT_BATCH_SIZE:10000}
      query-timeout-seconds: ${DATAPIPELINES_STAGING_H2_QUERY_TIMEOUT_SECONDS:60}

  result:
    ttl-default-seconds: ${DATAPIPELINES_RESULT_TTL_DEFAULT_SECONDS:300}
    ttl-min-seconds: ${DATAPIPELINES_RESULT_TTL_MIN_SECONDS:60}
    ttl-max-seconds: ${DATAPIPELINES_RESULT_TTL_MAX_SECONDS:3600}
    max-size-bytes: ${DATAPIPELINES_RESULT_MAX_SIZE_BYTES:104857600}
    page-size-rows: ${DATAPIPELINES_RESULT_PAGE_SIZE_ROWS:1000}
    page-max-rows: ${DATAPIPELINES_RESULT_PAGE_MAX_ROWS:100000}

  sse:
    heartbeat-interval-seconds: ${DATAPIPELINES_SSE_HEARTBEAT_INTERVAL_SECONDS:15}
    disconnect-grace-seconds: ${DATAPIPELINES_SSE_DISCONNECT_GRACE_SECONDS:30}
    max-streams-per-user: ${DATAPIPELINES_SSE_MAX_STREAMS_PER_USER:50}

  rate-limit:
    requests-per-second: ${DATAPIPELINES_RATE_LIMIT_REQUESTS_PER_SECOND:100}
    requests-per-minute: ${DATAPIPELINES_RATE_LIMIT_REQUESTS_PER_MINUTE:1000}

  idempotency:
    ttl-seconds: ${DATAPIPELINES_IDEMPOTENCY_TTL_SECONDS:86400}

  templates:
    cache-size: ${DATAPIPELINES_TEMPLATES_CACHE_SIZE:500}
    render-timeout-ms: ${DATAPIPELINES_TEMPLATES_RENDER_TIMEOUT_MS:5000}
    max-body-chars: ${DATAPIPELINES_TEMPLATES_MAX_BODY_CHARS:262144}

  ui:
    theme: ${DATAPIPELINES_UI_THEME:saas}

  executions:
    event-retention-days: ${DATAPIPELINES_EXECUTIONS_EVENT_RETENTION_DAYS:7}
    stale-timeout-minutes: ${DATAPIPELINES_EXECUTIONS_STALE_TIMEOUT_MINUTES:60}
    # 057/T85: `full` carries the exception chain + rendered SQL on every failure surface;
    # `structured` omits both. A YAML 1.1 bare `off`/`no` trap does not apply — the values are
    # `full`|`structured`, never boolean words.
    error-detail: ${DATAPIPELINES_EXECUTIONS_ERROR_DETAIL:full}

  audit:
    retention-days: ${DATAPIPELINES_AUDIT_RETENTION_DAYS:365}

  observability:
    tracing:
      enabled: ${DATAPIPELINES_OBSERVABILITY_TRACING_ENABLED:false}
    logging:
      format: ${DATAPIPELINES_OBSERVABILITY_LOGGING_FORMAT:json}

  # Bootstrap content (configuration.md §3.18). Both are container-filesystem PATHS and both
  # are OFF when empty — there is no separate enable flag. `datasources-file` additionally
  # requires datapipelines.auth.bootstrap-admin-email (the actor its rows are created_by);
  # ConfigValidator refuses startup when one is set without the other.
  bootstrap:
    datasources-file: ${DATAPIPELINES_BOOTSTRAP_DATASOURCES_FILE:}
    examples-file: ${DATAPIPELINES_BOOTSTRAP_EXAMPLES_FILE:}
