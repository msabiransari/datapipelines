# The E2E module's contexts run the scheduler in API MODE by default (#9; configuration.md §3.29).
#
# Every suite boots its own cached context against ONE shared Postgres (SharedE2e), each with its
# own random credential key. A dispatching scheduler in each of them would let any context's worker
# pick up another suite's scheduled run - and fail to decrypt its datasource - and a suite's
# E2eClean TRUNCATE of scheduled_tasks would silently delete the recurring dispatcher rows every
# already-started context relies on. So nothing dispatches here unless a suite says so: the
# scheduler suites set datapipelines.scheduler.enabled=true through @DynamicPropertySource, which
# outranks this file. Every other context still serves the schedule routes (the role walk walks
# them), which is API mode exercised across the whole module.
datapipelines.scheduler.enabled=false
