# scripts/sample-data-lake/sources.lock — the pins that make the published dp-lake
# artifact rebuildable. Same format and the same discipline as
# ../sample-data/sources.lock (sample-data design D8, §4.1); read by the SAME
# machinery (../sample-data/lib/common.sh — the trade family's arrangement).
#
# FORMAT — space-separated, three or more fields, `#` comments:
#   param  <key>   <value>          human-declared build input (the window, the
#                                   sampling modulus, the tool versions). Editing
#                                   one of these changes the ARTIFACT, so it is a
#                                   reviewed change and the version directory must
#                                   be bumped (version dirs are immutable).
#   url    <id>    <url>            the exact source URL for logical source <id>
#   sha256 <id>    <hash>           the pinned SHA-256 of that file, verified after
#                                   download. `PENDING` = not yet pinned; pin.sh
#                                   fills it and download.sh refuses to treat a
#                                   PENDING source as verified.
#   tool   <n>-<p> <ver> <url> <sha256>   a pinned build binary, per platform
#
# Regenerate the derived lines with `./scripts/sample-data-lake/pin.sh` — never by
# hand, and never as a reflex when a build fails a checksum: a mismatch means the
# upstream file CHANGED, which changes what we publish.
#
# There are no `unpinned:` sources here and no `window` content pins: every TLC
# monthly Parquet is an immutable published file, so the file-level SHA is the
# honest pin. (The mobility family needs the content-pin machinery only for NOAA,
# which regenerates its CSVs nightly.)
#
# LICENCE EVIDENCE (design §8 — the go-live gate). Every claim below is a research
# claim recorded for the owner to verify; this build verifies none of them and
# manifest.json therefore ships `license_verified: null` for all of them.
# The dossier of record — every page re-fetched 2026-09-07, every operative
# sentence quoted verbatim, including the ONE difference from the yellow-taxi
# position (HVFHV carries its own accuracy disclaimer) — is
#   ../datapipelines-orchestration/notes/2026-09-07-lake-license-dossier.md
# Evidence links:
#   NYC TLC trip records (the page that publishes the HVFHV monthly Parquet)
#     https://www.nyc.gov/site/tlc/about/tlc-trip-record-data.page
#   High Volume FHV data dictionary (the hvfhs_license_num -> company mapping)
#     https://www.nyc.gov/assets/tlc/downloads/pdf/data_dictionary_trip_records_hvfhs.pdf
#   NYC Open Data — the programme the datasets belong to, and its grant
#     https://data.cityofnewyork.us/browse?Data-Collection_Data-Collection=TLC%20Trip%20Data
#     https://opendata.cityofnewyork.us/faq/
#     https://opendata.cityofnewyork.us/overview/
#   NYC.gov site-wide terms (incorporated by the Open Data terms)
#     https://www.nyc.gov/home/terms-of-use.page

# --- build inputs (human-declared) -----------------------------------------

param window_start           2023-01
param window_end             2024-12
param trips_sample_modulus   16
param duckdb_version         v1.5.5
param pyiceberg_version      0.12.0
param artifact_version       v1
param bucket_uri             s3://datapipelines-co/sample-data/lake
# The design §8 go-live gate: set ONLY by the owner after checking every source's
# CURRENT terms (dossier above). Absent or "null" = manifest ships
# license_verified: null and publishing blocks go-live. The 088 lane deliberately
# leaves it null: research is not a stamp.
param license_verified       null

# --- derived pins (regenerate with pin.sh) ---------------------------------

