# scripts/sample-data-trade/sources.lock — the pins that make the published
# trade/v1 artifact rebuildable. Mirrors ../sample-data/sources.lock (design
# D8, §4.1 stage 1 of the 2026-08-16 sample-data design; this family follows
# the same contract).
#
# FORMAT — identical to ../sample-data/sources.lock:
#   param  <key>   <value>          human-declared build input. Editing one
#                                   changes the ARTIFACT → bump the version
#                                   directory.
#   url    <id>    <url>            exact source URL for logical source <id>.
#                                   NEVER includes an API key — the key is
#                                   supplied via CENSUS_API_KEY at download
#                                   time and never persisted here.
#   sha256 <id>    <hash>           pinned SHA-256 of the DOWNLOADED FILE.
#                                   For the two living APIs (Census, Comtrade)
#                                   the pinned file is the MERGED CANONICAL
#                                   EXTRACT built by download.sh — the same
#                                   content-pin idea as the NOAA `window` pins:
#                                   upstream may append/revise, what must not
#                                   change is the extract this build takes.
#   tool   <n>-<p> <ver> <url> <sha256>   pinned build binary, per platform
#   image  <name>  <ref>            pinned container image (tag @ digest)
#
# LICENSE EVIDENCE (the design §8 go-live gate; verified by the owner, not by
# this build — manifest ships license_verified: null until the owner stamps it):
#   US Census Bureau International Trade API + datasets
#     https://www.census.gov/data/developers/about/terms-of-service.html
#     https://www.census.gov/foreign-trade/
#   UN Comtrade (preview API; terms of use)
#     https://comtradeplus.un.org/Help/Index
#   Binance public market data (data.binance.vision)
#     https://data.binance.vision/  (+ github.com/binance/binance-public-data
#     for format notes)

# --- build inputs (human-declared) -----------------------------------------

param window_start           2023-01
param window_end             2024-12
# Top-15 US trading partners by 2024 total goods trade (imports GEN_VAL_YR +
# exports ALL_VAL_YR, derived mechanically from the Census enduse endpoints
# on 2026-09-04 — see trade design doc; aggregates like EU/APEC excluded).
param census_partners        2010,1220,5700,4280,5880,5800,5830,5520,4120,5330,4210,4190,4759,4279,3510
# Comtrade reconciliation slice: reporters whose world-reported flows with the
# USA we keep (annual, HS-2 grain). ISO 3166-1 numeric codes — Germany is 276
# (an earlier draft carried 576 here, which is not Germany; the empty German
# responses were the tell).
param comtrade_reporters     156,124,484,392,276
param binance_symbols        BTCUSDT,ETHUSDT
param duckdb_version         v1.5.5
param artifact_version       v1
# The design §8 go-live gate: set ONLY by the owner after checking every
# source's CURRENT terms. Absent = manifest ships license_verified: null and
# publishing blocks go-live.
param license_verified       null

# --- derived pins (regenerate with pin.sh) ---------------------------------
# Written after the first successful download; see pin.sh.

# Census merged canonical extracts (living APIs — annual April revisions are
# exactly the drift these SHAs must catch).
# url/sha256 census-imports.json   <filled by pin.sh>
# url/sha256 census-exports.json   <filled by pin.sh>
# url/sha256 comtrade-flows.json   <filled by pin.sh>

# Binance monthly 1h-kline zips (immutable once published; per-file pins like
# the TLC Parquet pins).
# url/sha256 binance-<SYM>-<YYYY-MM>.zip   <filled by pin.sh>

# DuckDB CLI — BUILD-TIME ETL AND a runtime artifact here: unlike the mobility
# family (design D2 dropped DuckDB as a runtime dialect), trade/v1 ships a
# .duckdb FILE as the DUCKDB-engine datasource artifact. Same pinned CLI
# builds it; the pinned JDBC driver in the product (org.duckdb:duckdb_jdbc
# 1.5.5.1, ships in core, MIT) reads it.
tool   duckdb-osx-universal         v1.5.5 https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-osx-universal.zip 7a4bc3a93f7f92f5b40cd09c21afaf98e415c6cb9d9170064993782e779f4115
tool   duckdb-linux-amd64           v1.5.5 https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip 08c0ca1171116fcede14239d0093792352befdc174218c344d232c13279643d05
tool   duckdb-linux-arm64           v1.5.5 https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-arm64.zip 02163197042a42149147364d31fa67cac82108517a4be43304a1cc226eaef07a

# Throwaway build engine for the MySQL artifact.
image  mysql                        mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb

url    census-imports   https://api.census.gov/data/timeseries/intltrade/imports/hs?get=CTY_CODE,CTY_NAME,I_COMMODITY,I_COMMODITY_LDESC,GEN_VAL_MO&time=2023-01..2024-12&CTY_CODE=<census_partners> (per partner-month calls merged; key appended at download)
sha256 census-imports   2d3709e79df260b9b46c6276a8854a53b3cefbf23e0e685ae79de964bab058ac

url    census-exports   https://api.census.gov/data/timeseries/intltrade/exports/hs?get=CTY_CODE,CTY_NAME,E_COMMODITY,E_COMMODITY_LDESC,ALL_VAL_MO&time=2023-01..2024-12&CTY_CODE=<census_partners> (per partner-month calls merged; key appended at download)
sha256 census-exports   6f3b7a8a2b6e48f6059a1427259a6019dd3f28cd6ca48b16971c56231c4254a3

url    comtrade-flows   https://comtradeapi.un.org/public/v1/preview/C/A/HS?reporterCode=<comtrade_reporters>&period=2022..2024&partnerCode=842&flowCode=X|M&cmdCode=TOTAL (per reporter-year-flow calls merged)
sha256 comtrade-flows   89ee228e9dbc08372932f5570dbef4f5dfd933bcf51cc07fd3c58ff7837b3693

