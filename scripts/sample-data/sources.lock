# scripts/sample-data/sources.lock — the pins that make the published artifact
# rebuildable (sample-data design D8, §4.1 stage 1).
#
# FORMAT — space-separated, three or more fields, `#` comments:
#   param  <key>   <value>          human-declared build input (the window, the
#                                   sampling modulus, the station set). Editing
#                                   one of these changes the ARTIFACT, so it is
#                                   a reviewed change and the version directory
#                                   must be bumped (§4: version dirs are immutable).
#   url    <id>    <url>            the exact source URL for logical source <id>
#   sha256 <id>    <hash>           the pinned SHA-256 of that file, verified
#                                   after download; or `unpinned:<token>` for a
#                                   source whose upstream file is genuinely not
#                                   immutable — every such token is explained below.
#   window <id>    <hash>           CONTENT pin for an `unpinned:` source: the
#                                   SHA-256 of the canonical extract this build
#                                   takes out of it. Upstream may append; if it
#                                   REVISES history, this fails loudly.
#   tool   <n>-<p> <ver> <url> <sha256>   a pinned build binary, per platform
#   image  <name>  <ref>            a pinned container image (tag @ digest)
#
# Regenerate the derived lines with `./scripts/sample-data/pin.sh` — never by
# hand, and never as a reflex when a build fails a checksum: a mismatch means
# the upstream file CHANGED, which changes what we publish.
#
# LICENSE EVIDENCE (design §8 — the go-live gate). Every claim below is a
# research claim recorded for the owner to verify; this build verifies none of
# them and manifest.json therefore ships `license_verified: null` for all of
# them. Evidence links:
#   TLC trip records + zone lookup + data dictionary
#     https://www.nyc.gov/site/tlc/about/tlc-trip-record-data.page
#     https://www.nyc.gov/home/terms-of-use.page
#   NOAA GHCN-Daily (US Government work; NCEI use policy)
#     https://www.ncei.noaa.gov/products/land-based-station/global-historical-climatology-network-daily
#     https://www.noaa.gov/information-technology/open-data-dissemination
#   OPM federal holidays (facts; published schedule)
#     https://www.opm.gov/policy-data-oversight/pay-leave/federal-holidays/

# --- build inputs (human-declared) -----------------------------------------

