# NOAA GHCN-Daily, per-station Daily Summaries.
#
# DELIBERATELY UNPINNED FILE (unpinned:appended-daily). NCEI regenerates
# every access/ CSV nightly to append new observations — its Last-Modified
# is always yesterday — and NCEI publishes no dated snapshot of this
# product (the only archive/ asset is 'daily-summaries-latest.tar.gz').
# A file-level SHA would therefore fail every single day for a reason that
# is not drift, which trains everyone to re-pin on sight — the exact habit
# the pin exists to prevent.
#
# The determinism claim is kept at the level that actually matters: the
# `window` lines below pin the SHA-256 of the CANONICAL EXTRACT this build
# takes — the pinned elements, for the pinned station, inside the pinned
# date window, sorted, formatted by transform.sh's ghcn_extract query.
# Appended future days do not touch it; a REVISION of historical
# observations (NCEI does re-issue QC'd values) fails the build loudly,
# which is the event worth failing on.
url    noaa-ghcn-USW00094728.csv    https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/USW00094728.csv
sha256 noaa-ghcn-USW00094728.csv    unpinned:appended-daily
url    noaa-ghcn-USW00014732.csv    https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/USW00014732.csv
sha256 noaa-ghcn-USW00014732.csv    unpinned:appended-daily
url    noaa-ghcn-USW00094789.csv    https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/USW00094789.csv
sha256 noaa-ghcn-USW00094789.csv    unpinned:appended-daily
url    noaa-ghcn-USW00014734.csv    https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/USW00014734.csv
sha256 noaa-ghcn-USW00014734.csv    unpinned:appended-daily
url    noaa-ghcn-USW00094741.csv    https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/USW00094741.csv
sha256 noaa-ghcn-USW00094741.csv    unpinned:appended-daily
#
# GHCN station metadata. The per-station Daily Summaries CSVs carry EMPTY
# LATITUDE/LONGITUDE/ELEVATION/NAME columns (verified against the files, not
# assumed from the header), so the station table comes from the fixed-width
# master list. Regenerated nightly like everything else under this product,
# hence the same unpinned-file + content-pin treatment.
url    ghcnd-stations.txt           https://www.ncei.noaa.gov/pub/data/ghcn/daily/ghcnd-stations.txt
sha256 ghcnd-stations.txt           unpinned:appended-daily
#
