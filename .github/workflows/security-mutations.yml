# Security mutations (#217 slice A; security-assurance record §9 as ratified B6) — weekly and by
# hand, NEVER per PR or push.
#
# scripts/security-mutations/run.sh applies each of the ten curated defects (a literal sed pair in
# one production file), demands its ONE named test RED, reverts, demands the tree byte-identical and
# the test GREEN. A mutation its class does not detect fails the run ("mutation NN not detected").
# The runner refuses anything but a disposable checkout (a path under .claude/worktrees/, not main,
# a clean tree), so the job makes one: a detached worktree of the commit under test.
#
# Why a workflow of its own rather than a job in ci.yml: a `schedule` trigger there would also run
# `gate`, `integration` and `cold-verify` every week, and ci.yml's cancel-in-progress concurrency
# group (ci-<ref>) would let a scheduled run cancel a push run on main. This file shares neither.
#
# Two of the ten (06, 08) are Testcontainers suites, so the runner's Docker daemon is used. Budget:
# ~3 minutes on the dev box (2026-09-24), an estimated 20–40 on the 2-vCPU runner.

name: security-mutations

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC
  workflow_dispatch:

concurrency:
  group: security-mutations
  cancel-in-progress: false

# Read-only: the job edits its own disposable worktree and uploads a report, nothing else.
permissions:
  contents: read

jobs:
  mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # Size Gradle for THIS runner (2 vCPU / 7 GB), exactly as ci.yml does (DEVELOPMENT.md §9.5).
      - name: size Gradle for the runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.workers.max=2
          org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
          kotlin.daemon.jvmargs=-Xmx2g
          dp.test.forks=1
          dp.test.forks.e2e=1
          dp.test.heap=1g
          EOF
      - name: every pinned test image still exists at its registry (cold — never the cache)
        run: ./scripts/verify-image-pins.sh
      - name: a disposable worktree of the commit under test (run.sh refuses anything else)
        run: git worktree add --detach .claude/worktrees/mutations HEAD
      - name: the runner fails a mutation no test detects (its self-check)
        working-directory: .claude/worktrees/mutations
        env:
          MUTATION_OUT: ${{ github.workspace }}/mutation-report/self-check
        run: ./scripts/security-mutations/run.sh --self-check
      - name: the ten mutations — each red on its named test, then green after the revert
        working-directory: .claude/worktrees/mutations
        env:
          MUTATION_OUT: ${{ github.workspace }}/mutation-report/mutations
        run: ./scripts/security-mutations/run.sh
      - name: keep the mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-mutations
          path: mutation-report/
          retention-days: 30
          if-no-files-found: warn
