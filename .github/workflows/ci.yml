# GitHub Actions CI (025 E1/E2, closing O2/O3; 025b review round). Free on public repos.
#
# RUNNER SIZING — every job first writes a gradle.properties into its Gradle user home that
# sizes Gradle for the 2-vCPU runner (workers 2, no test forks, 2 GB daemons); the repo's
# gradle.properties is sized for the dev box and would oversubscribe this one
# (DEVELOPMENT.md §9.5).
#
# WHAT RUNS WHERE —
#
#   gate (ubuntu-latest, REQUIRES the runner's Docker daemon; 60-minute budget, #290, #669):
#     ./scripts/helm-check.sh               — the reference Helm chart (deploy/helm/datapipelines)
#         is linted and rendered by a PINNED helm binary (#411): `helm lint --strict` plus four
#         template cases — defaults render no `env:` block at all, both `duckdb.*` values render
#         exactly their two quoted entries, an `extraEnv` double-mapping of either DuckDB key is
#         refused with the template's own `fail` message, and a missing `existingSecret` is
#         refused — the render-TIME behaviour the Kotlin drift test can only pin textually.
#         The binary is downloaded from get.helm.sh and SHA-256-verified against an in-repo pin
#         of the release's checksum file before first use and every run
#         (scripts/helm-check.sh; bump: DEVELOPMENT.md §10.2, "Bumping helm"). Needs network.
#         CI-only: the pregate has no helm; a chart-check failure exits 1, tooling exits 2.
#     ./gradlew build ktlintCheck detekt   — the standard gate: assemble, unit tests,
#         ktlint, detekt, module-dependency verification, Kover. Two suites are EXCLUDED,
#         each run by a job of its own below: the E2E integration suite
#         (-x :tests:integration-tests:test) and, since #669, the browser suite — excluded
#         the way scripts/gate.sh excludes it: `-x :tests:browser-tests:test` with its
#         zero-test guard, plus an explicit `:tests:browser-tests:testClasses`, because `-x`
#         also drops the module's test compile and a browser test that no longer compiles
#         must stay red HERE. `check` still runs :tests:browser-tests:verifyBrowserShardPartition
#         (no browser, no JVM fork): the `browser` job's partition guard. The rest of the
#         unit suite runs, and 21 test files across 7 module source sets start
#         Testcontainers — so this job needs Docker. The original Docker-free
#         ("hermetic") design intent was dropped deliberately (025b/C1): excluding
#         those 21 files across 7 modules would leave real unit coverage unrun, and
#         Docker on ubuntu-latest is reliable. `build` also runs scripting's
#         `breachSuite` (#289, its own 512m JVM), off `check`.
#         BEFORE #669 the browser suite ran inside this step, serially, as its long pole:
#         20.4 of its 29.5 min on run 36334831413. "A job of its own would still compile the
#         app first and then run the same 20 min" (#290) held for ONE job, not for parallel
#         shards: on run 39689954314 (2026-10-21) the step took 56.9 min, and its last 41
#         waited on the browser suite alone (126 classes, 585 tests, 46.9 class-minutes).
#     coverage XML (Kover)                  — the reports come from the build step's own
#         execution data and NEVER re-run a test: an init script disables every Test task
#         by TYPE for that one invocation (so `test`, `breachSuite` or the next test task
#         cannot slip back in by name), and the integration module's report is excluded
#         explicitly — the build step never compiled its tests, so --offline cannot
#         resolve them. Until #290 this step re-ran tests on EVERY run: `modules/app`'s
#         build-info stamped a fresh build.time per Gradle invocation (until #292 made the
#         time opt-in), so everything downstream of the app — the whole browser suite — was
#         out of date again, and a FAILED test task is never up to date either.
#     Measured budget (#290): the four green gate jobs before the fix took 57.0, 48.8,
#         56.3 and 50.7 min (runs 36283937250, 36288656563, 36296091394, 36334831413) —
#         build step 33.7 / 28.3 / 32.8 / 29.5 min, the report step 22.7 / 19.0 / 22.6 /
#         20.1 min of re-run tests. Run 36369728753 (one red browser test, build step
#         36.2 min) was cancelled by the old 60-minute timeout 23.8 min into the report
#         step, the red buried under "cancelled". The job now budgets 90 min like
#         `integration`, and the build step has its own 70-minute ceiling so that even a
#         hung build leaves the report, the failure summary and the artifact their time.
#         2026-10-21 (#669): the build step grew to 60–68 min as the browser suite grew
#         (559 tests, run 39514670172) and hit 70 in runs 39348253765, 39501200887 and
#         39525815939 (the last a pure timeout, 502 browser tests passed, 0 failed). The
#         ceilings are raised to 100 (step) and 120 (job), keeping the 20-minute margin, as a
#         stopgap until #669 moves the browser suite into its own sharded job.
#         #669 (the structural fix): the browser suite is the `browser` job's. The step's
#         ceiling is 40 and the job's 60 — INITIAL values from the projection (the step
#         without the suite ≈ 17 min); the first run on `next` measures them and #669's
#         follow-up sets them from that measurement.
#     ./scripts/docs-audit.sh               — doc-structure checks over docs/ AND the served
#         manual: `:modules:mcp-server:docsExport` renders it into build/skill-docs first
#         (offline — the build step above resolved its classpath; 242a). No network.
#
#   browser (ubuntu-latest, Docker; three parallel legs, 60-minute budget each, #669):
#     ./gradlew :tests:browser-tests:test -x :tests:browser-tests:verifyTestsExecuted
#               -Pdp.browser.shard=<i>/3   — the Playwright browser suite, split across
#         `matrix.shard` 1..3 by buildSrc/src/main/kotlin/BrowserShards.kt: the *Test.kt
#         files are read from the tree at configuration, sorted (byte order), and leg i
#         takes every third from index i−1 — deterministic, complete and disjoint by
#         construction; a new class lands in a leg with no edit. Three is BROWSER_SHARDS:
#         a `-P` whose n disagrees with that constant is refused at configuration, so a
#         matrix that drifts from it is red on its first leg. Each leg is ONE test JVM
#         (dp.test.forks.e2e=1) with its own containers, app and Chromium — the per-JVM
#         fixture the unsharded suite had, so a leg boundary changes nothing a case
#         observes. The zero-test guard is excluded by name (a filtered run is red on it by
#         design); verifyBrowserShardExecuted finalizes the leg instead: exactly its classes
#         left a result file, none missing, none extra. Each leg names its failing tests on
#         its summary and uploads `browser-reports-<i>` (its JUnit XML), pass or fail.
#         fail-fast is off: a red leg never cancels the other two, and
#         `gh run rerun <id> --failed` re-runs only the red legs. ONE recount over a run is
#         `gate-reports` plus every `browser-reports-<i>` (DEVELOPMENT.md §9.4); its browser
#         `files=` equals the module's *Test.kt count, the equality the zero-test guard
#         enforced when the suite ran unsharded.
#         `browser-verdict` (needs: browser, always) is red unless every leg succeeded: the
#         ONE check name the `main` ruleset requires for the suite (owner ruling 2026-10-24).
#         Measured basis: the rule split run 39689954314's XML into legs of 14.6–16.8 min
#         of test time (the measured-weight optimum is 15.7); a leg also pays ≈ 10.5 min of
#         setup and app + browser-test compile. Budgets: step 45, job 60 — INITIAL, from
#         that ≈ 28 min projection; #669's follow-up sets them from the first measured run.
#
#   integration (ubuntu-latest, Docker available and used):
#     ./gradlew integrationTest             — the Testcontainers E2E suite AND the
#         JarSmokeE2eTest fat-jar boot smoke (its bootJar dependency is wired onto the
#         test task, so it always exercises the current tree). Deliberately a separate
#         job, not folded into gate: it adds several GB of images and minutes on top
#         of the unit suite — keeping it apart is what keeps `gate` fast and
#         required-check-ready. Uploads its test-result XML (the suites' application
#         logs ride in system-out) as `integration-reports`, pass or fail (154, #137).
#
#   cold-verify (E2, the T30 guard; no Docker, NO Gradle cache):
#     ./gradlew help :modules:app:bootJar resolveDependencyVerificationSurface
#                                     — against a COLD GRADLE_USER_HOME.
#         Gradle verifies verification-metadata.xml entries ONLY for artifacts it
#         DOWNLOADS, so warm caches — local or CI-cached — make metadata gaps
#         structurally invisible; a cold resolve is the only run that sees them (31
#         missing entries survived every warm gate until a containerized cold build).
#         Scope, stated honestly (widened 025b/C2): `help` resolves the
#         settings/root/buildSrc plugin graphs, `:modules:app:bootJar` resolves the
#         boot classpath, and resolveDependencyVerificationSurface resolves EVERY
#         resolvable configuration of EVERY project — runtimeClasspath AND
#         testRuntimeClasspath, the detekt/ktlint tool classpaths, Kover plumbing —
#         because test-only and tool-only artifacts were most of what T30 found, and
#         `bootJar` alone only ever touches runtime graphs. This job must NOT use the
#         Gradle cache action and must not inherit a warmed home.
#
# WHAT IS DELIBERATELY NOT HERE —
#   scripts/sample-data/verify.sh   Docker + GBs + minutes; a documented build-record
#                                   procedure (its own header), not a per-PR stage.
#   container-scan.sh / vuln-scan.sh network-dependent scanner stages; run locally or
#                                   as a scheduled job when the owner wants them.
#   secret-scan.sh                  needs the gitleaks binary; the pre-push hook is
#                                   the enforcement point (DEVELOPMENT.md).
#
# Branch protection (E3, owner-owned — see the 025 handback) began as `gate` on main, PRs
# only. Since 2026-10-09 ruleset 23246563 requires `gate`, `integration` and `cold-verify` for
# every SHA on main; #669 adds `browser-verdict` (owner ruling 2026-10-24 — the owner edits
# the ruleset; until then a browser-red SHA could reach main).
#
# PROMOTION FLOW (owner ruling 2026-10-09) — `next` is the gate, `main` is what passed it.
# The lander merges every delivered handback onto local main, runs scripts/gate.sh on the
# batch tip (every test but the browser suite, which that script excludes), pushes `main:next`,
# and this workflow — its `browser` job — is the browser suite's only full run, and the
# whole-batch check on a cold runner. On a green run the lander fast-forwards
# `origin/main` to the SAME SHA, so a `main` run repeats a verdict `next` already gave.
# A red run on `next` is read from `gh run view <id> --log-failed` plus the `gate-reports`
# and `browser-reports-<i>` artifacts; the fix lands as its own commit on main and `next` is
# pushed again (a red `browser` leg alone: `gh run rerun <id> --failed` first, if it may be a
# flake — the other legs keep their verdicts).

name: ci

on:
  push:
    branches: [main, next]
  pull_request:

# A newer push to the same ref cancels EVERY job of the older run, the browser legs included.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Supply-chain minimum (025b/C3): no job pushes, writes issues/PRs, or publishes —
# read-only repository content is the entire need. (setup-gradle's cache uses the
# Actions cache service token, not GITHUB_TOKEN scopes, so it is unaffected.)
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # 90 since #290 over a measured 48–57 min; 120 as #669's stopgap (2026-10-21); 60 since the
    # browser suite left this job (#669): the build step's 40 plus the reports' 20 (header).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # Size Gradle for THIS runner (2 vCPU / 7 GB), not for the repo's defaults, which
      # gradle.properties sizes for a 96-thread dev box (DEVELOPMENT.md §9.5). A per-machine
      # gradle.properties in the Gradle user home wins over the repo's — the documented
      # override path. At the repo defaults (workers 6, forked test JVMs, 3+4 GB daemons)
      # this runner is oversubscribed and load-sensitive UI assertions lose their race
      # (2026-09-13: an entrance animation measured 116.7 ms against its 120 ms floor).
      - name: size Gradle for the runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.workers.max=2
          org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
          kotlin.daemon.jvmargs=-Xmx2g
          dp.test.forks=1
          dp.test.forks.e2e=1
          dp.test.heap=1g
          EOF
      - name: every pinned test image still exists at its registry (cold — never the cache)
        run: ./scripts/verify-image-pins.sh
      - name: render the reference Helm chart (pinned helm — lint + the five template cases)
        run: ./scripts/helm-check.sh
      # #485: the wrapper safety self-test (verification slots, memory floor, pregate
      # planner and evidence guards) — fixture wrappers, a recording Gradle stand-in and
      # their own cache dir, no JVM; ~45 s on the dev box. flock ships in util-linux.
      - name: pregate and verification-lock self-test (fixtures, no JVM)
        run: ./scripts/pregate.sh --self-test
      - name: build, ktlint, detekt (full unit suite incl. Testcontainers — Docker required, see header)
        id: build
        # --continue: one red module must not stop the others — every module's tests and
        # coverage verification run, so a failure is read from the full picture (the local
        # gate has always run with it; 2026-09-14: a dag flake stopped CI before four modules
        # had tested, and the report step below then ran their suites instead of reporting).
        # Its own ceiling, 20 min under the job's: a hung build still leaves the steps below
        # (the reports, the failure summary, the artifact) their time (#290). 100 was #669's
        # stopgap (the browser suite took the step to 60–68 min); 40 since the suite is the
        # `browser` job's — excluded here the way scripts/gate.sh does, its test classes still
        # compiled (header). Initial, from the ≈ 17 min projection; #669 sets it from the measurement.
        timeout-minutes: 40
        run: >-
          ./gradlew build ktlintCheck detekt --continue
          -x :tests:integration-tests:test -x :tests:integration-tests:verifyTestsExecuted
          -x :tests:browser-tests:test -x :tests:browser-tests:verifyTestsExecuted :tests:browser-tests:testClasses
      # koverVerify writes only verify.err; the line-level XML the artifact below needs comes from
      # the report task, run AFTER the build so a failed verification still leaves the report.
      # It must NEVER run a test (#290): Kover 0.9.9's report tasks depend on every instrumented
      # test task (its docs: "Running one of these tasks automatically triggers the launch of all
      # test tasks"), and a task that failed — or, until #292, sat downstream of the app, whose
      # build-info stamped a new time per invocation — is not up to date, so this step used to re-run tests
      # for 19–24 minutes. The init script disables every Test task by type for this invocation
      # only (and detaches the zero-test guard each one is finalized by — the build step ran
      # them), and Kover reads the binary reports the build step's test JVMs already wrote. The
      # integration module is excluded by name: its tests were never compiled here, and
      # --offline cannot resolve them. A failure here is its own, named red — never `|| true`.
      - name: write the coverage XML reports (from the build step's data — no test re-runs)
        if: always()
        run: |
          cat > "$RUNNER_TEMP/no-test-tasks.init.gradle" <<'EOF'
          // #290 — this invocation reads the build step's coverage data; it runs no test. The
          // zero-test guards that finalize each test task judged the build step already; here
          // they would only re-judge a task that never ran, so they are detached too. In
          // afterEvaluate: the conventions attach the guards while the build scripts run.
          allprojects {
              afterEvaluate {
                  tasks.withType(Test).configureEach {
                      enabled = false
                      setFinalizedBy([])
                  }
              }
          }
          EOF
          ./gradlew koverXmlReport --init-script "$RUNNER_TEMP/no-test-tasks.init.gradle" \
            -x :tests:integration-tests:koverXmlReport --offline --continue \
            || { echo "::error title=coverage report::koverXmlReport failed on the build step's data (read this step's log; no test ran here)"; exit 1; }
      # The failing tests by NAME on the run's summary page (#290, #297): one script for every
      # job that runs tests (#669), so the gate's summary and each browser leg's have one shape —
      # its header has the escaping and unreadable-file rules. The build's outcome rides in env.
      - name: name the failing tests
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: python3 scripts/ci-name-failing-tests.py 'modules/*/build/test-results/*/*.xml' 'tests/*/build/test-results/*/*.xml'
      # The coverage and test-result XML, kept for a week, pass or fail: a coverage floor
      # that holds on the dev box and fails here (2026-09-14: pipeline-contract at 93.9065
      # against 94, the same 373 tests, 17 lines fewer covered) can only be diagnosed
      # line by line, and the runner's numbers were unreachable without this. Every test
      # task's results (`breachSuite` too) and the breach report dag-executor.md pastes (#290).
      # The browser suite's XML is no longer here (#669): each `browser` leg uploads its own
      # `browser-reports-<i>`, and the recount reads them together (DEVELOPMENT.md §9.4).
      - name: keep the coverage and test-result reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-reports
          path: |
            modules/*/build/reports/kover/report.xml
            modules/*/build/reports/kover/verify.err
            modules/*/build/test-results/*/*.xml
            modules/scripting/build/reports/jsonata-breach.md
          retention-days: 7
          if-no-files-found: warn
      - name: docs audit (the served manual exported first — 242a)
        run: |
          ./gradlew :modules:mcp-server:docsExport --offline -q
          ./scripts/docs-audit.sh

  # The Playwright browser suite, sharded (#669; header). Runs beside `gate`, never after it:
  # each leg compiles what it needs, so the run's wall clock is the slower of the two jobs.
  browser:
    runs-on: ubuntu-latest
    # The step's 45 plus 15 for setup, the summary and the artifact. Initial, from the ≈ 28 min
    # projection (header); #669 sets both from the first measured run.
    timeout-minutes: 60
    strategy:
      # One red leg must not cancel the others: every leg's verdict is read (and a red one
      # re-run alone, `gh run rerun <id> --failed`).
      fail-fast: false
      matrix:
        # 1..BrowserShards.BROWSER_SHARDS (buildSrc/src/main/kotlin/BrowserShards.kt). A list
        # that drifts from the constant is refused by the leg's own -P parse.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # Size Gradle for THIS runner (2 vCPU / 7 GB), not for the repo's defaults, which
      # gradle.properties sizes for a 96-thread dev box (DEVELOPMENT.md §9.5). A per-machine
      # gradle.properties in the Gradle user home wins over the repo's — the documented
      # override path. At the repo defaults (workers 6, forked test JVMs, 3+4 GB daemons)
      # this runner is oversubscribed and load-sensitive UI assertions lose their race
      # (2026-09-13: an entrance animation measured 116.7 ms against its 120 ms floor).
      # dp.test.forks.e2e=1: each leg is ONE test JVM, its classes in ClassName order.
      - name: size Gradle for the runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.workers.max=2
          org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
          kotlin.daemon.jvmargs=-Xmx2g
          dp.test.forks=1
          dp.test.forks.e2e=1
          dp.test.heap=1g
          EOF
      # The suite boots the pinned Postgres and Redis images (SharedBrowserE2e).
      - name: every pinned test image still exists at its registry (cold — never the cache)
        run: ./scripts/verify-image-pins.sh
      # The zero-test guard is excluded by name: a filtered run is red on it by design.
      # verifyBrowserShardExecuted finalizes `test` instead (exactly this leg's classes).
      # BrowserSuite reads GitHub's CI env var for its CI patience; no property is needed.
      - name: browser suite, shard ${{ matrix.shard }} of 3 (Playwright + Testcontainers — Docker required)
        id: build
        timeout-minutes: 45
        run: >-
          ./gradlew :tests:browser-tests:test -x :tests:browser-tests:verifyTestsExecuted
          -Pdp.browser.shard=${{ matrix.shard }}/3
      - name: name the failing tests
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: python3 scripts/ci-name-failing-tests.py 'tests/browser-tests/build/test-results/*/*.xml'
      # This leg's JUnit XML, kept for a week, pass or fail; the recount reads every leg's
      # beside gate-reports (DEVELOPMENT.md §9.4). `error`, not gate-reports' `warn`: a leg that
      # wrote no XML at all is a tooling event (the JVM never started, the step was cancelled
      # before its first class), and the missing artifact must not read as a quiet green leg.
      - name: keep the test-result reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-reports-${{ matrix.shard }}
          path: tests/browser-tests/build/test-results/test/*.xml
          retention-days: 7
          if-no-files-found: error

  # ONE stable required-check name over every browser leg, whatever BROWSER_SHARDS is (owner
  # ruling 2026-10-24, #669): until #669 the browser verdict rode inside the required `gate`
  # check; ruleset 23246563 requires `browser-verdict` beside gate/integration/cold-verify.
  # `always()`: a failed or cancelled leg must still produce THIS check, as a red — a skipped
  # required check would leave the SHA unmergeable with no reason on the page.
  browser-verdict:
    needs: browser
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every browser leg succeeded
        env:
          LEGS: ${{ needs.browser.result }}
        run: |
          echo "browser legs: $LEGS"
          [ "$LEGS" = success ] || { echo "::error title=browser suite::a browser leg did not succeed ($LEGS) — read its summary and browser-reports-<i>"; exit 1; }

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # Size Gradle for THIS runner (2 vCPU / 7 GB), not for the repo's defaults, which
      # gradle.properties sizes for a 96-thread dev box (DEVELOPMENT.md §9.5). A per-machine
      # gradle.properties in the Gradle user home wins over the repo's — the documented
      # override path. At the repo defaults (workers 6, forked test JVMs, 3+4 GB daemons)
      # this runner is oversubscribed and load-sensitive UI assertions lose their race
      # (2026-09-13: an entrance animation measured 116.7 ms against its 120 ms floor).
      - name: size Gradle for the runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.workers.max=2
          org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
          kotlin.daemon.jvmargs=-Xmx2g
          dp.test.forks=1
          dp.test.forks.e2e=1
          dp.test.heap=1g
          EOF
      - name: every pinned test image still exists at its registry (cold — never the cache)
        run: ./scripts/verify-image-pins.sh
      - name: integration tests + fat-jar smoke (Testcontainers; Docker required)
        run: ./gradlew integrationTest
      # The suite's test-result XML, kept for a week, pass or fail (154, #137). Every E2E suite
      # boots the application in the test JVM, so each file's system-out IS the application log
      # of that suite; a node_failed whose cause lives only in that log (2026-09-17: run
      # 35263013651 failed UnsizedNumericStagingIntegrationTest with nothing but the lifecycle
      # names, and the runner took the log with it) is diagnosable from the artifact alone.
      # Pass or fail, like gate-reports: a red run is read against the green one before it —
      # the heap and timing figures that decide an environment-vs-defect question live in both.
      - name: keep the test-result reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-reports
          path: tests/integration-tests/build/test-results/test/*.xml
          retention-days: 7
          if-no-files-found: warn

  cold-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      # NO setup-gradle cache here — a warm cache is exactly the blind spot this job
      # exists to close. GRADLE_USER_HOME points at a fresh dir so every dependency,
      # POM and module-metadata file is downloaded and therefore VERIFIED.
      # Size Gradle for THIS runner (2 vCPU / 7 GB), not for the repo's defaults, which
      # gradle.properties sizes for a 96-thread dev box (DEVELOPMENT.md §9.5). A per-machine
      # gradle.properties in the Gradle user home wins over the repo's — the documented
      # override path. At the repo defaults (workers 6, forked test JVMs, 3+4 GB daemons)
      # this runner is oversubscribed and load-sensitive UI assertions lose their race
      # (2026-09-13: an entrance animation measured 116.7 ms against its 120 ms floor).
      - name: size Gradle for the runner
        run: |
          mkdir -p ${{ runner.temp }}/cold-gradle-home
          cat >> ${{ runner.temp }}/cold-gradle-home/gradle.properties <<'EOF'
          org.gradle.workers.max=2
          org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
          kotlin.daemon.jvmargs=-Xmx2g
          dp.test.forks=1
          dp.test.forks.e2e=1
          dp.test.heap=1g
          EOF
      - name: cold-cache dependency verification (the T30 guard)
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/cold-gradle-home
        run: ./gradlew help :modules:app:bootJar resolveDependencyVerificationSurface
