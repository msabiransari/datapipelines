name: secret-scan

on:
  push:
    branches: [main, next]
  pull_request:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No Gradle tasks: this job needs no gradle.properties or Java setup.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Full-history secret scan
        shell: bash
        run: |
          rc=0
          ./scripts/secret-scan.sh || rc=$?
          case "$rc" in
            0) ;;
            1) exit 1 ;;
            *) echo 'secret-scan: tooling failure — no verdict' >&2; exit 2 ;;
          esac
      - name: Detection and allowlist self-test
        run: ./scripts/secret-scan-selftest.sh
      - name: Git-mode guard
        shell: bash
        run: |
          # Split the forbidden option so this guard does not match itself.
          if grep -nE -- '--no''-git' scripts/secret-scan*.sh .github/workflows/secret-scan.yml; then
            echo 'secret-scan: directory scan option forbidden; use Git mode' >&2
            exit 1
          else
            rc=$?
            if [ "$rc" -ne 1 ]; then
              echo 'secret-scan: mode guard tooling failure — no verdict' >&2
              exit 2
            fi
          fi
