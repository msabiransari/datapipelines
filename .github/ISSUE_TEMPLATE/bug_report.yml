name: Bug report
description: Something broke or behaved unexpectedly.
title: "[bug]: "
labels: ["bug", "beta-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying the beta. The two fields that make a report actionable
        fastest are the **version** and the **correlation id** — both are below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: A sentence each is enough.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
  - type: input
    id: version
    attributes:
      label: Version
      description: The build hash your deployment's `/health` endpoint reports, or the image tag you run.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - Browser UI
        - REST API
        - MCP tool
        - Published endpoint (/api/<category>/<version>/…)
        - CLI / app.sh
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Database engine, if one is involved
      description: Spelled as the API spells them (the `Dialect` wire names). Leave as "none / not sure" when no engine is involved.
      options:
        - none / not sure
        - POSTGRES
        - ORACLE
        - MSSQL
        - MYSQL
        - H2
        - DUCKDB
        - SQLITE
        - LAKE
  - type: input
    id: correlation-id
    attributes:
      label: Correlation id, if you have one
      description: The failed execution's `error.correlation_id`, the id in the UI's error toast, or the `correlation_id` in the REST error envelope.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste the relevant lines. Remove passwords, connection strings and API keys first.
