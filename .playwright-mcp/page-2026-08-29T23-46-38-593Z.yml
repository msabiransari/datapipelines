        - paragraph [ref=e41]: The agent loop
        - heading "How it works" [level=2] [ref=e42]
        - paragraph [ref=e43]: Agents are first-class principals here — not a plugin bolted onto a human UI. Your agent gets its own scoped credentials, its own protocol surface, and errors it can parse without scraping stack traces.
        - generic [ref=e44]:
          - list [ref=e45]:
            - listitem [ref=e46]:
              - heading "Mint an API key" [level=3] [ref=e47]
              - paragraph [ref=e48]:
                - text: Create it in the UI or with
                - code [ref=e49]: POST /api/v1/auth/api-keys
                - text: .
              - paragraph [ref=e50]:
                - text: Keys are shown once, stored Argon2id-hashed, carry hierarchical scopes (
                - code [ref=e51]: read
                - text: ","
                - code [ref=e52]: execute
                - text: ","
                - code [ref=e53]: author
                - text: ","
                - code [ref=e54]: admin
                - text: ) and are pinned to one workspace.
            - listitem [ref=e55]:
              - heading [level=3] [ref=e56]:
                - text: Point the agent at
                - code [ref=e57]: /mcp
              - paragraph [ref=e58]:
                - text: The MCP endpoint authenticates API keys only —
                - code [ref=e59]: DP-API-Key
                - text: header or
                - code [ref=e60]: Bearer dpk_…
                - text: . No cookies, no session roulette.
              - paragraph [ref=e61]: "Exactly 18 tools cover the full lifecycle: introspect datasources, author templates and pipelines, execute, inspect."
            - listitem [ref=e62]:
              - heading "Author as a JSON contract" [level=3] [ref=e63]
              - paragraph [ref=e64]: The agent creates a SQL template and a pipeline as declarative JSON — nodes, dependencies, parameters. Diffs review like code, because they are.
            - listitem [ref=e65]:
              - heading "Execute and watch" [level=3] [ref=e66]
              - paragraph [ref=e67]: Execution streams per-milestone events over SSE, with heartbeats, so the agent knows where things stand.
