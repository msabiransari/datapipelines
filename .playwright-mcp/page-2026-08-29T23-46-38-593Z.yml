        - paragraph [ref=e105]: Shipped, not promised
        - heading "What's in the box" [level=2] [ref=e106]
        - paragraph [ref=e107]: Every card below is running code today. Caveats included where they exist — honesty is the brand.
        - generic [ref=e108]:
          - article [ref=e109]:
            - heading "Versioned JSON contracts" [level=3] [ref=e113]
            - paragraph [ref=e114]:
              - text: Pipelines are declarative JSON —
              - code [ref=e115]: schema_version
              - text: ", nodes,"
              - code [ref=e116]: depends_on
              - text: ", parameters, settings. Every update mints a new immutable integer version, and the contract is additive-only."
          - article [ref=e117]:
            - heading "Freemarker SQL templates" [level=3] [ref=e120]
            - paragraph [ref=e121]: A whitelisted construct set with a save-time AST scan that rejects SSTI vectors. Templates version immutably, pipelines pin versions, and library templates import declaratively.
          - article [ref=e122]:
            - heading "Seven SQL dialects" [level=3] [ref=e126]
            - paragraph [ref=e127]: PostgreSQL, MySQL, SQL Server, Oracle, DuckDB, SQLite and H2 — one contract, seven engines.
            - paragraph [ref=e128]:
              - text: Oracle and MySQL drivers are opt-in for license reasons (
              - code [ref=e129]: "-Poracle"
              - text: /
              - code [ref=e130]: "-Pmysql"
              - text: ", or drop the jar in"
              - code [ref=e131]: lib/
              - text: ); a missing driver fails at save with
              - code [ref=e132]: datasource.driver_not_loaded
              - text: .
          - article [ref=e133]:
            - heading "Cross-engine staging joins" [level=3] [ref=e136]
            - paragraph [ref=e137]: Each execution gets its own isolated in-memory H2 tempdb — created at start, destroyed at end. Nodes stage ResultSets there, so downstream nodes join across engines.
          - article [ref=e138]:
            - heading "Pipeline composition" [level=3] [ref=e142]
            - paragraph [ref=e143]:
              - text: A
              - code [ref=e144]: PIPELINE
              - text: node executes a version-pinned child pipeline as a linked child execution — in-process, with lineage and family cancellation.
          - article [ref=e145]:
            - heading "Workspaces & team isolation" [level=3] [ref=e151]
            - paragraph [ref=e152]: Every request resolves exactly one workspace; all authored content is workspace-scoped; API keys are pinned to one workspace; roles are owner and member.
            - paragraph [ref=e153]: "The management UI ships: create, switch, manage members, a navbar switcher and add-by-email."
          - article [ref=e154]:
            - heading "OIDC SSO + scoped agent keys" [level=3] [ref=e158]
            - paragraph [ref=e159]: Humans sign in through OIDC SSO. Agents get their own API keys with hierarchical scopes — separate principals, separate blast radii.
          - article [ref=e160]:
            - heading "Live execution streams" [level=3] [ref=e163]
            - paragraph [ref=e164]:
              - code [ref=e165]: "POST /api/v1/pipelines/{id}/execute"
              - text: returns
              - code [ref=e166]: text/event-stream
              - text: with per-milestone events and heartbeats. No stream resumption — a dropped connection means starting a new execution.
          - article [ref=e167]:
            - heading "Pipeline graph view" [level=3] [ref=e173]
            - paragraph [ref=e174]: The editor renders the pipeline DAG, highlights nodes live from SSE, offers execute/cancel and a paged result preview.
            - paragraph [ref=e175]: "It's read-only in v1 by design: a visualization and execution surface, not an authoring surface. Authoring is agent-first."
          - article [ref=e176]:
            - heading "Read-only datasource governance" [level=3] [ref=e180]
            - paragraph [ref=e181]:
              - code [ref=e182]: is_readonly
              - text: forbids write-shaped uses — enforced at save time, at an executor backstop, and as Hikari
              - code [ref=e183]: readOnly
              - text: ". Admin-gated on globals. The flag is a contract, not containment: pair it with a SELECT-only DB user."
          - article [ref=e184]:
            - heading "Append-only audit log" [level=3] [ref=e188]
            - paragraph [ref=e189]: Logins, key lifecycle, scope denials, user admin, workspace events and credential decryption points — recorded with actor, cause and source IP.
          - article [ref=e190]:
            - heading "Catalogued error contract" [level=3] [ref=e194]
            - paragraph [ref=e195]:
              - text: Failures arrive as stable
              - code [ref=e196]: "{domain}.{entity}.{failure}"
              - text: codes in a uniform error envelope — a catalog enforced against the code by drift tests, and the same codes over MCP. Agents get errors they can branch on, not prose to parse.
