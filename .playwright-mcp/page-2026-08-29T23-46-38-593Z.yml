        - paragraph [ref=e261]: Runs on your hardware, under your policies. The defaults are paranoid so you don't have to be.
        - list [ref=e262]:
          - listitem [ref=e263]:
            - text: ✓
            - strong [ref=e264]: Authenticated by default.
            - text: Every endpoint requires auth unless it's explicitly allowlisted.
          - listitem [ref=e265]:
            - text: ✓
            - strong [ref=e266]: Encrypted credentials.
            - text: Datasource passwords are AES-256-GCM encrypted with the row name bound as AAD — and the app refuses to start without a valid key.
          - listitem [ref=e267]:
            - text: ✓
            - strong [ref=e268]: Least privilege as the documented pattern.
            - text: The demo provisions a SELECT-only database login; the same pattern is documented for your own datasources.
          - listitem [ref=e269]:
            - text: ✓
            - strong [ref=e270]: TLS is your job.
            - text: Terminate TLS at your own proxy — we don't pretend a built-in would fit every network.
