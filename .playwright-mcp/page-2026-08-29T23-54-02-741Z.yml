                - text: .
              - paragraph [ref=f1e47]:
                - text: Keys are shown once, stored Argon2id-hashed, carry hierarchical scopes (
                - code [ref=f1e48]: read
                - text: ","
                - code [ref=f1e49]: execute
                - text: ","
                - code [ref=f1e50]: author
                - text: ","
                - code [ref=f1e51]: admin
                - text: ) and are pinned to one workspace.
            - listitem [ref=f1e52]:
              - heading [level=3] [ref=f1e53]:
                - text: Point the agent at
                - code [ref=f1e54]: /mcp
              - paragraph [ref=f1e55]:
                - text: The MCP endpoint authenticates API keys only —
                - code [ref=f1e56]: DP-API-Key
                - text: header or
                - code [ref=f1e57]: Bearer dpk_…
                - text: . No cookies, no session roulette.
