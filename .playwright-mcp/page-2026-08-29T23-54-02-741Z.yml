        - paragraph [ref=f1e102]: Shipped, not promised
        - heading "What's in the box" [level=2] [ref=f1e103]
        - paragraph [ref=f1e104]: Every card below is running code today. Caveats included where they exist — honesty is the brand.
        - generic [ref=f1e105]:
          - article [ref=f1e106]:
            - heading "Versioned JSON contracts" [level=3] [ref=f1e110]
            - paragraph [ref=f1e111]:
              - text: Pipelines are declarative JSON —
              - code [ref=f1e112]: schema_version
              - text: ", nodes,"
              - code [ref=f1e113]: depends_on
              - text: ", parameters, settings. Every update mints a new immutable integer version, and the contract is additive-only."
          - article [ref=f1e114]:
            - heading "Freemarker SQL templates" [level=3] [ref=f1e117]
            - paragraph [ref=f1e118]: A whitelisted construct set with a save-time AST scan that rejects SSTI vectors. Templates version immutably, pipelines pin versions, and library templates import declaratively.
          - article [ref=f1e119]:
            - heading "Seven SQL dialects" [level=3] [ref=f1e123]
            - paragraph [ref=f1e124]: PostgreSQL, MySQL, SQL Server, Oracle, DuckDB, SQLite and H2 — one contract, seven engines.
            - paragraph [ref=f1e125]:
              - text: Oracle and MySQL drivers are opt-in for license reasons (
              - code [ref=f1e126]: "-Poracle"
              - text: /
              - code [ref=f1e127]: "-Pmysql"
              - text: ", or drop the jar in"
              - code [ref=f1e128]: lib/
              - text: ); a missing driver fails at save with
              - code [ref=f1e129]: datasource.driver_not_loaded
              - text: .
          - article [ref=f1e130]:
            - heading "Cross-engine staging joins" [level=3] [ref=f1e133]
            - paragraph [ref=f1e134]: Each execution gets its own isolated in-memory H2 tempdb — created at start, destroyed at end. Nodes stage ResultSets there, so downstream nodes join across engines.
          - article [ref=f1e135]:
            - heading "Pipeline composition" [level=3] [ref=f1e139]
            - paragraph [ref=f1e140]:
              - text: A
              - code [ref=f1e141]: PIPELINE
              - text: node executes a version-pinned child pipeline as a linked child execution — in-process, with lineage and family cancellation.
          - article [ref=f1e142]:
            - heading "Workspaces & team isolation" [level=3] [ref=f1e148]
            - paragraph [ref=f1e149]: Every request resolves exactly one workspace; all authored content is workspace-scoped; API keys are pinned to one workspace; roles are owner and member.
            - paragraph [ref=f1e150]: "The management UI ships: create, switch, manage members, a navbar switcher and add-by-email."
          - article [ref=f1e151]:
            - heading "OIDC SSO + scoped agent keys" [level=3] [ref=f1e155]
            - paragraph [ref=f1e156]: Humans sign in through OIDC SSO. Agents get their own API keys with hierarchical scopes — separate principals, separate blast radii.
          - article [ref=f1e157]:
            - heading "Live execution streams" [level=3] [ref=f1e160]
            - paragraph [ref=f1e161]:
              - code [ref=f1e162]: "POST /api/v1/pipelines/{id}/execute"
              - text: returns
              - code [ref=f1e163]: text/event-stream
              - text: with per-milestone events and heartbeats. No stream resumption — a dropped connection means starting a new execution.
          - article [ref=f1e164]:
            - heading "Pipeline graph view" [level=3] [ref=f1e170]
            - paragraph [ref=f1e171]: The editor renders the pipeline DAG, highlights nodes live from SSE, offers execute/cancel and a paged result preview.
            - paragraph [ref=f1e172]: "It's read-only in v1 by design: a visualization and execution surface, not an authoring surface. Authoring is agent-first."
          - article [ref=f1e173]:
            - heading "Read-only datasource governance" [level=3] [ref=f1e177]
            - paragraph [ref=f1e178]:
              - code [ref=f1e179]: is_readonly
              - text: forbids write-shaped uses — enforced at save time, at an executor backstop, and as Hikari
              - code [ref=f1e180]: readOnly
              - text: ". Admin-gated on globals. The flag is a contract, not containment: pair it with a SELECT-only DB user."
          - article [ref=f1e181]:
            - heading "Append-only audit log" [level=3] [ref=f1e185]
            - paragraph [ref=f1e186]: Logins, key lifecycle, scope denials, user admin, workspace events and credential decryption points — recorded with actor, cause and source IP.
          - article [ref=f1e187]:
            - heading "Catalogued error contract" [level=3] [ref=f1e191]
            - paragraph [ref=f1e192]:
              - text: Failures arrive as stable
              - code [ref=f1e193]: "{domain}.{entity}.{failure}"
              - text: codes in a uniform error envelope — a catalog enforced against the code by drift tests, and the same codes over MCP. Agents get errors they can branch on, not prose to parse.
