#  * log4j-api 2.24.3 (MEDIUM) — on the runtime classpath, but only as the
#    API facade pulled by log4j-to-slf4j (Spring Boot logging bridges INTO
#    slf4j/logback); log4j-core is absent and nothing logs through
#    MapMessage, the vulnerable path (improper encoding of non-finite
#    floating-point values). Smallest fix (2.25.5) is a minor-line bump
#    against the BOM — disproportionate for a facade-only exposure; flagged
#    in the handback as a candidate override if reviewers prefer.
#    Retire when the Spring Boot BOM ships log4j2 >= 2.25.5.

[[IgnoredVulns]]
id = "GHSA-qv9r-c865-cp47" # log4j-api 2.24.3 — facade only via log4j-to-slf4j, MapMessage path unused (triaged 2026-08-15)
reason = "log4j-api is present only as the log4j-to-slf4j facade (no log4j-core); the vulnerable MapMessage encoding path is never exercised"
ignoreUntil = 2027-02-15

#  * kotlin-gradle-plugin 2.4.10 (MEDIUM, build cache unsafe deserialization)
#    — BUILD tooling only (buildSrc classpath), never shipped. The vulnerable
#    path is the Gradle BUILD CACHE, which this repo does not enable (no
#    org.gradle.caching property anywhere; Gradle default is off), so a
#    poisoned cache entry can never be deserialized here. The only fix is
#    2.4.20-Beta1 — a pre-release, which the house version policy forbids.
#    Retire when Kotlin 2.4.20 STABLE ships: bump `kotlin` in the catalog.

[[IgnoredVulns]]
id = "GHSA-r937-wjx7-w2jp" # kotlin-gradle-plugin 2.4.10 — build tooling only, build cache disabled (triaged 2026-08-15)
reason = "kotlin-gradle-plugin is build-only tooling; the vulnerable build-cache deserialization path is unused (Gradle build cache not enabled); only fix is a pre-release"
ignoreUntil = 2027-02-15
