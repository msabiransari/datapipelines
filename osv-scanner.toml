# osv-scanner.toml — vulnerability ignore list for scripts/vuln-scan.sh.
#
# RULE: every [[IgnoredVulns]] entry carries a reason + date comment, and an
# ignoreUntil so it expires loudly instead of rotting. The security override
# pins (postgresql 42.7.13, jackson 2.21.5, netty 4.1.136.Final — see
# gradle/libs.versions.toml) exist BECAUSE of past advisories; a finding here
# means a NEW advisory against the pinned version, not a re-report of the
# fixed one.
#
# Triage of the first scan (2026-08-15), every entry verified against the
# GitHub Advisory API and the module lockfiles:
#
#  * logback-core 1.3.16 (3 LOWs) — appears ONLY in the `ktlint` configuration
#    (the linter's own runtime), never on a compile/runtime/test classpath;
#    the shipped logback is 1.5.34, already >= every first-patched version
#    below. Not fixable from here: the version is baked into the ktlint
#    distribution. Retire/revisit when the ktlint plugin ships logback 1.5.x.

[[IgnoredVulns]]
id = "GHSA-jhq6-gfmj-v8fx"   # logback 1.3.16 — ktlint tool classpath only, not shipped (triaged 2026-08-15)
reason = "logback-core 1.3.16 resolves only in the ktlint linter's own configuration; production/test classpaths carry 1.5.34 (patched)"
ignoreUntil = 2027-02-15

